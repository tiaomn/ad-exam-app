name: 打包 Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 编译可安装 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Capacitor 依赖
        run: npm install --no-audit --no-fund

      - name: 生成 Android 原生工程
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 写入小恐龙图标和启动图
        run: node tools/apply-android-assets.mjs

      - name: 编译 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../ad-exam.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ad-exam-apk
          path: ad-exam.apk
          if-no-files-found: error
          retention-days: 30
