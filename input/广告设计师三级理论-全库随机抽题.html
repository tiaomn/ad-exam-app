<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>广告设计师三级理论-全库随机抽题</title>
<style>
    :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --error: #c0392b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; color: #333; line-height: 1.6; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; }
    
    /* 首页样式 */
    .home-screen { padding: 60px 20px; text-align: center; }
    .home-screen h1 { font-size: 28px; color: var(--primary); margin-bottom: 15px; }
    .home-screen p { color: #666; margin-bottom: 30px; }
    .btn { display: inline-block; padding: 12px 30px; background: var(--accent); color: #fff; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; transition: transform 0.2s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3); }
    
    /* 答题页样式 */
    .quiz-screen { display: none; padding: 20px; }
    .progress-bar { height: 6px; background: #eee; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
    .q-card { margin-bottom: 25px; padding: 20px; border: 1px solid #eee; border-radius: 8px; background: #fff; }
    .q-title { font-size: 17px; font-weight: 600; margin-bottom: 15px; color: var(--primary); }
    .opt-list { list-style: none; }
    .opt-item { padding: 12px 15px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
    .opt-item:hover:not(.disabled) { background: #f0f7ff; border-color: var(--accent); }
    .opt-item.correct { border-color: var(--success); background: #eafaf1; color: var(--success); font-weight: 600; }
    .opt-item.wrong { border-color: var(--error); background: #fdedec; color: var(--error); }
    .opt-item.selected { border-color: var(--accent); background: #eaf2f8; }
    .opt-item.disabled { pointer-events: none; opacity: 0.7; }
    
    /* 解析样式 */
    .exp-box { margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 6px; font-size: 14px; display: none; border-left: 4px solid var(--accent); }
    .exp-box.show { display: block; animation: fadeIn 0.3s; }
    .exp-item { margin-bottom: 5px; }
    .is-c { color: var(--success); }
    .is-w { color: #7f8c8d; }
    .exp-warn { margin: 8px 0 10px; padding: 8px 10px; background: #fff8e6; border-left: 3px solid #e6a23c; color: #8a6d3b; font-size: 13px; }
    
    /* 结果页 */
    .result-screen { display: none; padding: 40px 20px; text-align: center; }
    .score-circle { width: 120px; height: 120px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; margin: 0 auto 20px; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="container">
    <!-- 首页 -->
    <div id="home-screen" class="home-screen">
        <h1>广告设计师三级理论<br>全库模拟系统</h1>
        <p>总题库：600题 | 每次随机抽取：100题<br>(单选67 + 判断17 + 多选16)</p>
        <button class="btn" onclick="startQuiz()">开始模拟考试</button>
    </div>

    <!-- 答题页 -->
    <div id="quiz-screen" class="quiz-screen">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div id="questions-wrapper"></div>
        <button class="btn" id="finish-btn" style="display:none; width:100%; margin-top:20px;" onclick="showResult()">提交试卷并查看成绩</button>
    </div>

    <!-- 结果页 -->
    <div id="result-screen" class="result-screen">
        <div class="score-circle" id="final-score">0%</div>
        <h2 id="result-text">考试结束</h2>
        <p id="stats-detail" style="margin: 15px 0; color: #666;"></p>
        <button class="btn" onclick="location.reload()">返回首页</button>
    </div>
</div>

<script>
/**
 * =================================================================
 *  完整题库数据区 (QUESTION_DB)
 *  共 580 题：单选 376 / 判断 98 / 多选 106
 *  t: 's'(单选), 'j'(判断), 'm'(多选)
 *  a: 答案索引(从0开始)，多选题为数组 [0, 2]
 *  e: 逐项解析（与 o 一一对应，说明正确项为何对、错误项为何错）
 * =================================================================
 */
const QUESTION_DB = [
    // ================= 单选题 (376 道) =================
    {id:1,t:'s',q:"成熟期的金文是（）",o:["A、墙盘铭","B、月又食","C、何尊铭","D、盂鼎"],a:0,e:["墙盘铭为西周中期器，笔画圆润结体匀整，是金文成熟期代表","月又食为商代甲骨卜辞，时代偏早，书风尚古拙","何尊铭属西周早期成王时，笔画雄肆，未臻成熟","大盂鼎为西周早期康王时器，书风浑厚，属早期作品"]},
    {id:2,t:'s',q:"在路径曲线线段上，方向线和方向点的位置决定了曲线段的（ ）",o:["A、方向","B、象素","C、角度","D、形状"],a:3,e:["方向线只标示曲线切线方向，不等于曲线段的形状","像素是位图最小单位，与路径方向线无关","方向线夹角只改变局部曲率，不能概括形状","方向线与方向点的位置改变曲率，决定曲线段的形状"]},
    {id:3,t:'s',q:"重复不会使设计产生的效果是（）",o:["A、安定与整齐","B、趣味性","C、呆板与平淡","D、规律的统一"],a:1,e:["重复形成秩序与节奏，产生安定整齐的效果","重复缺少变化，难以生趣，趣味要靠变异获得","过量重复导致呆板平淡，是重复的负面效果","等距等形反复出现，形成规律统一的秩序感"]},
    {id:4,t:'s',q:"非彩色所具有的属性为（）",o:["A、色相","B、饱和度","C、明度","D、纯度"],a:2,e:["色相是彩色的属性，非彩色没有色相","饱和度指彩色的纯洁程度，非彩色不具此属性","非彩色只有明暗差别，明度是其唯一属性","纯度即饱和度，属彩色属性，黑白灰没有"]},
    {id:5,t:'s',q:"在Photoshop中，( )可以快速的选择不连贯的、颜色相似的异形区域。",o:["A、矩形选框工具","B、椭圆选框工具","C、魔棒工具","D、吸管工具"],a:2,e:["矩形选框只能框选规则矩形，不能按颜色选取","椭圆选框限于椭圆区域，与颜色相似无关","魔棒按颜色容差选取相连或不连续的相似区域","吸管只拾取颜色样本，不生成选区"]},
    {id:6,t:'s',q:"视觉要素形态大小的比率是指广告版面的( )",o:["A、跳跃率","B、留白率","C、版面率","D、调和率"],a:0,e:["跳跃率指版面各视觉要素形态大小的比率","留白率指版面空白面积所占的比例","版面率指图版面积占版面的比例","调和指要素的协调程度，不是大小的比率"]},
    {id:7,t:'s',q:"下列不属于思维特性的是( )",o:["A、间接性","B、创造性","C、概括性","D、韵律性"],a:3,e:["间接性指借助已有经验间接反映事物","创造性指思维能突破经验产生新成果","概括性指反映事物的共同本质特征","韵律性属形式美法则，不是思维的特性"]},
    {id:8,t:'s',q:"在photohopCS3中,可以用来存储图像的颜色数据及选区的是（）",o:["A、蒙版","B、路径","C、图层","D、通道"],a:3,e:["蒙版以灰度遮罩控制显示，不记录颜色数据","路径保存矢量轮廓，不含图像颜色信息","图层存放图像内容与混合方式，颜色由通道记录","通道记录各原色数据并可保存Alpha选区"]},
    {id:9,t:'s',q:"让每一行的第一个字或字母均统一在左侧的轴线上,右边可长可短的是（）",o:["A、左右均齐","B、齐左","C、齐中","D、齐右"],a:1,e:["左右均齐两端对齐，行末也整齐无长短","齐左首字统一在左轴线，右端长短自由","齐中每行居中，左右两侧均参差不齐","齐右右端对齐，左端长短不齐"]},
    {id:10,t:'s',q:"标志设计最常见的有象形、抽象概括三种形式。（）",o:["A、音形组字","B、表象图形","C、中文字型","D、拉丁文字型"],a:1,e:["音形组字以字音字形组合成标，属文字型手法","表象图形取客观物象为原型，与象形抽象并列","中文字型标志属文字类别，不是图形分类","拉丁文字型标志同属文字标志，非图形形式"]},
    {id:11,t:'s',q:"粘性创意的原则不包括故事、情感的是（）",o:["A、简约","B、意外","C、策略","D、可信"],a:2,e:["简约即提炼核心信息，用一句话说清主张","意外用惊奇与反差抓住注意，属粘性原则","策略属广告运作层面，不在粘性六原则内","可信靠细节与数据支撑，使人相信主张"]},
    {id:12,t:'s',q:"感觉和知觉的途径有很多种，但对人的认识有重要作用的，首先是（）",o:["A、视觉","B、听觉","C、知觉","D、嗅觉"],a:0,e:["视觉获取外界信息量最大，是认识的首要途径","听觉次之，接收的信息量明显少于视觉","知觉是多种感觉的综合，本身不是途径","嗅觉对广告信息的认知作用十分有限"]},
    {id:13,t:'s',q:"在photoshop中有那种不属于通道（）",o:["A、彩色通道","B、Alpha通道","C、图片通道","D、路径通道"],a:2,e:["彩色通道记录RGB各原色信息，是基本通道","Alpha通道保存选区和透明度，属通道类型","图片通道并非Photoshop的通道分类，属生造名称","路径可存为通道并载入选区，与通道功能相关"]},
    {id:14,t:'s',q:"有广告图案是指平面广告的构图设计，不是其构成要素的（）",o:["A、插图","B、文字","C、结构","D、商标"],a:2,e:["插图是广告画面的构成要素，承担形象传达","文字即文案，是平面广告必备的构成要素","结构指画面组织关系，属构图手段而非要素","商标是广告必列的构成要素，标示品牌"]},
    {id:15,t:'s',q:"1759年，( )继承了在斯塔费德郡的家业并着手进行改革。",o:["A、奇彭代尔","B、韦奇伍德","C、博尔顿","D、哈格里夫斯"],a:1,e:["奇彭代尔为英国家具师，著橱柜制造者指南","韦奇伍德1759年继承斯塔福德郡陶业并改革","博尔顿与瓦特合作改良蒸汽机，属机械制造","哈格里夫斯1765年发明珍妮纺纱机，属纺织"]},
    {id:16,t:'s',q:"下面不是平面广告构成要素的是（）",o:["A、文案","B、图形","C、色彩","D、声音"],a:3,e:["文案是平面广告要素，承担诉求表达","图形是平面广告要素，传递视觉信息","色彩是平面广告要素，营造氛围与识别","声音属广播影视广告，平面广告无法承载"]},
    {id:17,t:'s',q:"新中国成立后,政务院于年7月颁布了《商标注册暂行条例》。（）",o:["A、1950","B、1951","C、1949","D、1952"],a:0,e:["1950年7月政务院颁布商标注册暂行条例","1951年并未颁布该条例，时间推后一年","1949年刚建国，商标注册条例尚未制定","1952年非该条例颁布年，条例已于1950年施行"]},
    {id:18,t:'s',q:"版式制作依据设计的进程，一般分为三个阶段进行考虑，包括版式制作的筹备阶段、版式的制作阶段和版式的( )。",o:["A、调整阶段","B、整合阶段","C、输出阶段","D、印刷阶段"],a:2,e:["调整属制作阶段内的修补，不是独立末段","整合在筹备与制作之间进行，非收尾阶段","版式制作最后为输出阶段，完成完稿交付","印刷由印厂完成，是输出之后的工序"]},
    {id:19,t:'s',q:"默写式头脑风暴法，又被称之为（）",o:["A、组合法","B、检核表法","C、635法","D、联想法"],a:2,e:["组合法把不同要素拼合，不采用默写轮转","检核表法按清单逐项提问，不作默写","6人5分钟写35个设想，故称635法","联想法由一事物推及另一事物，无固定人数"]},
    {id:20,t:'s',q:"下面那一项不属于草书类型（）",o:["A、今草","B、节草","C、章草","D、狂草"],a:1,e:["今草由章草演变，字势连绵一笔而下","节草并非草书体，草书只有章草今草狂草","章草为隶书的草写，字字独立波磔分明","狂草为唐代张旭怀素所创，笔势奔放连绵"]},
    {id:21,t:'s',q:"下列哪一项不属于平面广告方案中的关键要素（）",o:["A、大标题","B、图形","C、简短说明","D、色彩"],a:3,e:["大标题点明主题，是广告方案首要文案要素","图形承担视觉说服，是方案的关键要素","简短说明补充标题，属方案的文案要素","色彩属表现手段，不列入方案的内容要素"]},
    {id:22,t:'s',q:"标志设计中，关于共用图形的概念错误的是(　　)。",o:["A、若干图形共同使用一部分形或线","B、一形多义，多形共用","C、不是利用视觉的转换和联想所形成","D、相互利用，相辅相成"],a:2,e:["若干图形共用一部分形或线，是共用图形本义","一形多义多形共用，概括了共用图形特征","共用图形正靠视觉转换与联想产生双关趣味","相互利用相辅相成，体现共用图形的共生关系"]},
    {id:23,t:'s',q:"版式设计中的标题虽是整段或整篇文章的标题，但不一定千篇一律地置于(　　)之上，可作居中、横向、竖向或边置等编排处理。",o:["A、段首","B、段上","C、段中","D、段尾"],a:0,e:["标题不必固定于段首，可居中竖向或边置","标题置于段上是常规做法，统领全段内容","标题可插入段中作小标题，分段提示","标题也可置于段尾，起归结强调作用"]},
    {id:24,t:'s',q:"当使用绘图后，如何切换到吸管工具（）",o:["A、按住I","B、按住alt键","C、按住ctrl键","D、按住ctrl＋alt键"],a:0,e:["吸管工具快捷键为I键，按I即可切换","绘图时按Alt临时取样，松开回到原工具","Ctrl为控制键，多与字母组合执行命令","Ctrl加Alt多用于复制拖动，不切换吸管"]},
    {id:25,t:'s',q:"所谓广告定位是指广告主通过广告活动，使企业或品牌在消费者(）上确定位置的一种方法",o:["A、情感","B、态度","C、行为","D、心里"],a:3,e:["情感是广告诉求方式，不是定位的落点","态度改变是传播结果，非定位所在","行为属购买反应，位于心理之后","定位即在消费者心理占据独特位置"]},
    {id:26,t:'s',q:"对称是同等同量的平衡以下对称形式描述不正确的是（）",o:["A、以中轴线为轴心的左右对称","B、以水平线为基准的左右对称","C、以对称点为源的放射对称","D、以对称面出发的反转形式"],a:1,e:["以中轴线为轴的左右对称即轴对称，说法正确","以水平线为基准得到上下对称，不是左右","以对称点为中心向外放射，即放射对称","以对称面作镜像反转，即反转对称形式"]},
    {id:27,t:'s',q:"在版式设计中可以加强各部分相关元素的相似性和",o:["A、集合性","B、相关性","C、关联性","D、合成性"],a:0,e:["相似要素靠集合性归组，形成统一视觉整体","相关性指内容主题联系，非形式归组手段","关联性强调逻辑联系，不解决视觉聚合","合成性指要素叠合，与相似性归组不同"]},
    {id:28,t:'s',q:"目前在Internet上应用最为广泛的服务是（）",o:["A、FTP服务","B、服务","C、Telnet服务","D、Gopher服务"],a:1,e:["FTP用于文件上传下载，使用面窄于邮件","电子邮件用户最多，是应用最广泛的网络服务","Telnet用于远程登录，多为技术人员使用","Gopher为早期检索服务，现已基本淘汰"]},
    {id:29,t:'s',q:"在(　　)中输入数据后，数据以*号显示。",o:["A、密码文本框","B、单行文本框","C、多行文本框","D、数值文本框"],a:0,e:["密码框设掩码字符，输入内容以星号显示","单行文本框明文显示输入内容","多行文本框用于长文本，内容明文可见","数值文本框只校验数字，不隐去字符"]},
    {id:30,t:'s',q:"优秀的标志设计,除了应具备标志基本功能外,还应具备艺术性和科学性。（）",o:["A、普识性","B、介绍性","C、识别性","D、传播性"],a:2,e:["普识性非标志规范用语，标志讲识别而非普识","标志不承担详细介绍职能，介绍靠文案","识别性是标志传达信息的前提，必须鲜明","传播性是应用后的效果，非设计必备属性"]},
    {id:31,t:'s',q:"在Photoshop中，(　　)格式存储可以包含Alpha通道。",o:["A、PDF","B、EPS","C、JPEG","D、TIFF"],a:3,e:["PDF多用于跨平台文档交换，非Alpha存储首选","EPS封装页面描述语言，靠剪裁路径而非Alpha通道","JPEG为有损压缩格式，不保存Alpha透明通道","TIFF支持Alpha通道，可保存透明与选区"]},
    {id:32,t:'s',q:"Adobe Illustrator中，关于历史记录还原的说法正确的是( ).",o:["A、可以设定为99步还原","B、可以设定为200步还原","C、无设定选项，根据内存的大小无限还原","D、可以设定为50步还原"],a:2,e:["99步是Photoshop的还原设置，非本软件","200步还原无此设定，Illustrator不按步数","历史记录无步数设定，还原次数受内存限制","50步还原同样不是Illustrator的可选设置"]},
    {id:33,t:'s',q:"数字通常被认为是哪种字符？",o:["A、上行字符（Ascenders）","B、下行字符（Descenders）","C、大写字符（Capital）","D、中间字符（Medials）"],a:2,e:["上行字符指b d f等向上伸出的字母","下行字符指g p y等向下伸出的字母","数字高度与大写字母齐平，按大写字符处理","中间字符指x高度内的小写字母主体"]},
    {id:34,t:'s',q:"最早的字母符号是由古代（）创造的，后来的阿拉伯字母、希腊字母和罗马字母均由其演变而来",o:["A、腓尼基人","B、阿拉伯人","C、埃及人","D、罗马人"],a:0,e:["腓尼基人创二十二个辅音字母，为字母文字之源","阿拉伯字母晚于腓尼基字母，属后起文字","埃及人创圣书字，属表意文字非字母","罗马字母由希腊字母经埃特鲁里亚演变而来"]},
    {id:35,t:'s',q:"标志设计中，由(　　)的构思手法，不属于表象手法。",o:["A、出版业——书","B、铁路运输业——曲线","C、银行业——钱币","D、餐饮业——汉堡"],a:2,e:["书是出版业的直接物象，属表象手法","曲线取铁轨形态直接表物，仍属表象","钱币只作银行业的象征，非业务直接形象","汉堡是餐饮业的直接物象，属表象手法"]},
    {id:36,t:'s',q:"网页中插入Flash文件的后缀名称是(　　)。",o:["A、fla","B、swf","C、max","D、exe"],a:1,e:["fla为Flash源文件，需发布后才能上网","swf是发布后的动画格式，可直接嵌入网页","max为三维软件场景文件，网页不能播放","exe为可执行程序，不能嵌入网页播放"]},
    {id:37,t:'s',q:"早在春秋战国时期一些商人为了招揽顾客就开始在店铺门口挂上醒目的“幌子”,这些不同形式的“幌子”标志都是用表明该商业活动的内容,起到了简单明了、非常醒目的效果。（）",o:["A、简洁的图形","B、简要的书法文字","C、概括的图形、文字","D、简洁的实物形象"],a:2,e:["只说图形，遗漏幌子上的文字标示","只说书法文字，未含图形部分","幌子以概括图形配文字标明行业，简明醒目","幌子多为图形文字，不是悬挂的实物形象"]},
    {id:38,t:'s',q:"阿拉伯数字是12世纪经由（）传到欧洲去的",o:["A、法国","B、英国","C、印度","D、阿拉伯人"],a:3,e:["法国是传播途经地，不是传入欧洲的中介","英国接受较晚，非数字传入的渠道","印度是阿拉伯数字的发源地，非传播者","阿拉伯人把印度数字传入欧洲，故得此名"]},
    {id:39,t:'s',q:"烟草行业愿景是（）",o:["A、潜心做事、低调做人","B、责任烟草、诚信烟草、和谐烟草","C、报效国家、回报社会、成就员工","D、宽容开放、改革创新、敬业奉献"],a:1,e:["潜心做事低调做人是行为信条，非行业愿景","责任诚信和谐烟草是烟草行业的共同愿景","报效国家回报社会成就员工属行业使命","宽容开放改革创新敬业奉献属行业精神"]},
    {id:40,t:'s',q:"不属于广告的构成要素的有（）",o:["A、广告主","B、广告活动","C、广告过程","D、广告媒体"],a:2,e:["广告主是出资发布广告的主体，属基本要素","广告活动由要素组合运行，贯穿广告全程","广告过程是要素运作的流程，不属构成要素","广告媒体是信息传播载体，属基本要素"]},
    {id:41,t:'s',q:"广告语言主要有陈述语、口语()三种形式",o:["A、术语","B、俗语","C、熟语","D、诗语"],a:1,e:["专业术语限于行业内部使用，不属广告语言的三种形式。","正确，俗语通俗生动贴近大众，是广告语言的基本形式之一。","熟语含成语歇后语等固定短语，类别宽于广告所用俗语。","诗语是诗歌化的修辞表达，并非广告语言的独立形式。"]},
    {id:42,t:'s',q:"构成秩序美的原理没有下列哪一项有（）",o:["A、稳定与变化","B、比例与韵律","C、多样与统","D、对称与均"],a:0,e:["正确，秩序美讲比例韵律对称，稳定与变化属构图变化范畴。","比例与韵律是秩序美的核心原理，故未被排除在外。","多样统一是形式美总法则，属秩序美原理范围。","对称与均衡是秩序美的基本原理，不属例外项。"]},
    {id:43,t:'s',q:"殷周以来铸刻在钟鼎彝器上的铭文叫（）,是先秦书法的主要内容.",o:["A、金文","B、甲骨文","C、石鼓文","D、小篆"],a:0,e:["正确，殷周铸刻于钟鼎彝器上的铭文，是先秦书法主体。","甲骨文刻于龟甲兽骨用于占卜，非钟鼎彝器上的铭文。","石鼓文刻于石鼓，属战国石刻文字，晚于殷周金文。","小篆为秦代统一文字，由金文简化演变而来，时代更晚。"]},
    {id:44,t:'s',q:"《产生创意的方法》（《ATechniqueforProducingIdeas》）一书是（）所著",o:["A、詹姆斯·韦伯·扬","B、李奥·贝纳","C、奥斯本","D、乔治·葛里宾"],a:0,e:["正确，该书由韦伯·扬撰写，提出创意产生的五步法。","李奥·贝纳以万宝路广告闻名，未著此书。","奥斯本提出头脑风暴法，代表作为发挥想象力一书。","乔治·葛里宾是文案大师，以旅行者保险广告著称。"]},
    {id:45,t:'s',q:"变体字体的变化准则是：表现内容、功能第一、(　　)。",o:["A、形式统一","B、形式第二","C、形式独特","D、形式多样"],a:0,e:["正确，变体字须内容与形式统一，形式服从功能需要。","形式第二的说法片面，准则要求形式统一于内容。","独特只是手段，脱离内容统一的独特会损伤识别。","多样须以统一为前提，单纯求多样会破坏字体秩序。"]},
    {id:46,t:'s',q:"版式制作中几种不同字体大小使用时应注意统一，(　　)应使用同一种大小字体。错误地使用字体大小就像在宣传品中出现错别字一样让人感觉不舒服。",o:["A、副标题、正文","B、正文、图例","C、小标题、正文","D、副标题、小标题"],a:2,e:["副标题需大于正文以区分层级，不应与正文同号。","图例字号通常小于正文，与正文不采用同一大小。","正确，小标题与正文用同一字号，靠字重区分层级。","副标题层级高于小标题，字号应更大而非相同。"]},
    {id:47,t:'s',q:"在“图像→调整”子菜单中,不用于调整图像色彩的命令是（）",o:["A、去色","B、反相","C、替换颜色","D、曲线"],a:3,e:["去色把彩色图像转为灰度，直接改变画面色彩。","反相把颜色反转为其补色，属色彩调整命令。","替换颜色可定点更换色相与饱和度，属调色命令。","正确，曲线主要调整明暗色调，不直接更换画面色彩。"]},
    {id:48,t:'s',q:"我国的汉语拼音采用的是（）",o:["A、希腊字母","B、拉丁字母","C、罗马字母","D、阿拉伯字母"],a:2,e:["希腊字母形体为阿尔法贝塔，汉语拼音未采用。","拉丁字母与罗马字母同物异名，教材取罗马字母称谓。","正确，汉语拼音方案采用罗马字母记音，即拉丁字母。","阿拉伯字母自右向左书写，与拼音字母形体不同。"]},
    {id:49,t:'s',q:"隶书字体与篆书字体最大的区别是（）",o:["A、隶书呈现现代字体结字规律","B、篆书呈现现代字体结字规律","C、隶书书写效果清晰明了","D、篆书书写效果清晰明了"],a:0,e:["正确，隶书变圆转为方折，结字已接近今文字规律。","篆书线条圆转匀称，仍属古文字结字体系。","清晰易辨是书写结果，不是与篆书的根本区别。","篆书圆转缠绕，辨识度明显低于方折的隶书。"]},
    {id:50,t:'s',q:"据信，柯达彩色胶片公司一年投入的新产品研制费用就达数百亿美元。因此，每 当新产品上市，就必须通过广告向广大消费者宣讲新产品的性能、质量、工作原理以 及使用方法等涉及科学技术进步的新知识和新技术。这属于广告五项功能中的那一项（ ）",o:["A、鼓励 竞争、促进生产经营与管理的功能","B、沟通产销渠道、促进商品销售的功能","C、指导消费的功能","D、信息传播功能"],a:2,e:["此功能指推动企业改进管理、参与市场竞争。","此功能重在打通产销渠道、扩大商品销路。","正确，传播新产品科技知识，帮助消费者认识选购。","信息传播只是手段，落点仍在引导消费选择。"]},
    {id:51,t:'s',q:"广告道德作为一种职业道德，是广告人在从事广告活动中应遵循的(　　)，是广告活动中调节人们之间关系的行为准则和规范的总和。",o:["A、职业行为法则","B、职业行为修养","C、思想行为准则","D、广告行为准则"],a:2,e:["法则偏强制规范，未体现道德依靠内心自律的特征。","修养指自我修炼的过程，不是应遵循的准则总和。","正确，广告道德是思想与行为层面的准则规范总和。","仅限行为层面，遗漏思想准则，范围明显偏窄。"]},
    {id:52,t:'s',q:"在DreamweaverMX中,下面关于排版表格属性的说法错误的是（）",o:["A、可以设置宽度","B、可以设置高度","C、可以设置表格的背景颜色","D、可以设置单元格之间的距离但是不能设置单元格内部的内容和单元格边框之间的距离"],a:3,e:["宽度可在属性面板按像素或百分比设定。","表格高度同样可在属性面板中直接设定。","背景颜色可在表格属性中选取并设置。","错在断言不能设单元格边距，实际单元格边距可调。"]},
    {id:53,t:'s',q:"按照拉丁字母的基本结构，其字母可分为四类：（）",o:["A、组合字母、对称字母、特殊字母和圆形字母","B、组合字母、对称字母、方形字母和圆形字母","C、对称字母、不对称字母、特殊字母和方形字母","D、对称字母、不对称字母、特殊字母和圆形字母"],a:3,e:["组合字母不属基本结构分类，又与圆形字母混列。","组合字母非结构分类，且方形与圆形并列不当。","末类应为圆形字母，方形字母属误列分类。","正确，按外形结构分为对称、不对称、特殊与圆形四类。"]},
    {id:54,t:'s',q:"仓颉书由（）个字组成",o:["A、28","B、38","C、48","D、18"],a:0,e:["正确，传世仓颉书共二十八字，被视为最早汉字遗迹。","字数不符，仓颉书传本为二十八字而非三十八字。","四十八字数目夸大，与传本记载并不相符。","十八字偏少，与传本二十八字的记载不合。"]},
    {id:55,t:'s',q:"在职业道德修养中，从业人员应该遵循的基本要求是( )",o:["A、领导叫干啥就干啥","B、己所不欲，勿施于人","C、夹着尾巴做人","D、害人之心不可有，防人之心不可无"],a:1,e:["盲从上级缺少是非判断，不是职业道德修养的要求。","正确，推己及人体现尊重他人利益的职业操守。","指为人低调谨慎，未含推己及人的道德要求。","侧重自我防范，不属从业者应遵循的基本要求。"]},
    {id:56,t:'s',q:"现代标志经常采用的技法是（）",o:["A、借用","B、镶嵌","C、重叠","D、连接"],a:2,e:["借用是传统图案手法，现代标志中不如重叠常用。","镶嵌多用于工艺装饰，标志中少作主要技法。","正确，重叠组合图形产生层次与空间感，标志常用。","连接多用于字体连笔，非现代标志最常用技法。"]},
    {id:57,t:'s',q:"封泥和印章及印记是秦及秦以前时的凭证。（）",o:["A、商品交流","B、物品流通","C、书信往来","D、信物交递"],a:3,e:["封泥用于封缄文书，不承担商品交易凭证职能。","物品流通凭单据与封检，封泥核心仍在凭信。","封泥封缄简牍，作用在凭信而非书信往来本身。","正确，封泥印章用于封缄凭信，是信物交递的凭证。"]},
    {id:58,t:'s',q:"要打开“直方图”调板,可使用的菜单是（）",o:["A、图像","B、图层","C、窗口","D、选择"],a:2,e:["图像菜单管色彩调整与模式转换，不控制调板。","图层菜单管图层操作，没有调板显示命令。","正确，直方图调板在窗口菜单中勾选调出。","选择菜单管选区编辑，与调板显示无关。"]},
    {id:59,t:'s',q:"选择正文字体是，必须把字体的（ ）放在第一位。",o:["A、功能","B、美感","C、情感","D、形式"],a:0,e:["正确，正文以易读易识为首要，功能先于美感。","美感须服从阅读功能，不能置于正文选择首位。","情感表达多用于标题，正文仍以满足阅读为主。","形式为功能服务，单纯追求形式会妨碍阅读。"]},
    {id:60,t:'s',q:"执行(　　)命令，可以将对象的重叠部分修剪掉，从而创建不规则的图形。",o:["A、相交","B、群组","C、焊接","D、修剪"],a:3,e:["相交保留重叠部分，与修剪去掉重叠正相反。","群组只把对象组合在一起，不做形状裁切。","焊接把多个对象合并为单一轮廓，不裁切重叠。","正确，修剪以重叠区域裁切对象，可得不规则图形。"]},
    {id:61,t:'s',q:"如何把InDesign文档转化成PDF文档？",o:["A、把文档输出(Export) 为EPS格式，再使用Distiller转化","B、直接使用“输出(Export)”命令，格式选为PDF","C、直接把文档导出为PDF格式。","D、把文档另存(Save as)为EPS格式，再使用Distiller转化"],a:2,e:["先转EPS再经Distiller，多一道环节，非直接转换。","输出即导出的另一译名，与答案表述略有差别。","正确，用导出命令并把格式选为PDF即可直接生成。","另存为EPS不能生成PDF，属绕行的间接做法。"]},
    {id:62,t:'s',q:"“设计”一词的英文为（）",o:["A、advertisement","B、design","C、AE","D、disturb"],a:1,e:["advertisement意为广告，与设计一词无关。","正确，design意为设计、构思，即设计一词的英文。","AE指后期合成软件After Effects，非设计一词。","disturb意为打扰扰乱，与设计毫不相干。"]},
    {id:63,t:'s',q:"在JavaScript语言中，Mouseover将触发的事件为（）",o:["A、离开页面","B、鼠标离开","C、鼠标经过","D、鼠标单击"],a:2,e:["离开页面对应onunload事件，与鼠标经过无关。","鼠标离开对应onMouseOut，方向与移入相反。","正确，onMouseover在指针移入元素时触发。","鼠标单击对应onClick事件，与移入事件不同。"]},
    {id:64,t:'s',q:"Web能在不同操作系统和浏览器上显示的安全色种类为(　　)。",o:["A、4种","B、16种","C、216种","D、256种"],a:2,e:["四种远少于实际数量，216色才是安全色标准。","十六为基本色数，并非浏览器安全色总数。","正确，RGB各取六阶，6乘6乘6共得216色。","256是索引色总数，不是网络安全色数量。"]},
    {id:65,t:'s',q:"以下关于站点地图的说法，(　　)是错误的。",o:["A、站点地图可以虚拟出整个网站结构","B、站点地图只能建立一级链接关系","C、站点地图可以保存为图像","D、站点地图可以说是站点的蓝图"],a:1,e:["站点地图可完整呈现站点的层级与栏目结构。","错在只能一级的断言，站点地图可建多层链接。","站点地图可另存为图像文件，便于展示与归档。","站点地图反映整体结构，故被称为站点蓝图。"]},
    {id:66,t:'s',q:"法国圣罗朗化妆品与服饰公司的标志、美国IBM公司的标志、美国RCA电子公司标志、斯堪的纳维亚航空公司的“SAS”标志,是以企业或品牌名称的为创意表现策略（）",o:["A、内容或产品形态","B、名称的含义","C、首字母组合","D、抽象的图形符号"],a:2,e:["以产品外形为创意，此处标志并非产品形态。","以名称词义作图形，如壳牌取贝壳，非首字母。","正确，SAS取名称首字母组合成标志，字母即图形。","纯抽象符号不依赖字母，此处标志含字母组合。"]},
    {id:67,t:'s',q:"编排设计的任务:一是它信息发布的载体。二是（）",o:["A、能使读者在浏览版面的内容同时产生美的愉悦感与共鸣","B、看清楚信息","C、井井有条,排版新颖","D、画面美观"],a:0,e:["正确，编排既要传达信息，也要带来审美愉悦共鸣。","看清信息只对应第一项任务，未答第二项任务。","属具体编排手法，不是与信息载体并列的任务。","仅停留视觉美观，未涉及引发读者共鸣的审美任务。"]},
    {id:68,t:'s',q:"不属于按广告的覆盖地区划分的是（）",o:["A、全球性广告","B、全国性广告","C、区域性广告","D、企业形象广告"],a:3,e:["按覆盖全球范围划分的地区类别，属该分类体系。","按覆盖一国范围划分，属地区分类的一种。","按覆盖局部区域划分，属地区分类的一种。","正确，按内容目标划分，不属覆盖地区分类。"]},
    {id:69,t:'s',q:"干支记日起源于()",o:["A、商代","B、夏代","C、唐代","D、秦朝"],a:0,e:["正确，甲骨卜辞已见完整干支记日，起源可溯商代。","夏代尚无干支记日的实物证据，起源不在夏。","唐代沿用干支纪日，远晚于其起源时代。","秦承商周旧制，干支记日在秦以前已通行。"]},
    {id:70,t:'s',q:"广告文案创意的要求,概括起来是五个字,即“准、新、趣、()、奇",o:["A、灵","B、形","C、深","D、情"],a:3,e:["灵气属表达技巧，不在准新趣情奇五字之列。","形式属设计范畴，不是文案创意的五字要求。","深刻指内容深度，与五字创意要求不同。","正确，情指以情感人，与准新趣奇合为五字。"]},
    {id:71,t:'s',q:"19世纪以前，社会信息主要通过（）媒介进行传播",o:["A、招贴","B、电视","C、书籍","D、广播"],a:0,e:["正确，印刷招贴是19世纪以前主要的信息传播媒介。","电视20世纪才出现，19世纪以前并不存在。","书籍受众有限，未成为社会信息的主要媒介。","广播出现于20世纪20年代，晚于所问时代。"]},
    {id:72,t:'s',q:"(　　)不属于标志的抽象表现形式。",o:["A、数字造型为主的标志","B、圆点造型为主的标志","C、三角形造型为主的标志","D、正方形造型为主的标志"],a:0,e:["正确，数字造型属文字类标志，不归抽象几何表现。","圆点是纯几何形，属于标志的抽象表现形式。","三角形为几何形，属标志的抽象表现形式。","正方形为几何形，属标志的抽象表现形式。"]},
    {id:73,t:'s',q:"Photoshop中图象分辨率的单位是（）",o:["A、dpi","B、ppi","C、lpi","D、pixel"],a:0,e:["正确，dpi即每英寸点数，是图像分辨率的常用单位。","ppi指每英寸像素数，多用于描述屏幕像素密度。","lpi是每英寸网线数，用于印刷加网，非图像分辨率。","pixel是像素，属图像构成单位而非分辨率单位。"]},
    {id:74,t:'s',q:"活动创意往往需要进行游戏设计，不是游戏化的关键要素是（）",o:["A、目标","B、体验感","C、反馈机制","D、自愿参与"],a:1,e:["目标是游戏化关键要素，明确玩家追求的结果。","正确，体验感是整体效果，不属游戏化四大要素。","反馈机制是游戏化要素，即时告知玩家进展。","自愿参与是游戏化要素，玩家可自主选择加入。"]},
    {id:75,t:'s',q:"色彩的象征是由传统文化形成和人们在自然生活中对色彩的（）产生的",o:["A、心理印象","B、生理影响","C、习惯","D、个人喜好"],a:1,e:["心理印象侧重个体联想，不同于色彩引发的生理作用。","正确，色彩经视觉生理刺激形成共同象征意义。","习惯属后天养成，不是色彩象征的自然来源。","个人喜好因人而异，难以形成共同的象征意义。"]},
    {id:76,t:'s',q:"标志设计中，(　　)元素之间的关系属于象征关系。",o:["A、橄榄枝与和平","B、松鹤与松树","C、水与木头","D、火与烟"],a:0,e:["正确，橄榄枝是国际公认的和平象征符号。","松鹤与松树是并列物象，未构成象征与被象征。","水与木属五行并列元素，不构成象征关系。","火与烟是因果生成关系，不属象征关系。"]},
    {id:77,t:'s',q:"广告创意中不是3B原则的指（）",o:["A、美人","B、婴儿","C、小动物","D、植物"],a:3,e:["美人即Beauty，属3B原则所指三要素之一。","婴儿即Baby，属3B原则所指三要素之一。","小动物即Beast，属3B原则所指三要素之一。","正确，植物不属3B原则所指的美人婴儿动物。"]},
    {id:78,t:'s',q:"向网站服务器上传网页文件，下列描述错误是(　　)。",o:["A、可以使用Dreamweaver软件自身的上传工具","B、使用CuteFTP上传","C、用户可以选择将整个站点上传到服务器，也可以不封上传","D、使用EMAIL上传"],a:3,e:["可用站点管理面板内置上传工具传送文件。","CuteFTP是FTP工具，可上传网页文件。","站点管理支持整站上传，也可只传单个文件。","错误，电子邮件不能向服务器上传网页文件。"]},
    {id:79,t:'s',q:"20世纪30年代美国的著名设计师罗维设计的著名商标是（）",o:["A、大卫十字","B、可口可乐","C、壳牌","D、雀巢咖啡"],a:1,e:["大卫十字属宗教象征符号，与罗维设计无关。","正确，罗维改良可口可乐瓶型与标志，成为经典。","壳牌贝壳标志由罗维于1971年修改，非30年代作品。","雀巢标志为鸟巢哺雏图形，与罗维无关。"]},
    {id:80,t:'s',q:"（）人发明了楔形文字",o:["A、美国人","B、苏泊尔人","C、苏美尔人","D、印度人"],a:2,e:["美国建国很晚，与楔形文字的创造毫无关系。","苏泊尔是炊具品牌译名，不是古代民族名称。","正确，两河流域的苏美尔人创造了楔形文字。","印度古文字为印章文字，不是楔形文字。"]},
    {id:81,t:'s',q:"CMYK模式主要应用在印刷领域，CMYK代表了印刷上用的四种油墨",o:["A、青色、洋红、蓝色和黄色","B、红色、黄色、蓝色和绿色","C、四个名称为黑色","D、青色、洋红、黄色和黑色"],a:3,e:["蓝色属加色法原色，CMYK中无蓝色，末位应为黑","红黄蓝绿是色料或色光混合的通俗说法，非印刷四色","四色各有名称，只有K代表黑色，其余为青洋红黄","C青、M洋红、Y黄、K黑，即印刷所用四种油墨"]},
    {id:82,t:'s',q:"下列现象中,属于减光混合的是（）",o:["A、红颜料与蓝颜料混合","B、彩色电视机成像","C、三原色光的混合","D、不同颜色的毛线编织"],a:0,e:["颜料混合靠吸收减光，红加蓝得紫且明度降低","彩色电视由RGB色光相加成色，属加光混合","三原色光相加后明度升高、趋于白色，是加色法","毛线编织靠色点并置产生空间混合，不减光"]},
    {id:83,t:'s',q:"可以产生运动、活泼感的线是 ( ）",o:["A、折线","B、斜线","C、直线","D、水平线"],a:2,w:1,e:["折线转折生硬尖锐，多表现紧张与冲突，非活泼","斜线倾斜失衡，主要传递不稳定与方向动势","运动活泼感多由斜线承担，直线偏静","水平线横向伸展，视觉安静平稳，缺少运动倾向"]},
    {id:84,t:'s',q:"标志作为一种代表和象征，它的目的积极展现自己，让人能更快地看到它、欣赏它、记住它。而做到这一点，标志的（）是第一要素",o:["A、、完整统一","B、精炼简洁","C、新颖独特","D、概括大方"],a:2,e:["完整统一是整体形式要求，不解决引人注目的问题","精炼简洁是减细节求易记，不负责第一眼的吸引力","新颖独特才能从同类标志中跳出，引人注意并记住","概括大方属风格取向，缺乏独特性的识别强度"]},
    {id:85,t:'s',q:"标志按其实用功能分为商品标志、企业标志、单位团体标志、（）四大类",o:["A、城市标志","B、音乐海报标志","C、体育标志","D、公共识别标志"],a:3,e:["城市标志归入公共识别一类，不能与之并列成第四类","音乐海报标志按题材内容划分，非实用功能分类","体育标志依行业内容区分，不属功能分类的第四类","公共识别标志如交通与安全图形，服务公众辨识"]},
    {id:86,t:'s',q:"所谓版式设计,是在(版面空间里,将版面构成要素一文字、图形、线条、线框、色彩等各因素,根据内容的需要进行组合排列,并运用造型要素及形式原则,把构思用具体的视觉形式表达出来（）",o:["A、有限或在指定大小的","B、固定的","C、极小的","D、可大可小"],a:3,e:["指定大小只是报刊等特定媒介，概括不了全部版面","固定尺寸与海报、包装等可变开本的实际不符","极小版面仅指名片等特例，涵盖不了常规版面","版面随媒体开本变化可大可小，须按实际尺寸编排"]},
    {id:87,t:'s',q:"下列叙述中,不正确的是（）",o:["A、利用“渐变映射”命令可以在图像上按灰度级蒙上一种指定的渐变色,产生一种特殊的效果","B、在“渐变映射”对话框中,“灰度映射所用的渐变”可以选择也可以自定义","C、“阴影/高光”命令可用来调整曝光有问题的照片","D、在“阴影/高光”对话框中,阴影区域“数量”的百分比值越大,图像变暗的程度也越大"],a:3,e:["渐变映射按灰度级映射渐变色，可得特殊色调效果","灰度映射所用渐变既可选用预设，也可自行编辑","阴影高光可修复逆光、曝光不足等有问题的照片","阴影数量加大是提亮暗部，图像变亮而非变暗"]},
    {id:88,t:'s',q:"4A广告公司中的AE指的是（）",o:["A、客户总监","B、创意总监","C、客户主任","D、文案指导"],a:2,e:["客户总监为AD，统管客户部门，层级高于AE","创意总监为CD，统领创意与设计，不管客户对接","AE即Account Executive，译作客户主任，对接客户","文案指导负责文案把关，属创意部门的岗位"]},
    {id:89,t:'s',q:"网页的特征是（）",o:["A、HTML文档的基本特征——超文本","B、标识语言，网页中不能没有标记（Tag）","C、网页提供了一些措施以防在网上冲浪的过程中迷失方向","D、网页实现了对原文档信息的无限补充或扩展"],a:0,e:["网页本质是HTML超文本，靠链接组织非线性信息","标记只是编写手段，XML同样有标记，非网页特征","防迷失靠导航与站点结构设计，属交互层面","信息扩展依赖超链接与服务器，非网页固有属性"]},
    {id:90,t:'s',q:"为了使印刷品能很好地进行色彩还原，要求三原色油墨理想的色彩应该是",o:["A、色偏少、灰度低和反射效率低","B、色偏少、灰度高和反射效率低","C、色偏少、灰度高和反射效率高","D、色偏少、灰度低和反射效率高"],a:3,e:["反射效率低使油墨发暗，色彩还原灰暗不饱满","灰度高说明油墨含杂色多，印品呈色浑浊","高灰度与高反射难以并存，杂色多必然压低反射","色偏少则色相准，灰度低则纯度高，反射高则亮"]},
    {id:91,t:'s',q:"Illustratorcc中不属于导出格式是那个（）",o:["A、Illustratorcc（AI）","B、JPG","C、PNG","D、TIF"],a:0,e:["AI是Illustrator的本机文件格式，属存储而非导出","JPG为常用导出位图格式，便于预览与传输","PNG支持透明背景，是可导出格式之一","TIF适合印刷输出，可由Illustrator导出生成"]},
    {id:92,t:'s',q:"body元素用于背景颜色的属性是（）",o:["A、alink","B、vlink","C、bgcolor","D、background"],a:2,e:["alink设定鼠标按下时链接文字的颜色","vlink设定已访问过的链接文字颜色","bgcolor为body背景颜色属性，取色值或色名","background设定背景图像，不负责背景颜色"]},
    {id:93,t:'s',q:"如何修改文本的颜色？",o:["A、高亮选中文本后从“颜色（Color）”调板中选择一种颜色","B、高亮选中文本后从“变换（Transforni）”调板中选择一种颜色","C、选中文本块后在“颜色（Color）”调板中选择一种颜色","D、高亮选中文本后从“变换（Transforni）”调板中选择两种颜色"],a:0,e:["高亮选中文字后点颜色调板设色，只改所选字符","变换调板管位置缩放与旋转，没有颜色选项","仅选文本块会改整块文字，无法只改局部字符","变换调板无颜色功能，更不能一次设两种颜色"]},
    {id:94,t:'s',q:"在photohopCS6中,关于Alpha通道说法正确的是（）",o:["A、默认情况下,白色表示被完全选中的区域","B、默认情况下,黑色表示部分被选中的区域","C、Apha通道不能使用复制和粘贴命令","D、在Alpha通道中,选区被作为16为灰度图像保存"],a:0,e:["Alpha通道中白色对应选区，表示完全被选中","黑色表示未选中区域，灰色才表示部分选中","Alpha通道可复制粘贴，也能与选区互相转换","选区按8位灰度图保存，共256级而非16位"]},
    {id:95,t:'s',q:"图像必须是（ ）模式，才可以转换为位图模式",o:["A、多通道","B、索引颜色","C、灰度","D、RGB"],a:2,e:["多通道模式不能直接转位图，须先转为灰度","索引颜色受色板限制，需转灰度后再转位图","位图模式仅黑白两级，只能由灰度模式转换","RGB为彩色模式，转位图前必须先转成灰度"]},
    {id:96,t:'s',q:"版式设计中，(　　)可使版面获得完整、秩序、明了感和良好的视觉效果；反之，则杂乱不堪，造成视觉传达的障碍。",o:["A、秩序化","B、复杂化","C、对比化","D、单纯化"],a:3,e:["秩序化侧重排列规律，条理有余而删繁不足","复杂化增加要素层次，易致版面杂乱、传达受阻","对比化制造差异张力，刺激强而整体条理弱","单纯化删繁就简、统一要素，故完整明了有秩序"]},
    {id:97,t:'s',q:"线的两大系统是(　　)。",o:["A、长线和短线","B、直线和曲线","C、直线和虚线","D、直线和折线"],a:1,e:["长短只是线的长度差别，属同一系统的量的变化","直线与曲线概括线的基本形态，构成两大系统","虚线是直线的表现技法，不能与直线并列成系","折线由若干直线接合而成，归入直线系统"]},
    {id:98,t:'s',q:"在图形文件中进行颜色设定时应以",o:["A、颜色数值为准","B、感觉为准","C、打样为准","D、显示器为准"],a:1,w:1,e:["数值虽精确，却无法直接体现设计意图与观感","颜色应依CMYK数值定，凭感觉易偏色","打样是印前校验手段，用于检验而非设定颜色","显示器受色域与校准影响，所见颜色并不可靠"]},
    {id:99,t:'s',q:"不是杂志广告的制作要求（）",o:["A、录音合成","B、图文并茂","C、选好版面","D、形式多样"],a:0,e:["录音合成属广播影视广告工序，杂志无声音载体","图文并茂是杂志印刷媒体的基本制作要求","选好版面关乎版位与阅读顺序，必须加以考虑","形式多样由杂志印刷装订条件支持，确属要求"]},
    {id:100,t:'s',q:"印刷字体以文本形式为主要传播功能，强调视觉的（）",o:["A、统一性与标准性","B、适应性与标准性","C、适应性与美观性","D、统一性与美观性"],a:1,e:["统一性只求字形一致，忽略字号与场景的适应","印刷字体须适应多字号排版，又须字形规范统一","美观性属艺术字体的诉求，非文本传播首要","统一与美观并列，缺了正文字体必需的适应性"]},
    {id:101,t:'s',q:"价格是市场营销组合中的一个重要因素，直接影响产品销路和收益。在基本的定价方法中，(　　)是根据竞争者的销售价格，而不是根据企业产品成本或需求来定价。",o:["A、需求导向定价","B、成本导向定价","C、竞争导向定价","D、市场导向定价"],a:2,e:["需求导向依消费者需求与支付意愿定价","成本导向以成本加成定价，不看竞争者价格","竞争导向参照竞争者售价定价，不依自身成本","市场导向含义宽泛，题干已限定参照竞争价格"]},
    {id:102,t:'s',q:"CorelDRAW中，要使所选对象的顶部处于同一水平线上，可使用“对齐与分布”对话框里的“(　　)”命令。",o:["A、顶端对齐","B、中间对齐","C、底端对齐","D、垂直对齐"],a:1,w:1,e:["顶端对齐使各对象顶边齐平，即顶线同高","顶边同线应为顶端对齐，非中心对齐","底端对齐使底边齐平，顶部并不因此同线","垂直对齐是方向说明，含顶、中、底三种具体方式"]},
    {id:103,t:'s',q:"下面哪一项不属于文字的功能（）",o:["A、人与人的交流","B、文化的象征","C、视觉图形","D、陶冶情操"],a:3,e:["文字记录语言，实现人与人之间的信息交流","文字承载文化传统，是文化的象征符号","字体设计使文字具备图形化的视觉表现力","陶冶情操属审美教育效果，非文字的基本功能"]},
    {id:104,t:'s',q:"如果在图层上增加一个蒙版，当要单独移动蒙版时下面哪种操作是正确的（ ）",o:["A、首先单击图层上的蒙版，然后选择全选，用选择工具拖拉","B、首先要解除图层与蒙版之间的链接，然后选择移动工具就可以了","C、首先单击图层上的蒙版，然后选择移动工具就可以了","D、首先要解除图层与蒙版之间的链接，再选择蒙版，然后选择移动工具就可以移动了"],a:3,e:["全选后拖动会移动像素，并不改变蒙版位置","仅解除链接会随图层一起移动，无法单独移蒙版","单击蒙版后用移动工具仍随图层联动移动","解除链接并选中蒙版缩览图，再用移动工具移位"]},
    {id:105,t:'s',q:"以下那一项属于图形的形式美法则？(　　)",o:["A、对称均衡","B、分层部署","C、局部整体","D、分割错视"],a:0,e:["对称与均衡是形式美法则中稳衡关系的核心","分层部署属版面层级编排手法，非形式美法则","局部整体讲部分与整体关系，表述不成法则","分割错视属视错觉现象，不属形式美法则"]},
    {id:106,t:'s',q:"中国的书体,通常讲有“正草隶篆”。其中的“正书”指哪一字体（）",o:["A、隶书","B、古文","C、楷体","D、魏碑体"],a:2,e:["隶书与篆、楷并列，蚕头燕尾，不称正书","古文泛指先秦文字，早于正草隶篆的书体分类","正书即楷体，字形方正、笔画规范可为楷模","魏碑是楷书的碑刻变体，仍归入楷书范畴"]},
    {id:107,t:'s',q:"我国古代四大发明之一的雕版印刷技术发明于（），它对现代字体的完善与发展影响极大",o:["A、唐代","B、宋代","C、汉代","D、元代"],a:0,e:["唐代已有雕版印刷，现存唐咸通本可作实证","宋代雕版兴盛并出现活字，晚于雕版发明","汉代有纸与印章，尚未出现整版雕印技术","元代王祯改进木活字，远晚于唐代雕版"]},
    {id:108,t:'s',q:"在网页制作中，为了统计访问者的信息，了解他们的意见，我们可以用下述办法实现（）",o:["A、文字","B、表格","C、表单","D、框架"],a:2,e:["文字只能展示说明，无法收集访客的输入信息","表格用于规整排版数据，不能提交反馈内容","表单靠输入框与提交按钮收集意见和访问信息","框架用于页面分割与导航，不承担数据收集"]},
    {id:109,t:'s',q:"说服性广告目标的作用（）",o:["A、建立品牌偏好","B、鼓励消费者转向本企业品牌","C、改变顾客对产品属性的知觉","D、说服顾客马上购买产品"],a:2,e:["品牌偏好靠长期形象积累，非单次说服的直接作用","转向本品牌须先改变认知，是改变知觉后的结果","说服性广告以论据改变顾客对产品属性的知觉","劝说立即购买属促销行动号召，非说服的目标"]},
    {id:110,t:'s',q:"对某些笔划或偏旁进行相切处理，能使原来的字形产生出全新的形象。在相切中，切忌（）",o:["A、笔画构成上相切","B、形成统一风格的部位相切","C、随意或多重方向相切","D、线性走向相切"],a:2,e:["笔画构成上相切是常用手法，可使字形紧凑有力","统一风格部位相切能保持字形协调一致","随意或多重方向相切会破坏字形整体与识别","线性走向相切顺应笔势，属合理的处理方式"]},
    {id:111,t:'s',q:"PhotoshopCS3中使用矩形工具绘制矩形时默认的矩形选项是（）",o:["A、不受约束","B、固定大小","C、对齐像素","D、比例"],a:0,e:["不受约束为默认状态，可任意拖出矩形","固定大小须先输入宽高数值，需手动选择","对齐像素针对边缘锐利，不是默认的绘制方式","比例须先设定宽高比，同样要手动启用"]},
    {id:112,t:'s',q:"世界上使用最久的记日法是（）",o:["A、龟甲记日","B、干支记日","C、甲骨记日","D、书契记日"],a:1,e:["龟甲记日属甲骨占卜记录，使用范围有限","干支相配六十日一循环，通行最久沿用至今","甲骨记日与龟甲同指卜辞刻辞，非通行记日法","书契指刻写文书之事，不是一种记日方法"]},
    {id:113,t:'s',q:"毕昇发明了活字印刷术是（）",o:["A、公元11世纪","B、公元12世纪","C、公元13世纪","D、公元14世纪"],a:0,e:["毕昇于北宋庆历年间制泥活字，属公元11世纪","12世纪为南宋，活字术已流传数十年","13世纪出现木活字与转轮排字，晚于毕昇","14世纪雕版与活字并用，已非发明年代"]},
    {id:114,t:'s',q:"版面设计中点属于（）",o:["A、抽象形","B、具象形","C、寓意形","D、简洁形"],a:0,e:["点无具体物象轮廓，属抽象形的基本构成要素","具象形有可辨的物象外形，点不具备这种轮廓","寓意形靠象征联想表意，点本身不含寓意","简洁形指造型精简程度，不是形态分类概念"]},
    {id:115,t:'s',q:"动态网页与静态网页的区别（）",o:["A、有滚动字幕","B、有FLASH动画","C、用代码编写过程","D、有数据库"],a:0,w:1,e:["动态网页与数据库交互，滚动字幕静态页也有","FLASH动画只是媒体元素，静态页同样可嵌入","用代码编写是共同方式，静态页也由代码写成","有无数据库及服务器端脚本，才是动静网页之分"]},
    {id:116,t:'s',q:"下列关于包装说法错误的是（）",o:["A、包装是沟通生产者与消费者的桥梁","B、包装直接关系到产品的销量","C、包装设计最主要考虑的是美化产品","D、包装需成本合理化"],a:2,e:["包装连接生产者与消费者，承担信息与保护功能","包装影响货架识别与选择，直接关系产品销量","包装首要是保护商品与传递信息，美化居其次","成本合理化是包装设计必须遵守的经济要求"]},
    {id:117,t:'s',q:"HTML代码表示（）",o:["A、创建一个表格","B、开始表格中的每一行","C、开始一行中的每一个格子","D、设置表格头"],a:1,e:["创建表格用table标签，非该行标签的作用","tr表示表格中一行的开始，逐行组织单元格","开始一个单元格用td或th标签，不是tr","设置表头用th标签或thead，与tr分工不同"]},
    {id:118,t:'s',q:"一般的商品购买只要求消费者具有（）",o:["A、注意力","B、记忆","C、思维","D、比较和决策能力"],a:3,e:["注意力只在广告接触阶段起作用，购买还需判断","记忆帮助回忆品牌，不能替代权衡与取舍","思维是分析过程，购买更依赖比较与决断","一般商品购买需比较同类产品并作出购买决策"]},
    {id:119,t:'s',q:"经济广告又叫（）",o:["A、公益广告","B、企业观念广告","C、商业广告","D、销售现场广告"],a:2,e:["公益广告服务社会公共利益，不以营利为目的","企业观念广告侧重观念传达，属商业广告分支","经济广告以促销营利为目的，即商业广告","销售现场广告按投放场所划分，范围偏窄"]},
    {id:120,t:'s',q:"楷书、行书、草书三种字体的重要定型期是在（）",o:["A、魏晋时期","B、唐代","C、汉朝","D、北宋时期"],a:1,e:["魏晋是楷行草的萌发过渡期，法度尚未完备","唐代楷书法度完备，行草亦定型成熟，为定型期","汉代通行隶书，楷行草尚未成形","北宋以行书见长，属定型后的风格发展"]},
    {id:121,t:'s',q:"Dreamweaver属于()的网页制作工具",o:["A、标记型","B、所见即所得","C、编程型","D、图像处理型"],a:1,e:["标记型须手写HTML代码，不提供可视化编辑界面","所见即所得可边改边看，编辑效果即最终显示效果","编程型指用程序语言开发网页，非Dreamweaver定位","图像处理型处理像素图像，如Photoshop"]},
    {id:122,t:'s',q:"下列不能实现“色彩平衡”的是（）",o:["A、色彩平衡","B、色阶","C、曲线","D、色调分离"],a:3,e:["色彩平衡命令直接调节暗部中间调高光的色彩偏向","色阶可分通道调整明暗，校正偏色达到色彩平衡","曲线能分通道精确改变各色调的色彩倾向","色调分离只减少色阶层次，不改变色彩平衡关系"]},
    {id:123,t:'s',q:"线框在版面设计中常起的作用是（）",o:["A、强调作用","B、凸显作用","C、表现作用","D、稳定作用"],a:0,e:["线框以封闭轮廓界定重点，引导视线形成强调","凸显靠放大加粗与强对比，不是线框的主要作用","表现指整体风格呈现，线框只作辅助手段","稳定靠对称与重心平衡获得，线框不具备"]},
    {id:124,t:'s',q:"标志构思时，需要考虑很多方面，下面错误的是(　　)。",o:["A、设计对象的使用目的","B、作用对象的直观接受能力","C、不需要充分考虑标志实现的可行性","D、构思须慎重，力求深刻、巧妙"],a:2,e:["使用目的决定标志的设计方向与表现形式","受众接受能力影响标志的认知门槛与传播效果","可行性涉及工艺材料成本，构思时必须充分考虑","构思须慎重并力求深刻巧妙，是标志创意要求"]},
    {id:125,t:'s',q:"(　　)是指标志的构图紧凑、图形简练，这也是标志艺术必须遵循的结构美原则。",o:["A、特征美","B、凝练美","C、秩序美","D、复杂美"],a:1,e:["特征美指标志具有独特可辨的识别特征","凝练美指构图紧凑图形简练，符合结构美原则","秩序美指元素排列有规律、条理清晰","复杂美与简练相悖，标志忌讳繁琐堆砌"]},
    {id:126,t:'s',q:"在Photoshop中，(　　)是将钢笔工具切换为直接选择工具的快捷键。",o:["A、Shift键","B、Tab键","C、Alt键","D、Ctrl键"],a:3,e:["Shift用于约束角度或加选路径，不切换工具","Tab用于隐藏浮动面板，与工具切换无关","Alt在钢笔工具下切换为转换点工具","按住Ctrl可临时切换为直接选择工具调整锚点"]},
    {id:127,t:'s',q:"复合角点是一条直线和一条曲线的交点，这种节点有几条控制线（ ）条",o:["A、3","B、2","C、多","D、1"],a:2,e:["三条控制线不符合路径节点规格，最多两条","两条控制线是平滑点的特征，两侧均为曲线","复合角点连接直线与曲线，控制线可为多条","一条控制线只对应单侧角点，不能兼顾两侧"]},
    {id:128,t:'s',q:"下面那种工具选项可以将图案填充到选区内（ ）",o:["A、橡皮图章工具","B、喷枪工具","C、画笔工具","D、图案图章工具"],a:3,e:["橡皮图章复制图像像素，用于修补与仿制","喷枪以喷雾方式着色，只改变颜色不填图案","画笔绘制前景色笔触，不能填充图案","图案图章可用定义好的图案填充选区"]},
    {id:129,t:'s',q:"标志信息传播的基础（）",o:["A、造型识别","B、意义共享","C、意义互换","D、意义传达"],a:0,e:["造型识别是标志被认知的前提，构成传播基础","意义共享是传播达成之后的效果层次","意义互换不是标志信息传播的理论概念","意义传达是传播过程，须以造型识别为前提"]},
    {id:130,t:'s',q:"以下说法错误的是（）",o:["A、阈值可使彩色图像变为黑白2种色调的图像","B、阈值色阶变化范围0^255","C、在色阶对话框中选中自动按钮后图像以0%5%的比例调整图像亮度","D、去色可使图像成为灰度图像"],a:1,e:["阈值按亮度分界，把彩色图像转为黑白两色","阈值色阶实际范围为1至255，并非从0开始","自动色阶按0.5%比例裁切像素后调整亮度","去色去除饱和度，图像呈现灰度效果"]},
    {id:131,t:'s',q:"划定了汉文字古、今时期的分界线的是（）",o:["A、篆书","B、行书","C、楷书","D、隶书"],a:3,e:["篆书属古文字，尚未突破古文字体系","行书是隶变之后的今文字字体","楷书是今文字成熟形态，晚于分界点","隶书经隶变终结古文字，是古今文字分界线"]},
    {id:132,t:'s',q:"在客户端网页脚本语言中最为通用的是（）",o:["A、javascript","B、VB","C、Perl","D、ASP"],a:0,e:["JavaScript由浏览器直接解析，是通用客户端脚本","VB是桌面应用开发语言，不能嵌入网页运行","Perl多用于服务器端文本处理","ASP是服务器端技术，须由服务器解析执行"]},
    {id:133,t:'s',q:"图形符号的类型有：(　　)、自然图形符号、抽象图形符号、科学领域中的图形符号。",o:["A、传统图形符号","B、民族图形符号","C、写实图形符号","D、语言图形符号"],a:0,e:["传统图形符号与自然、抽象、科学符号并列","民族图形符号按文化归属划分，不在此分类","写实符号与自然图形符号所指重复","语言符号属文字系统，不是图形符号类别"]},
    {id:134,t:'s',q:"关于Flash视频说法错误的是(　　)。",o:["A、Flash视频的后缀名为.flv","B、Flash视频就是Flash动画","C、Flash视频采用帧间压缩方法","D、Flash视频可以有效地缩小文件体积，并且保证视频的质量"],a:1,e:["FLV是Flash视频的专用封装后缀","视频是编码影像流，动画是矢量时间轴作品","FLV采用帧间压缩减少相邻帧的数据冗余","帧间压缩可缩小体积并保持画面质量"]},
    {id:135,t:'s',q:"(　　)是专门研究文字的的视觉形象。",o:["A、书写方式","B、字体设计","C、图形设计","D、笔画造型"],a:1,e:["书写方式指书写行为与运笔习惯","字体设计专门研究文字的视觉形象与结构","图形设计的研究对象是图形而非字形","笔画造型只是字体设计中的一个环节"]},
    {id:136,t:'s',q:"战国时期秦国的石刻文字是（）",o:["A、金文","B、甲骨文","C、石鼓文","D、大篆"],a:2,e:["金文铸刻于青铜器，不属于石刻","甲骨文是商代占卜刻辞，时代更早","石鼓文是战国秦国刻在石鼓上的文字","大篆是字体统称，不特指某件石刻"]},
    {id:137,t:'s',q:"所谓版式设计，即在版面上将有限的视觉元素进行有机的排列组合，将(　　)个性化的表现出来，是一种具有个人风格和艺术特色的视觉传达方式。",o:["A、感性思维","B、理性思维","C、形象思维","D、逻辑思维"],a:1,e:["感性思维凭直觉情绪，难以形成版面秩序","版式把视觉元素按理性思维个性化呈现","形象思维借助具体形象，偏于图形本身","逻辑思维重推理，不直接对应版面表现"]},
    {id:138,t:'s',q:"CorelDRAW中，渐变填充对话框中有4种渐变类型是线形渐变、射线形渐变、(　　)、方角渐变。",o:["A、对角渐变","B、直角渐变","C、圆形渐变","D、圆锥形渐变"],a:3,e:["CorelDRAW渐变类型中没有对角渐变","直角渐变不是渐变填充的类型名称","圆形渐变与射线形渐变重复，非独立类型","四种类型为线形、射线形、圆锥形、方角"]},
    {id:139,t:'s',q:"在版式设计中，追求(　　)，有意制造某种神秘、无规则、不理量的空间，或者以追求幽默、风趣的表现形式来吸引读者，引起共鸣，乃是当今设计界在艺术风格上的流行趋势。",o:["A、图底关系","B、点线面的结合","C、多维空间","D、新颖独特的个性表现"],a:3,e:["图底关系指图形与背景之间的转换关系","点线面结合属于形式构成手法","多维空间指版面空间层次的表现方式","追求新颖独特的个性表现可制造神秘感"]},
    {id:140,t:'s',q:"PhotoshopCS3提供了更为完善的色彩和色调的调整功能,这些功能主要存放在菜单中（）",o:["A、图层","B、图像","C、选择","D、文件"],a:1,e:["图层菜单管理图层与蒙版操作","图像菜单下的调整命令集中色彩与色调功能","选择菜单管理选区的修改与存储","文件菜单负责文件存取与输出打印"]},
    {id:141,t:'s',q:"以下(　　)不是主要用于矢量图形设计的软件。",o:["A、CorelDRAW","B、Illustrator","C、Freehand","D、Photoshop"],a:3,e:["CorelDRAW以矢量绘图见长，非位图软件","Illustrator是矢量绘图软件，专长于路径图形","Freehand属矢量绘图软件，现已停更","Photoshop处理像素位图，不是矢量软件"]},
    {id:142,t:'s',q:"用户登陆页面不可能用到的是（）",o:["A、服务器行为检查新用户","B、绑定字段","C、用户身份验证","D、建立数据库"],a:1,e:["检查新用户属服务器行为，注册流程会调用","绑定字段用于动态数据显示，登录页无需输出记录","用户身份验证是登录页的核心服务器行为","建立数据库用于存放账号密码，登录前须有"]},
    {id:143,t:'s',q:"下面不属于广告创意观念的是（）",o:["A、文化派","B、艺术派","C、混血儿派","D、科学派"],a:0,e:["文化派不属广告创意观念，三大流派无此说","艺术派主张创意源于艺术表现与灵感","混血儿派主张艺术与科学结合产生创意","科学派强调以调查数据为依据进行创意"]},
    {id:144,t:'s',q:"所学网页页面构成有（）",o:["A、顶部（标题）","B、底部（注释）","C、正文","D、导航"],a:2,e:["顶部标题属页头区域，不是页面构成主体","底部注释为版权信息区，非页面主体内容","正文承载页面主要信息，是页面构成主体","导航是页头中的栏目条，属辅助元素"]},
    {id:145,t:'s',q:"点、线、面是版式设计中的（）",o:["A、基本样式","B、非基本样式","C、基本元素","D、非基本元素"],a:2,e:["基本样式指版面风格类型，不是构成单位","点线面是公认基本元素，称基本样式不当","点线面是版式设计最基本的构成元素","点线面确有构成作用，称非基本元素不妥"]},
    {id:146,t:'s',q:"以下关于通道的说法中,正确的是（）",o:["A、通道主要用于保存颜色数据,不能存储选区","B、所有颜色模式的图像至少包括2个通道","C、Alpha通道可以删除,颜色通道和专色通道不可以删除","D、Apha通道、颜色通道、专色通道都可以删除"],a:3,e:["Alpha通道专门存储选区，并非不能存储","灰度模式图像只有一个通道，不足两个","专色通道同样可以删除，故此项说法有误","Alpha与专色通道可删，颜色通道亦可删"]},
    {id:147,t:'s',q:"当使用“多边形工具”（Polygon Tool）时，按住下列哪个键就可以使某一边在拖拉鼠标绘制的过程中始终保持水平状态？",o:["A、空格键","B、Tab键","C、Command(Mac)/Ctrl(Win)键","D、Shift键"],a:3,e:["空格键用于平移视图或移动图形","Tab键用于隐藏面板以扩大工作区","Command或Ctrl用于切换或加选对象","按住Shift可约束角度使某一边保持水平"]},
    {id:148,t:'s',q:"对远程服务器上的文件进行维护时，通常采用的手段是（）",o:["A、POP3","B、FTP","C、SMTP","D、Gopher"],a:1,e:["POP3协议用于接收电子邮件，不传文件","FTP专门用于远程文件的上传下载与维护","SMTP协议用于发送电子邮件，与传文件无关","Gopher是早期菜单式信息检索协议"]},
    {id:149,t:'s',q:"在CorelDRAW中，要使所选(　　)的处于同一水平线上，该使用“对齐与分布”对话框里的“顶端对齐”命令。",o:["A、顶部","B、底部","C、中部","D、下部"],a:1,e:["顶部对齐统一上边缘，与底部同线不是一回事","底端对齐使各对象下边缘处于同一水平线","中部对齐以中心线为基准，不是边缘同线","下部不是对齐面板的基准选项，无法选取"]},
    {id:150,t:'s',q:"在我国传统象征寓意中,莲花象征（）",o:["A、洁净","B、贞洁","C、高雅","D、美丽"],a:0,e:["莲花出淤泥而不染，故象征洁净清正","贞洁多以梅花鸳鸯等意象表达","高雅常以兰花菊花象征","美丽多以牡丹芙蓉作比"]},
    {id:151,t:'s',q:"下列那句话是错误的（ ）",o:["A、如果文本块出现文本溢出的现象，可以通过调整文本块的大小以显示所有的文本","B、“特殊字距”选项只有在两个文字或字符之间插入光标时才能进行设置","C、图形必须放置在文本块之上才能进行文本绕图 D在文本转换为路径之前也可以对其进行渐变填充","D、在文本转换为路径之前也可以对其进行渐变填充"],a:1,e:["文本溢出后调大文本框可显示全文，说法成立","特殊字距可对整段文本调整，不限光标插入处","文本绕图需图形与文本块重叠才生效，说法成立","文本转路径前可渐变填充，该说法成立"]},
    {id:152,t:'s',q:"关于直线工具,以下说法正确的是（）",o:["A、只能绘制普通直线,不能绘制带箭头的直线","B、只能绘制普通直线和带单箭头的直线","C、绘制带箭头的直线是可以设置箭头的宽度、长度和四度","D、只能绘制45度角倍数的直线"],a:2,e:["直线工具可选箭头样式，能画带箭头直线","除单箭头外还可设双箭头等多种样式","箭头宽度、长度和凹度均可调，说法正确","按住Shift才约束45度倍数，并非只能画45度"]},
    {id:153,t:'s',q:"下面对渐变填充工具功能的描述哪一想是错误的（）",o:["A、如果在不创建选区的情况下填充渐变色，渐变工具将作用于整个图象","B、不能将设定好的渐变色存储为一个渐变色文件","C、可以任意定义和编辑渐变色，不管是两色、三色还是多色","D、在photoshopcc中共有五种渐变类型"],a:1,e:["无选区时渐变作用于整个图像，说法正确","渐变可存为渐变库文件供重复调用","渐变色可自定义两色三色或多色","Photoshop共提供线性径向角度对称菱形五种"]},
    {id:154,t:'s',q:"“尤里卡效应”是指（）",o:["A、形象闪现","B、灵感闪现","C、幻觉闪现","D、构思闪现"],a:1,e:["形象闪现指头脑中浮现具体形象","尤里卡效应指苦思之后灵感突然闪现","幻觉闪现属病理性知觉异常","构思闪现描述创意形成过程，非该效应"]},
    {id:155,t:'s',q:"按思维所借助媒介的不同，人们把思维分为（）、抽象思维、形象思维三大类型",o:["A、逻辑思维","B、直觉思维","C、灵感思维","D、具象思维"],a:2,e:["逻辑思维属抽象思维范畴，不是并列项","直觉思维未列入三大思维类型","灵感思维以顿悟为媒介，与抽象形象并列","具象思维是形象思维的别称，重复设置"]},
    {id:156,t:'s',q:"菱形标志是四方形的一种变体，具有（）的视觉效果",o:["A、对称","B、稳定","C、不稳定","D、平稳"],a:2,e:["对称指结构关系，不是菱形给人的视觉心理","稳定是正方形正放的视觉效果，菱形斜置不然","菱形尖角朝下，重心游移产生不稳定感","平稳与稳定同义，不符菱形的斜向张力"]},
    {id:157,t:'s',q:"印刷四色CMYK中的K是指（）",o:["A、蓝色","B、红色","C、黑色","D、黄色"],a:2,e:["蓝色在印刷四色中记作C，指青色","红色由品红与黄叠印而成，记作M加Y","K意为Key Plate，指印刷中的黑色版","黄色在四色中记作Y，不是K"]},
    {id:158,t:'s',q:"标志设计中,最大的特点是保持重心的稳定,所以无论是形状还是色彩等方式的组合,都能给人以心理上的不失重心的感觉,与“对称”相比,它显得自由、生动、活泼而富于变化（）",o:["A、调和关系","B、对比关系","C、节奏关系","D、均衡关系"],a:2,w:1,e:["调和指色彩或形态趋于一致的协调关系","对比指要素间差异形成的强烈视觉关系","重心稳定又自由变化属均衡","均衡侧重重量感平衡，与节奏的律动不同"]},
    {id:159,t:'s',q:"职业道德规范..“合作”的特征是( )",o:["A、牟利性、行业性、平等性","B、职业性、互利性、选择性","C、行业性、互利性、选择性","D、社会性、互利性、平等性"],a:3,e:["牟利性违背合作的互利与平等原则","职业性、选择性多用于描述竞争或流动","行业性、选择性不是合作规范的三大特征","合作具有社会性、互利性与平等性特征"]},
    {id:160,t:'s',q:"下面制作其它子页面的说法错误的是",o:["A、使用模板可以制作不同内容却风格一致的网页","B、在Dreamweaver中，没有模板的功能，需要安装插件","C、我们可以使用模板来保持网页的风格一致","D、各页面的风格保持一致很重要"],a:0,w:1,e:["模板套用可让各页风格一致","Dreamweaver自带模板功能，无需安装插件","模板可统一版式风格，保持各页一致","各页面风格保持一致有利于网站整体识别"]},
    {id:161,t:'s',q:"书籍、报刊的正文一种都采用（）",o:["A、黑体","B、宋体","C、行楷","D、新魏"],a:1,e:["黑体笔画粗细一致、无装饰角，醒目厚重，多用于标题而非正文","宋体横细竖粗、字形方正、笔画清晰，适合长文阅读，为书刊正文常用","行楷带连笔、书写感强，辨识度低，只宜作标题或装饰","新魏属魏碑变体，笔画方硬，装饰性强，不宜排正文"]},
    {id:162,t:'s',q:"一般情况下,行距要大于字距,行距大都为正文字号的（）",o:["A、二分之一","B、三分之一","C、四分之一","D、三分之二"],a:2,e:["四分之一字号的行距既分隔行次，又保持版面紧凑透气","二分之一字号行距偏大，行间松散，削弱阅读连贯","三分之一字号非通行行距取值，与字距比例失调","三分之二字号行距过宽，版面松散，容字量下降"]},
    {id:163,t:'s',q:"下列快捷键显示正确的是（）",o:["A、显示/隐藏网格线ctrl+”","B、显示/隐藏辅助线ctrl+","C、图像—调整—色相/饱和度ctrl+m","D、图像—调整—色阶ctrl+l"],a:1,w:1,e:["网格线开关应为Ctrl加单引号，加双引号不成立","辅助线即参考线，显示隐藏的快捷键为Ctrl加分号","色相饱和度快捷键是Ctrl加U，Ctrl加M对应曲线","色阶快捷键确为Ctrl加L，此项实际也成立"]},
    {id:164,t:'s',q:"RGB模式的简称是什么（）",o:["A、红色、绿红和蓝色","B、名称都是Alpha通道","C、名称为Black（黑色）的通道","D、青色、洋红和黄色"],a:0,e:["RGB即红绿蓝三原色，构成加色模式的三条颜色通道","Alpha通道用于存储选区，与RGB三原色简称无关","黑色通道属CMYK的K通道，RGB模式中并无黑通道","青、洋红、黄是CMYK减色模式的原色，并非RGB"]},
    {id:165,t:'s',q:"任何一个网站用三级结构实现时，位于最底层的是（）",o:["A、文章页","B、导航页","C、栏目页","D、首页"],a:0,e:["三级结构为首页、栏目页、文章页，文章页在最底层","导航页属浏览引导层，不构成站点结构的底层","栏目页位于第二级，汇总同类文章，起承上启下作用","首页是三级结构的最顶层入口，并非最底层"]},
    {id:166,t:'s',q:"当将CMKY模式的图像转换为多通道时，产生的通道名称是（ ）",o:["A、青色、洋红和黄色","B、青色、洋红、黄色和黑色","C、四个名称都是Alpha通道","D、四个名称为黑色的通道"],a:1,e:["缺少黑色通道，CMYK四色不全，与多通道生成结果不符","转为多通道后按青、洋红、黄、黑生成四个专色通道","多通道按原油墨色命名，不会都命名为Alpha通道","四个通道按油墨色分别命名，不会统一为黑色"]},
    {id:167,t:'s',q:"不属于版面设计应用范畴的是（）",o:["A、书籍设计","B、产品包装设计","C、建筑设计","D、招贴设计"],a:2,e:["书籍内文的版心、字号、行距编排，是版面设计典型应用","包装表面文字图形的编排，同属版面设计范畴","建筑设计处理三维空间与结构，不属平面版面编排","招贴的文字图形编排与视觉秩序，属版面设计"]},
    {id:168,t:'s',q:"根据自然界物形的性质，以下对图形的分类，错误的是(　　)。",o:["A、具象形和抽象形","B、正形和负形","C、静止形和运动形","D、规则形与不规则形"],a:3,e:["具象形与抽象形依物形性质划分，是正确分类","正形与负形按图底关系划分，属通行分类方式","静止形与运动形按形态倾向划分，属正确分类","规则与不规则按形态秩序划分，不属按物形性质的分类"]},
    {id:169,t:'s',q:"在Photoshop中，下列关于蒙版的描述错误的(　　)。",o:["A、快速蒙版的作用主要是用来进行选区的修饰","B、图层蒙版和图层矢量蒙版是不同类型的蒙版，它们之间是无法转换的","C、图层蒙版可转化为浮动的选择区域","D、当创建蒙版时，在通道调板中可看到临时的和蒙版相对应的Alpha通道"],a:1,e:["快速蒙版以临时通道形式修饰选区，说法正确","矢量蒙版可栅格化为图层蒙版，两者能够相互转换","图层蒙版可载入为浮动选区，说法正确","创建蒙版时通道面板会出现对应的临时Alpha通道"]},
    {id:170,t:'s',q:"在CorelDRAW中，可以将文件中矢量图形输出成(　　)格式的位图。",o:["A、WORD","B、TEX","C、JPG","D、ESC"],a:2,e:["WORD是文字文档格式，不能作为位图图像输出","TEX是排版源文件格式，并非位图图像格式","JPG是常用压缩位图格式，矢量图可导出为此格式","ESC不是图像文件格式，无法导出为位图"]},
    {id:171,t:'s',q:"标志色彩的研究和运用,在强调它的象征性的同时,色彩的（）功能是达到标志效果的又一重要因素",o:["A、冷暖感","B、视觉传达","C、审美","D、形状"],a:0,e:["冷暖感是色彩的心理感受，可强化标志的象征与识别","视觉传达泛指信息传递，非色彩自身的心理功能","审美功能侧重形式愉悦，不能解释色彩的冷暖效应","形状属图形要素，不是色彩的属性与功能"]},
    {id:172,t:'s',q:"（）是一种经过人们长期使用或约定俗成,通过专家们共同研究制定,被人们熟知并被广泛使用甚至在国际间通用的符号标记",o:["A、识别标志","B、形象标志","C、商标","D、标记、符号"],a:2,e:["识别标志重在区分辨认，未含约定俗成与国际通用之义","形象标志侧重图形形象塑造，非通用的记号标记","商标经长期使用注册，成为被广泛认知的专有符号标记","标记符号泛指各类记号，缺少商标的专有性与商业归属"]},
    {id:173,t:'s',q:"广告效果的衡量标准大致有三个，即传播效果、销售效果和（）",o:["A、持续效果","B、到达效果","C、心理效果","D、影响效果"],a:2,e:["持续效果指广告作用时间长短，不属三大衡量标准","到达效果是传播效果的组成部分，非独立标准","心理效果考察受众认知与态度变化，与传播销售并列","影响效果含义笼统，不是广告效果的三大标准之一"]},
    {id:174,t:'s',q:"从标志设计研究的角度看，关于标识和标志下列说法不正确的是（）",o:["A、标志具有特定性，一般由特殊的图案组合成","B、标识具有普遍性，一般由简单的记号表示出来","C、标志具有特定性，一般由特殊的图案组合成","D、标识和标志在现实生活中不存在着差异"],a:3,e:["标志具特定性，由特殊图案组合表意，说法正确","标识具普遍性，多以简单记号表示，说法正确","与首项表述重复，仍属正确说法，不作为错项","标识重普遍记号、标志重特定图案，现实中确有差异"]},
    {id:175,t:'s',q:"关于道德,正确的说法是（）",o:["A、道德在职业活动中不起作用","B、道德在公共生活中几乎不起作用","C、道德威力巨大,无坚不克","D、道德是调节社会关系的重要手段"],a:3,e:["道德通过职业规范约束从业行为，在职业活动中起作用","公共生活靠社会公德维系，道德的作用十分明显","道德依靠舆论与自律，不是无坚不克的强制力量","道德以善恶评价调节社会关系，是重要调节手段"]},
    {id:176,t:'s',q:"字体组合设计分为(　　)的组合设计、多词组的组合设计2种。",o:["A、少数词组","B、单一词组","C、简单词组","D、中文词组"],a:1,e:["少数词组仍属多词组范围，不能与多词组并列","单一词组组合指一个词内部字与字的搭配设计","简单词组表述不严谨，未反映词组数量的分类依据","中文词组按语种划分，不是组合设计的分类标准"]},
    {id:177,t:'s',q:"广播这种媒体的劣势是（）",o:["A、制作简便，传播迅速","B、覆盖面广，听众广泛","C、只能听声音","D、信息量大，费用较低"],a:2,e:["制作简便、传播迅速是广播的明显优势","覆盖面广、听众广泛属广播的优势表现","广播只有声音，缺乏视觉形象，难展示外观细节","信息量大、费用较低是广播的优势而非劣势"]},
    {id:178,t:'s',q:"“盖中盖”广告突出老人也需要补钙的特质，这则广告是采用哪种定位方法？",o:["A、市场定位","B、服务定位","C、价格定位","D、品质定位"],a:0,e:["以老年补钙人群为目标市场，按消费者群体细分定位","服务定位强调服务方式与水平，广告未涉及服务","价格定位以价格高低为诉求，广告未提价格","品质定位突出产品功效质量，此处诉求点是老年人群"]},
    {id:179,t:'s',q:"在Photoshop6中,使用形状工具以“像素”模式绘制图形时,下列说法正确的是（）",o:["A、将创建位图","B、可以设置“消除锯齿”,但不可以设置“不透明度”","C、将自动创建新的图层","D、在路径调板中将创建相应的工作路径"],a:0,e:["像素模式直接在当前图层填色，生成位图图像","像素模式可同时设置消除锯齿与不透明度，说法有误","像素模式不新建图层，直接在现用图层上绘制","像素模式不生成工作路径，路径模式才创建路径"]},
    {id:180,t:'s',q:"从业人员执行规程的步骤和要求是( )",o:["A、背诵操作规程、了解操作规程、坚持操作规程","B、牢记操作规程、改进操作规程、坚持操作规程","C、牢记操作规程、演练操作规程、坚持操作规程","D、牢记操作规程、演练操作规程、创新操作规程"],a:2,e:["只背诵与了解而缺演练，难以形成实际执行能力","改进规程属管理职责，不是人人执行的普遍步骤","牢记内容、演练技能、坚持落实，构成执行三步","创新规程超出执行范畴，且缺少坚持落实环节"]},
    {id:181,t:'s',q:"在网站设计中所有的站点结构都可以归结为（）",o:["A、两级结构","B、三级结构","C、四级结构","D、多级结构"],a:1,e:["两级结构仅首页与内容页，容纳不下栏目层级","首页、栏目页、文章页三级可涵盖各类站点结构","四级结构可归并入三级，不是最基本的归结","多级结构表述笼统，未概括站点的基本层级"]},
    {id:182,t:'s',q:"版式设计中韵律的作用不包含下列哪一项（）",o:["A、有节奏更有情调","B、增强版面的感染力","C、增加明朗的特性","D、开阔艺术的表现力"],a:2,e:["韵律使版面产生节奏，增强情调，属其作用","韵律的重复与渐变可增强版面感染力","明朗特性靠对比与留白形成，不是韵律的作用","韵律变化可开阔版面的艺术表现力"]},
    {id:183,t:'s',q:"下列影响通道的数量是（）",o:["A、图像大小","B、颜色模式","C、图像分辨率","D、图像格式"],a:1,e:["图像大小改变像素总量，不改变通道数量","RGB三通道、CMYK四通道，通道数由颜色模式决定","分辨率只改变像素密度，与通道数量无关","文件格式是存储方式，不影响通道数量"]},
    {id:184,t:'s',q:"(　　)的名称不属于标志命名中的趣味词汇。",o:["A、“康师傅”方便面","B、“懒汉”拖鞋","C、“冷狗”冰激凌","D、“狗不理”包子"],a:0,e:["康师傅取师傅尊称，属亲切称谓而非诙谐趣味命名","懒汉拖鞋以拟人调侃命名，富有生活趣味","冷狗冰激凌用反常搭配联想，属趣味词汇","狗不理包子含民间趣闻，属趣味命名"]},
    {id:185,t:'s',q:"字体(　　)是以文字、笔画造型为基本形进行平面构成的变化。",o:["A、类推变化","B、装饰变化","C、寓意变化","D、构成变化"],a:3,e:["类推变化由一字推演他字结构，不属平面构成","装饰变化添加纹样装饰，重在装饰而非构成","寓意变化以字形含意作创意，不是笔画构成","构成变化以笔画为基本形作平面构成重组"]},
    {id:186,t:'s',q:"绘制标准五角星使用的是什么工具（）",o:["A、喷枪","B、多边形索套","C、铅笔","D、多边形"],a:3,e:["喷枪用于喷涂颜色，画不出规则的星形轮廓","多边形套索用于建立多边形选区，不绘制图形","铅笔为手绘线条工具，难保证五角星标准","多边形工具设边数与星形缩进，可画标准五角星"]},
    {id:187,t:'s',q:"行书兴起于东汉末年，是介乎（）书和（）书之间的一种字体",o:["A、楷草","B、草隶","C、隶行","D、行草"],a:0,e:["行书兴起于东汉末，介于楷书与草书之间","草隶是隶书的草写体，不是行书所处的书体区间","隶行不含草书，与行书介于楷草之间不符","行草本义为行书的草化，不能用来界定行书"]},
    {id:188,t:'s',q:"下列有关滤镜的描述正确的是",o:["A、IllustratorCS4 中不能使用Photoshop的滤镜","B、将外挂滤镜模板放在Plug-Ins文件中，不用重新启动软件就可供Illustrator的文件使用","C、IllustratorCS4可以使用Photoshop的滤镜","D、将外挂滤镜模板放在IllustratorCS4的“帮助”文件夹中就可使用"],a:2,e:["与事实相反，Illustrator可调用部分Photoshop滤镜","外挂滤镜放入Plug-Ins后须重启软件才生效","Illustrator CS4支持Photoshop兼容滤镜，可互相调用","滤镜应放Plug-Ins文件夹，放帮助文件夹无效"]},
    {id:189,t:'s',q:"各种事物活动的“环境”是()",o:["A、意境","B、空间","C、位置","D、方向"],a:1,e:["意境是情景交融的艺术境界，不是活动环境","空间即各种事物活动所处的环境范围","位置只表明所在地点，不涵盖环境整体","方向指朝向方位，属方位要素而非环境"]},
    {id:190,t:'s',q:"标志的形象构成方式有：图形构成、文字构成、数字构成、（）四种",o:["A、位图构成","B、图片构成","C、综合构成","D、特殊符号"],a:2,e:["位图是图像类型，不是标志形象构成方式","图片构成与图形构成重复，不能并列成类","综合构成把图形文字数字结合使用，为第四类","特殊符号属图形构成范畴，不是独立方式"]},
    {id:191,t:'s',q:"美术字、装饰字体以及现在的创意字体都属于(　　)。",o:["A、手写字体","B、印刷字体","C、变体字体","D、装饰字体"],a:2,e:["手写字体指手书而成，与印刷变体不同","印刷字体指宋黑楷仿等标准字体，不含美术字","变体字体在印刷字体基础上变化笔画与形体","装饰字体只是变体中的一类，涵盖不全"]},
    {id:192,t:'s',q:"“横细竖粗,横划的右边及横竖转角处有装饰角。均齐、秀丽、典雅。多用于宣传印刷物的文字设计。”这是关于以下哪一字体的特征描述（）",o:["A、宋体","B、黑体","C、楷体","D、魏碑体"],a:0,e:["宋体横细竖粗，横划右端与转角处有装饰角","黑体笔画粗细一致，无装饰角，风格厚重","楷体接近手写，笔画圆润，无明显装饰角","魏碑体笔画方折雄强，不呈秀丽典雅之态"]},
    {id:193,t:'s',q:"商标是企业、商品及商务行业的（）",o:["A、直观化","B、指示化","C、形象化","D、审美化"],a:2,e:["直观化只表直接呈现，未含形象塑造的含义","指示化偏于指引识别，不概括商标的象征作用","商标以图形符号把企业商品形象化，便于识别记忆","审美化侧重形式美感，不是商标的本质属性"]},
    {id:194,t:'s',q:"楷书又被称为正书或真书，演变该字体的是汉代的（）",o:["A、隶书","B、草书","C、新魏","D、行书"],a:0,e:["楷书由隶书去掉波磔、化简省笔演变而来","草书是隶书的草率写法，不是楷书的直接来源","新魏是魏碑的变体美术字，晚于楷书形成","行书是楷书的快写体，出现在楷书之后"]},
    {id:195,t:'s',q:"表现明快、和谐并有些神秘的情感广告应选用（ ）",o:["A、纯度中对比","B、色相中对比","C、色相弱对比","D、明度中对比"],a:1,e:["纯度中对比突出鲜浊差异，明快却少含蓄神秘","色相中对比色彩丰富而调和，兼具明快与神秘","色相弱对比差别细微，易流于平淡缺乏生气","明度中对比只变深浅，色相单一难显神秘"]},
    {id:196,t:'s',q:"设定好的渐变色可存储在下面哪个浮动调板中",o:["A、色板","B、渐变","C、透明","D、颜色"],a:0,e:["设定好的渐变可存入色板调板，随时调用","渐变调板用于编辑渐变的颜色与位置，不存色样","透明度调板控制不透明度与混合模式，不存渐变","颜色调板用于调配颜色，不保存渐变样本"]},
    {id:197,t:'s',q:"利用轮廓线属性，可以调整轮廓线的颜色、粗细、(　　)。",o:["A、长度","B、宽度","C、笔头大小","D、笔头形状"],a:3,e:["长度由路径本身决定，不是轮廓线可调属性","宽度与粗细含义重复，非独立的可调属性","笔头大小属画笔工具设置，与轮廓线属性不同","轮廓线属性可设笔头形状，如箭头与端点样式"]},
    {id:198,t:'s',q:"力场的大小，与线的、粗细、（）有关",o:["A、虚实","B、远近","C、长短","D、曲直"],a:0,e:["线越粗越实，张力场越强，虚实直接影响力场大小","远近指线的位置距离，不改变线自身的力场","长短影响延伸范围，对力场大小作用较弱","曲直影响张力方向，不决定力场的大小"]},
    {id:199,t:'s',q:"图形创意的表现手法可以分为形的复合、(　　)、形的变异等三大类。",o:["A、形的置换","B、形的解构","C、形的同构","D、形的叠加"],a:2,e:["形的置换是同构中的具体手法，不能与同构并列","形的解构是分析过程，不属创意表现三大类","同构指不同形按共性结合，与复合、变异并列","形的叠加属复合的具体方式，层级低于三大类"]},
    {id:200,t:'s',q:"在笔划粗细的调整中，以下正确的是(　　)。",o:["A、主笔画要细，副笔画要细、外笔画要粗，内笔画要细","B、主笔画要细，副笔画要粗、外笔画要粗，内笔画要细","C、主笔画要粗，副笔画要细、外笔画要粗，内笔画要细","D、主笔画要粗，副笔画要细、外笔画要细，内笔画要粗"],a:2,e:["主笔画细会削弱字形骨架，结构松散无力","主笔细而副笔粗，主次颠倒，破坏字形结构","主笔与外围笔画加粗，副笔与内部笔画减细","外细内粗使字形外框薄弱，内部笔画拥塞"]},
    {id:201,t:'s',q:"执行命令，不能清除文档中的参考线",o:["A、“编辑”/“粘”","B、“视图”/“参考线”/“清除参考线”","C、“编辑”/“清除”","D、“编辑”/“剪切”"],a:0,e:["粘贴命令把剪贴板内容放入文档,不能清除参考线","视图菜单下的清除参考线命令正是删除参考线的操作","清除命令删除的是选中对象内容,不处理视图参考线","剪切命令只移走选中图形,参考线仍保留在页面"]},
    {id:202,t:'s',q:"以下哪种是标准的字符集？",o:["A、EBIDAC","B、True Type","C、ASCII","D、Post Script"],a:2,e:["该项拼写有误,EBCDIC仅为IBM大型机专用编码","TrueType是字形描述技术,不属于字符集标准","ASCII是美国信息交换标准代码,最通用的标准字符集","PostScript是页面描述语言,用于描述字体轮廓"]},
    {id:203,t:'s',q:"“大创意”观是从（）的观点出发，认为广告活动中涉及创造性领域的所有环节都可称之为创意",o:["A、广告是一门艺术","B、广告是一门技术","C、广告是一门科学","D、广告是意识形态"],a:2,e:["艺术观强调个人灵感表现,不涵盖全部创造环节","技术观关注制作工艺与媒介手段,与创意范畴无关","大创意观以广告是科学为前提,认为各创造环节皆属创意","意识形态说属传播批判视角,不是广告创意观念"]},
    {id:204,t:'s',q:"世界上应用最广泛的文字是（）",o:["A、汉字","B、罗马字","C、希腊文字","D、拉丁文字"],a:3,e:["汉字主要通行于汉字文化圈,使用范围有限","罗马字为拉丁字母旧称,标准表述应是拉丁文字","希腊文字仅用于希腊语及少量学术符号","拉丁文字随英语等语言传播,应用范围最广"]},
    {id:205,t:'s',q:"节点分为哪两种类型（ ）",o:["A、角点和圆点","B、平滑点和圆点","C、折点和圆点","D、平滑点和角点"],a:0,w:1,e:["节点规范分为平滑点与角点,圆点非节点类型","平滑点是节点类型之一,与圆点搭配不成立","折点指路径转折处,不属节点的分类术语","平滑点与角点按曲率是否连续划分,命名标准不同"]},
    {id:206,t:'s',q:"色命令的快捷键是（）",o:["A、Ctrl+M","B、Ctrl+L","C、Ctrl+U","D、Ctrl+Shift+U"],a:3,e:["Ctrl加M调出曲线命令,用于调整图像明暗","Ctrl加L为色阶命令,控制阶调与对比","Ctrl加U是色相饱和度命令,调整色彩三要素","Ctrl加Shift加U为去色命令,去除图像彩色信息"]},
    {id:207,t:'s',q:"版式设计中的(　　)归纳起来有：主次、大小、粗细、长短、疏密、多寡、动静、黑白、刚柔、虚实等，它们彼此渗透，相互并存。",o:["A、均衡","B、节奏","C、秩序","D、对比"],a:3,e:["均衡指版面轻重分布平衡,不涉及要素对立","节奏由重复渐变形成韵律,强调运动感","秩序追求统一规整,弱化要素间的差异","对比把主次大小疏密等对立因素并置,相互衬托"]},
    {id:208,t:'s',q:"消费者的情绪表现不是通过（）表现",o:["A、神态","B、表情","C、语气","D、环境"],a:3,e:["神态通过面部与眼神流露情绪,属直接表现","表情是情绪最直接的外部显现方式","语气借助声音高低缓急传达情绪状态","环境是外部的客观条件,本身不承载消费者情绪"]},
    {id:209,t:'s',q:"成绩录入系统不能用到的（）",o:["A、建立数据库","B、绑定插入记录集","C、检查表单","D、重复区域"],a:2,e:["建立数据库是成绩录入系统的数据存储基础","绑定插入记录集才能把表单数据写入数据表","检查表单用于校验用户输入,与成绩入库无关","重复区域用于批量显示多条记录,便于逐条核对"]},
    {id:210,t:'s',q:"在人、自然、社会的对应关系中,作为连结人和社会的精神装备的是（）",o:["A、视觉传达设计","B、产品设计","C、环境设计","D、舞台设计"],a:0,e:["视觉传达设计以图形文字联结人与社会的精神需求","产品设计是人与自然之间的物质器具装备","环境设计营造人生存活动的空间场所","舞台设计属演出综合空间艺术,服务表演需要"]},
    {id:211,t:'s',q:"宋体字的特征是：字型方正，横划与竖划的右上方有高耸的(　　)。",o:["A、节点","B、尖角","C、刀锋","D、笔顿"],a:3,e:["节点是矢量路径术语,与笔画装饰无关","尖角描述笔画末端锐利形态,非宋体装饰名称","刀锋指刻刀痕迹,与宋体笔顿的名称不同","笔顿即横竖画末端的三角形装饰,是宋体标志特征"]},
    {id:212,t:'s',q:"下面哪个是Dreamweaver的模板文件的扩展名",o:["A、txt","B、htm","C、html","D、dwt"],a:3,e:["txt是纯文本文件,不含网页结构标记","htm是静态网页文件扩展名,可直接浏览","html是网页文档扩展名,由浏览器解析","dwt是Dreamweaver模板文件专用扩展名"]},
    {id:213,t:'s',q:"版式设计中，(　　)是将文案排列成一条线或一个面或组合为一个形象，并成为插图的一部分，达成图文的相互融合，补充说明，且独具匠心的版式设计。",o:["A、文案的散组编排","B、文案的图形编排","C、文案的群组编排","D、文案的分割编排"],a:1,e:["散组编排把文案分散布置,未与插图融为一体","图形编排将文案排成线面或形象,融入插图之中","群组编排把文案集中成块,强调聚合而非融合","分割编排用文案划分版面区域,形成明显界限"]},
    {id:214,t:'s',q:"在Edit>Preference>General（编辑>预置>一般）对话框中可设定Constrain Angle（角度限制）的数值，它是用来：",o:["A、设定移动工具的角度","B、设定缩放工具的角度","C、设定旋转工具的角度","D、设定坐标轴的角度"],a:3,e:["移动工具的位移方向不受角度限制值约束","缩放沿坐标轴等比进行,与角度限制无关","旋转角度由拖动或对话框输入决定,不由此设定","角度限制设定坐标轴方向,成为旋转与绘制的基准"]},
    {id:215,t:'s',q:"若要弹出“描边路径”对话框,单击“路径”调板底部的“用画笔描边路径”按钮时按住的键是",o:["A、Alt","B、Shift","C、Ctrl","D、Shift'Ctrl"],a:0,e:["按住Alt单击描边按钮才会弹出描边路径对话框","Shift用于切换工具或加选,不会弹出对话框","Ctrl多用于快捷操作,无弹出该对话框的功能","Shift与Ctrl组合键不具备弹出对话框的功能"]},
    {id:216,t:'s',q:"标志的特征不包括（）为设计元素组成的",o:["A、识别性","B、新颖性","C、造型性","D、延展性"],a:1,e:["识别性是标志首要特征,便于快速辨认与记忆","新颖性是对创意表现的要求,不列入标志基本特征","造型性要求标志图形简洁规范,便于制作复制","延展性指标志能适应不同尺寸与媒介应用"]},
    {id:217,t:'s',q:"4A广告公司中的Traffic指的是（）",o:["A、流程员","B、设计人员","C、客户主任","D、文案"],a:0,e:["Traffic指流程员,负责创意制作流程的调度推进","设计人员对应Art,承担视觉表现工作","客户主任是Account Executive,负责客户沟通","文案对应Copywriter,负责广告文字撰写"]},
    {id:218,t:'s',q:"以下有关文字列表的说法错误的是(　　)。",o:["A、网页文件中可以把多种项目没有顺序地排列","B、有序列表和无序列表可以互相嵌套","C、无序列表应使用 UL 和 LI 标记符进行创建","D、列表不可以自己设置图像代替列表符号"],a:3,e:["网页中项目无顺序排列即构成无序列表","有序列表与无序列表可以相互嵌套使用","UL与LI标记正是创建无序列表的标签","列表可用list-style-image以图像替代项目符号"]},
    {id:219,t:'s',q:"只要印刷品上（）三块色版网点配比是正确的，其他颜色的三块色版网点配比也就可以肯定它也是正确的",o:["A、红色部分","B、绿色部分","C、蓝色部分","D、灰色部分"],a:3,e:["红色部分由品红与黄版构成,无法校验三色平衡","绿色部分由黄与青版构成,缺少品红参与","蓝色部分由青与品红版构成,缺少黄版","灰色部分三色版配比平衡,可判断整体色彩还原"]},
    {id:220,t:'s',q:"在印刷复制过程中，(　　)是目前使用最为广泛的一种网点。其原理是通过调整网点的大小来表现色彩的深浅，从而实现了色调的过渡。",o:["A、调幅网点","B、调频网点","C、网屏网点","D、阶调网点"],a:0,e:["调幅网点通过改变网点大小表现深浅,应用最广","调频网点以网点密集程度表现层次,不改变大小","网屏是分色加网的制版工具,不是网点类型","阶调指画面明暗层次,不是一种网点"]},
    {id:221,t:'s',q:"图形创意是介于文字与(　　)之间的视觉传达形式。",o:["A、艺术","B、书法","C、美术","D、标志"],a:2,e:["艺术涵盖范围过宽,不能界定图形创意的位置","书法属文字的书写艺术,仍在文字范畴内","图形创意介于文字与美术之间,兼具两者特征","标志是图形创意的应用成果,不是相邻门类"]},
    {id:222,t:'s',q:"版式设计的重心视觉流程，首先是从版面(　　)开始，然后顺沿形象的方向与力度的倾向来发展视线的进程。",o:["A、上部","B、下部","C、重心","D、四周"],a:2,e:["上部是自上而下视觉流程的起点","下部多作为视线落点,不是流程的起点","重心视觉流程由版面重心出发,再顺形象方向延伸","四周属放射或散点流程,视线由外向中心汇聚"]},
    {id:223,t:'s',q:"在概念阶段测定目标受众对不同创意思路的接受程度所做的调查是（）",o:["A、广告事后调查","B、广告战略调查","C、广告事前调查","D、创意概念调查"],a:3,e:["广告事后调查评估广告投放后的实际效果","广告战略调查确定市场定位与传播策略","广告事前调查测试广告作品的表现效果","创意概念调查在概念阶段测定受众对创意的接受度"]},
    {id:224,t:'s',q:"关于超级链接说法错误的是(　　)。",o:["A、超级链接的英文名字是Hypertext","B、超文本文档可以解释为“还存在与当前文档相连的其他文档”","C、链接的原有功能是单击鼠标时移动或打开其他相连的网页或文档","D、超级链接只能链接打开网页"],a:3,e:["Hypertext即超文本,依靠链接组织文档内容","超文本文档确实指与当前文档相连的其他文档","链接的原有功能是单击跳转打开其他网页或文档","超级链接还能指向图像、邮件地址与下载文件"]},
    {id:225,t:'s',q:"(　　)是由广告活动所处的社区公众、团体组织、经销商和行业竞争对手所构成的，能够对广告活动产生直接影响的环境因素。",o:["A、广告效果调查","B、广告环境","C、宏观环境因素","D、微观环境因素"],a:3,e:["广告效果调查是评估手段,不构成环境因素","广告环境是各类环境因素的总称","宏观环境指政治经济文化等间接影响因素","微观环境由社区公众、经销商与竞争者等直接因素构成"]},
    {id:226,t:'s',q:"纸张开法中(　　)是指全张纸按照单一方向的开法，即一律竖开或者一律横开的方法。",o:["A、叉开法","B、混合开纸法","C、正开法","D、全开法"],a:2,e:["叉开法把纸幅横竖交错开切,出纸形状不规则","混合开纸法在同一张纸上横竖开法并用","正开法全张纸一律竖开或一律横开,方向单一","全开法指不裁切的整张纸,不属开纸方法"]},
    {id:227,t:'s',q:"下列不属于标志功能的是（）",o:["A、商标因注册,从而在法律上使商品和企业得到保护","B、传达企业信息的目的","C、树立企业形象","D、提高产品的品质"],a:3,e:["商标注册后受法律保护,是标志的功能之一","标志能传达企业信息,便于公众识别","标志有助于树立统一的企业形象","标志只能传达形象,不能提高产品内在品质"]},
    {id:228,t:'s',q:"印刷版上水膜厚度与墨膜厚度的比值约为",o:["A、2:01","B、1:04","C、3:01","D、1:03"],a:3,e:["水膜与墨膜比为2比1时水膜过厚,易造成油墨乳化","1比4时墨膜偏厚,水墨平衡难以维持","3比1时水膜过厚,会稀释油墨并影响干燥","水膜厚度约为墨膜的三分之一,即1比3"]},
    {id:229,t:'s',q:"FTP服务所打开的默认端口号是（）",o:["A、80","B、8080","C、25","D、21"],a:3,e:["80是HTTP服务的默认端口","8080常作HTTP的备用端口,用于代理服务","25是SMTP邮件发送服务的端口","21是FTP服务默认的控制端口"]},
    {id:230,t:'s',q:"职业道德是人们在一定的职业活动范围内所遵守的(　　)的总和。",o:["A、道德修养","B、职业修养","C、行为规范","D、道德法规"],a:2,e:["道德修养指个人品德的自我锤炼,非职业规范总和","职业修养涵盖技能与素养,范围宽于职业道德","职业道德是职业活动范围内应遵守的行为规范总和","道德法规具强制约束力,职业道德主要靠自律"]},
    {id:231,t:'s',q:"设计的核心是（）",o:["A、科学技术","B、环境","C、文化","D、人"],a:2,e:["科学技术是设计实现的支撑手段,不是核心","环境是设计作用的外部条件与对象","设计以文化为内核,承载民族审美与价值观念","人是设计的服务对象,文化才是其内在核心"]},
    {id:232,t:'s',q:"平面设计中的创意表现为两种一是针对主题思想的创意；二是(　　)的设计创意。",o:["A、图底关系","B、字体","C、版面编排","D、图形"],a:2,e:["图底关系处理图形与背景的组织,属形式问题","字体设计针对字形结构,属文字范畴","版面编排创意与主题创意并列,构成两类创意","图形创意针对形象塑造,不涉及版面组织"]},
    {id:233,t:'s',q:"三角形在版面构成中具有（）",o:["A、稳定感","B、圆满感","C、稳重感","D、方向感"],a:0,e:["三角形底边宽稳,在版面中产生稳定感","圆满感由圆形产生,来自闭合无缺的轮廓","稳重感多指正方形与矩形的水平垂直结构","方向感多由斜线或箭头形成,三角形以稳定为主"]},
    {id:234,t:'s',q:"哪项不属于广义的大篆包括的内容（）",o:["A、甲骨文","B、金鼎文","C、金文","D、石鼓文"],a:1,e:["甲骨文属广义大篆范畴,是早期刻辞文字","金鼎文不是规范字体名称,与大篆分类不符","金文是广义大篆的主要代表,铸刻于青铜器","石鼓文为籀文代表,属大篆体系"]},
    {id:235,t:'s',q:"版面设计中最简单辨别和记忆的信息载体是（）",o:["A、文字","B、图片","C、图形","D、符号"],a:2,e:["文字需逐字识读,辨认速度慢于图形","图片细节丰富,记忆负担重于概括图形","图形概括直观,最易辨别与记忆","符号含义依赖约定,不理解则难以辨认"]},
    {id:236,t:'s',q:"在Photoshop中，下列关于动作的描述错误的是(　　)。",o:["A、使用“动作”调板可以记录、播放、编辑或删除单个动作。还可以存储和载入动作文件","B、ImageReady 中不允许创建动作“序列”（Set），但可以在 ImageReady Actions 文件夹中手工组织动作","C、Photoshop 和 ImageReady 附带了许多预定义的动作，不过 Photoshop 中的动作较 ImageReady 多很多。可以按原样使用这些预定义的动作，根据自己的需要对它们进行自定义，或者创建新的动作","D、在 Photoshop 和ImageReady中，都可以创建新动作“序列”（Set）以便更好地组织动作"],a:3,e:["动作调板可记录播放编辑删除动作并存载动作文件","ImageReady确实不允许创建动作序列,只能手工整理","两款软件均附预定义动作,且可自定义或新建","ImageReady不能建序列,两项皆可的说法有误"]},
    {id:237,t:'s',q:"图版率多大比例时,好感度反而降低（）",o:["A、50%","B、70%","C、80%","D、90%"],a:3,e:["图版率50%时图文均衡,仍属适宜区间","图版率70%图文比例尚可接受,好感度未降","图版率80%图版偏多,尚未引起反感","图版率达90%时文字信息几乎缺失,好感度下降"]},
    {id:238,t:'s',q:"平版印刷为了使印版图文部分和空白部分具有选择性吸附达到水墨平衡的目的，印版上各部分表面能的大小为",o:["A、空白部分>油墨>图文部分>润湿液","B、图文部分>润湿液>空白部分>油墨","C、图文部分>油墨>润湿液>空白部分","D、空白部分>润湿液>图文部分>油墨"],a:3,e:["该排序把油墨置于润湿液之前,与吸附规律相反","该排序颠倒图文与空白部分的表面能高低","图文部分表面能最低,不可能高于空白部分","空白部分表面能最高故亲水,图文最低故亲墨"]},
    {id:239,t:'s',q:"杂志、宣传册等需要形成一定的节奏来吸引受众，称为连续设计，版式制作过程中要按照(　　)把所有的元素都放在它们应有的位置上，然后进行调整。",o:["A、网格系统","B、连续系统","C、节奏系统","D、格式系统"],a:0,e:["网格系统按栏与基线定位元素,保证连续节奏","连续系统是设计类型,不是排版定位依据","节奏系统并非版式设计中的专业术语","格式系统不是版式制作中的定位方法"]},
    {id:240,t:'s',q:"广告调查的方法（）",o:["A、查阅资料","B、人员走访","C、电话采访","D、范围查询"],a:3,w:1,e:["查阅资料属二手资料调查,是常用调查方法","人员走访是实地访问调查的典型方式","电话采访是广告调查常用的电话访问法","范围查询是数据库检索操作,非调查方法"]},
    {id:241,t:'s',q:"图形创意的表现手法可以分为(　　)、形的同构、形的变异三大类？",o:["A、形的复合","B、形的置换","C、形的解构","D、形的夸张"],a:0,e:["形的复合指多个形态组合为新整体，是三大表现手法之一","形的置换是替换局部形态，属图形变异的具体手段","形的解构是拆解原形再重构，归入变异而非并列手法","形的夸张是夸大形态特征，属变异范围内的做法"]},
    {id:242,t:'s',q:"在早期的希腊、罗马文件中是没有标点符号的，文章中的句子用小点分开，直到15世纪，标点符号才变得规范与完整，这得力于（）",o:["A、文艺复兴运动","B、工艺美术革新运动","C、印刷业的发展","D、哥特式字体的发展"],a:2,e:["文艺复兴推动文艺与字体革新，与标点规范化无直接因果","工艺美术革新运动发生在19世纪，时间远晚于15世纪","15世纪活字印刷普及，促使标点符号规范并广泛使用","哥特字体改变的是字形笔画，不负责标点体系规范"]},
    {id:243,t:'s',q:"消费者广告的诉求对象为直接消费者，是由生产者或商品经营者向消费者推销其产品的广告，因而，也可以称之为（ ）。此类广告占广告的大部分。",o:["A、广告媒介性广告","B、工业用户广告","C、商业批发广告","D、商业零售"],a:3,e:["广告媒介性广告按传播媒介划分，划分标准与诉求对象不同","工业用户广告面向生产单位，诉求对象是产业买家","商业批发广告针对批发商，不直接面向最终消费者","商业零售广告由经营者直接向消费者推销，故称消费者广告"]},
    {id:244,t:'s',q:"在DreamweaverMX中,在设置各分框架属性时,参数Scroll是用来设置什么属性的（）",o:["A、是否进行颜色设置","B、是否出现滚动条","C、是否设置边框宽度","D、是否使用默认边框宽度"],a:1,e:["Scroll不属于颜色设置，框架颜色由页面属性另行设定","Scroll参数控制内容超出框架时是否出现滚动条","边框宽度由BorderWidth参数控制，与Scroll无关","默认边框宽度由BorderWidth留空与否决定"]},
    {id:245,t:'s',q:"如何移动一条参考线（）",o:["A、选择移动工具拖拉","B、无论当前使用何种工具，按住Alt键的同时单击鼠标","C、在工具箱中选择任何工具进行拖拉","D、无论当前使用何种工具，按住shift键的同时单击鼠标"],a:0,e:["用移动工具直接拖动参考线，即可改变参考线位置","Alt加单击多用于复制或取样，不能移动参考线","其他工具拖动的是图形对象，参考线须用移动工具","Shift加单击用于加选对象，与参考线移动无关"]},
    {id:246,t:'s',q:"在photoshop中,CMYK颜色模式的图像包括的单色通道是（）",o:["A、青色、黄色、白色和洋红通道","B、蓝色、洋红、黄色和白色通道","C、青色、洋红、黄色和黑色通道","D、白色、洋红、黄色和黑色通道"],a:2,e:["白色并非CMYK油墨通道，且缺少黑色通道表述","蓝色不属于CMYK四色，同样缺黑色通道","CMYK图像含青、洋红、黄、黑四个单色通道","白色不是油墨通道，黑色通道才是第四色"]},
    {id:247,t:'s',q:"下列属于消费心理动机的是（）",o:["A、求实心理","B、求名心理","C、求异心理","D、选择心理"],a:3,w:1,e:["求实心理强调实用耐用，属另一类购买动机","求名心理追求名牌与身份象征，与选择心理不同","求异心理追求新奇独特，属追求新异的动机","选择心理体现购买中的比较取舍动机"]},
    {id:248,t:'s',q:"在“替换颜色”对话框中,不会出现的游标是（）",o:["A、色相","B、明度","C、饱和度","D、亮度"],a:3,e:["色相游标用于选定要被替换的颜色范围","明度游标控制替换后颜色的明暗程度","饱和度游标控制替换颜色的鲜艳程度","对话框只有色相、饱和度、明度三个游标，无亮度"]},
    {id:249,t:'s',q:"(　　)有三方面的内涵:象征性、形象性和指示性。",o:["A、文字","B、图形","C、标志","D、符号"],a:1,e:["文字以线性笔画表意，不具备形象性这一视觉特征","图形兼具象征性、形象性和指示性三重内涵","标志是图形的应用形式，内涵不止这三方面","符号偏重指示性，缺乏形象性的视觉特征"]},
    {id:250,t:'s',q:"我国殷商时代的甲骨文、（）的纸草文字和巴比伦的楔形文字,是世界上迄今为止我们所知道并已破译出来的最古老的三种文字",o:["A、古罗马","B、古印加","C、古印度","D、古埃及"],a:3,e:["古罗马使用拉丁字母，晚于三大古文字且非纸草文字","古印加用结绳记事，没有形成纸草文字体系","古印度文字刻于印章与石柱，不用纸草书写","古埃及在纸草上书写圣书体文字，属三大古文字之一"]},
    {id:251,t:'s',q:"半坡遗址,被称为()文化",o:["A、河姆渡","B、仰韶","C、甲骨","D、石器"],a:1,e:["河姆渡文化在浙江余姚，以稻作和干栏建筑为特征","半坡遗址位于西安，属黄河流域仰韶文化代表","甲骨指商代占卜刻辞，不是新石器时代文化命名","石器是工具分期概念，不是半坡的考古学文化名"]},
    {id:252,t:'s',q:"标志设计中，关于均衡的形式描述正确的是(　　)。",o:["A、均衡的形式只能表现为绝对的对称","B、均衡的形式不能使人感受到稳定的视觉感","C、均衡的形式是以轴为界，使得两边的要素产生视觉稳定","D、均衡的形式中的中轴线只有水平和垂直的两种变化"],a:2,e:["均衡包含对称与非对称两种，并非只能绝对对称","均衡靠视觉重量平衡产生稳定感，不是不能稳定","均衡以中轴为界，使两侧要素取得视觉稳定","中轴线可水平、垂直或倾斜，变化不止两种"]},
    {id:253,t:'s',q:"以下哪项设计是illustrator不能完成的 （ ）",o:["A、企业标识","B、网站","C、动画素材","D、动画"],a:3,e:["Illustrator擅长矢量绘制，可完成企业标识设计","可输出网页图形与切片，参与网站视觉设计","可制作逐帧与符号动画素材，供动画使用","Illustrator是矢量绘图软件，不能制作动画成片"]},
    {id:254,t:'s',q:"对大写拉丁字体的基本特征的描述，正确的是(　　)。",o:["A、字母高度不同，字母间的宽窄比例较小","B、字母高度不同，字母间的宽窄比例较大","C、字母高度相同，字母间的宽窄比例较小","D、字母高度相同，字母间的宽窄比例较大"],a:3,e:["大写拉丁字母高度相同，称高度不同即错","字母高度相同而非不同，宽窄比例也非较小","宽窄比例较大，如I与W差别明显，称较小不确","大写字母高度一致，宽度差异大，宽窄比例较大"]},
    {id:255,t:'s',q:"活动创意需要模仿游戏的激励机制，不是游戏的内在激励的是（）",o:["A、满意工作","B、角色设计","C、体验成功","D、参与宏伟事业"],a:1,e:["满意工作带来胜任与自主体验，属内在激励","角色设计是游戏的外在表现形式，不构成内在激励","体验成功满足成就感，是典型的内在激励","参与宏伟事业激发意义感，属内在激励"]},
    {id:256,t:'s',q:"甲骨文出土于（）",o:["A、河南洛阳","B、河南开封","C、河北唐山","D、河南安阳"],a:3,e:["洛阳以汉魏故城与龙门石窟闻名，非甲骨出土地","开封是北宋都城，甲骨文年代远早于此","唐山无商代王都遗址，与甲骨文出土地无关","甲骨文出土于河南安阳殷墟，即商代晚期王都"]},
    {id:257,t:'s',q:"版式设计中，文字绕图排列形式是将去底图片插入文字版中，文字直接绕(　　)排列。",o:["A、图形上面","B、图形下缘","C、图形上缘","D、图形边缘"],a:3,e:["文字压在图上会遮盖图形，失去绕图排列效果","只绕下缘属单边排列，未形成环绕图形","只绕上缘同为单边排列，不是绕图形式","文字沿图形外轮廓边缘环绕，即文字绕图排列"]},
    {id:258,t:'s',q:"关于成功的排版设计,下列说法不正确的是（）",o:["A、成功的排版设计,首先取决于良好的比例:等差数列等比数列黄金比等","B、成功的排版特点是稳定庄严、整齐安宁沉静。(对称与均衡的特点)","C、成功的排版要从视觉上适合读者的视觉心理","D、黄金比能求得最大限度的和谐,使版面被分割的不同部分产生相互联"],a:1,e:["良好比例确能带来版面秩序，该说法本身成立","稳定庄严整齐安宁仅为对称版面特征，不能概括全部","排版须契合读者视觉心理与阅读习惯，说法成立","黄金比能求得和谐并使分割部分相互联系，成立"]},
    {id:259,t:'s',q:"下面关于画笔工具的描述哪个是正确的______",o:["A、画笔工具绘出的路径上描点的数量都是固定的","B、画笔工具绘出的是可编辑的路径","C、画笔工具绘出的路径上描点都是直线点","D、画笔工具绘出的一定是可编辑的封闭路径"],a:1,e:["描点数量随路径长短变化，并非固定不变","画笔工具绘出的是可编辑路径，描点可继续调整","描点可为曲线点，并不都是直线点","可绘制开放路径，不一定形成封闭路径"]},
    {id:260,t:'s',q:"(　　)实质上是通过市场营销控制来实现营销目标的过程，其主要目的是对市场营销的战略性、计划性、盈利能力和效率管理效益进行综合分析与控制，并针对出现的问题及时加以解决。",o:["A、营销过程分析","B、营销效益分析","C、营销策略分析","D、营销企划分析"],a:1,e:["营销过程分析关注各环节流程执行，不直接评价效益","营销效益分析通过营销控制综合评价效益与效率","营销策略分析侧重策略制定与组合选择","营销企划分析着眼方案策划与目标设定"]},
    {id:261,t:'s',q:"汉字字体中，古隶（）",o:["A、是平直有棱角的笔形","B、是刻在龟甲、石鼓上的文字","C、有着长方形的字形","D、有着强烈的字脚变化"],a:0,e:["古隶笔画平直有棱角，保留隶书早期的方折特征","刻于龟甲石鼓的是甲骨文与石鼓文，时代更早","长方形字形是篆书特点，古隶字形偏扁平","强烈字脚变化是宋体等印刷字体特征"]},
    {id:262,t:'s',q:"面的形象可分为：几何形、有机形和(　　)。",o:["A、无机形","B、偶然形","C、抽象形","D、不规则形"],a:1,e:["无机形不是面的分类术语，与有机形并不对应","面分几何形、有机形和偶然形三类","抽象形是造型倾向，不属于面的三分法","不规则形是描述性说法，教材归入偶然形"]},
    {id:263,t:'s',q:"形的构成要素是（）",o:["A、形与色彩","B、点、线、面","C、点、线、色彩","D、图形"],a:1,e:["形与色彩是造型两大要素，色彩不属形本身","形由点、线、面三个基本要素构成","色彩是独立造型要素，不在形的构成之列","图形是形的呈现结果，不能作为构成要素"]},
    {id:264,t:'s',q:"ps中分辨率的单位是（）",o:["A、像素","B、英寸","C、像素/英寸","D、英寸/像素"],a:2,e:["像素是图像最小单位，不是分辨率的计量单位","英寸是长度单位，单独使用不含像素密度","分辨率以每英寸像素数表示，单位为像素每英寸","英寸每像素与分辨率定义相反，为倒数关系"]},
    {id:265,t:'s',q:"在我国1200多年前的唐初，便有最早的官报《 》，据认为是世界上最早 的报纸。",o:["A、晚报","B、邸报","C、唐报","D、日报"],a:1,e:["晚报按出版时间分类，不是唐代官报名称","唐初官报称邸报，由驻京机构传抄朝政信息","唐代并无唐报这一官报名称","日报是近代报刊形态，唐代尚未出现"]},
    {id:266,t:'s',q:"在版式制作的一开始就应确定成品的尺寸及成品(　　)，左右的空白区域大小。",o:["A、上下的天头、地脚","B、上下的页眉、页脚","C、勒口","D、环衬"],a:0,e:["天头地脚指版心上下的空白，须在开版时确定","页眉页脚是版心内的辅助元素，不是空白区域","勒口是封面折边，属书籍装订部位","环衬是封面内的衬页，与版心空白无关"]},
    {id:267,t:'s',q:"能够加强间隔醒目的视觉效果的是（）",o:["A、图形","B、文字","C、色彩","D、空白"],a:3,e:["图形以形象吸引注意，不专门强化间隔","文字承担信息传达，间隔感弱于留白","色彩对比强化层次，间隔醒目主要靠留白","空白形成虚实对比，使间隔更醒目突出"]},
    {id:268,t:'s',q:"影响纺织工业的各种发明是18世纪工业变革的典型。机器化是从(　　)这个领域开始的。",o:["A、纺纱","B、织布","C、设计","D、染色"],a:0,e:["工业革命机器化始于纺纱，珍妮机等先用于纺纱","织布机械化晚于纺纱，动力织布机出现较迟","设计不是机器化生产领域的起点","染色工序机械化晚于纺纱环节"]},
    {id:269,t:'s',q:"在photoshop图像进行缩放变换时，为了使图像的大小比例保持不变，可以同时按下什么键辅助处理（ ）",o:["A、Tab","B、Ctrl","C、Del","D、Shift"],a:3,e:["Tab键用于隐藏面板，与等比缩放无关","Ctrl键配合拖动多用于复制，不锁定缩放比例","Del键用于删除选中内容，不能控制比例","按住Shift拖动角点，可按等比例缩放图像"]},
    {id:270,t:'s',q:"下列关于alt键的说法不正确的是（）",o:["A、当选择椭圆选框工具时，按alt键可以绘制以点击处为中心的椭圆","B、当选择钢笔工具绘制路径时，按alt键可以去掉半个调节手柄","C、当选择移动工具的情况下，按alt键可以复制图像","D、选择污点修复画笔工具时，按alt键不能进行取样"],a:3,e:["椭圆选框按住Alt可从中心向外绘制椭圆","钢笔工具按住Alt可单独调整半个手柄方向","移动工具按住Alt拖动可复制图层或选区内容","污点修复画笔按住Alt可取样，故该说法不成立"]},
    {id:271,t:'s',q:"职业道德是指从事一定职业劳动的人们,在特定的工作和劳动中以其()和特殊社会手段来维系的,以善恶进行评价的心理意识、行为原则和行为规范的总和。",o:["A、纪律约束","B、理想目标","C、评价标准","D、内心信念"],a:3,e:["纪律约束是外在管理手段，不是职业道德维系核心","理想目标属价值追求，不是维系职业道德的根据","评价标准是善恶判断尺度，不构成内在维系力量","职业道德以内心信念维系，按善恶评价行为规范"]},
    {id:272,t:'s',q:"设计的目的是（）",o:["A、美化环境","B、服务人类","C、创新文化","D、科学实践"],a:1,e:["美化环境是设计的局部作用，不是根本目的","设计以人为本，最终目的是服务人类需求","创新文化是设计的社会效应，不是根本目的","科学实践属科学研究范畴，与设计目的不同"]},
    {id:273,t:'s',q:"在Dreamweaver中，下面关于拆分单元格说法错误的是",o:["A、用鼠标将光标定位在要拆分的单元格中，在拆分单元格中选择行表示水平拆分单元格","B、用鼠标将光标定位在要拆分的单元格中，选择列，表示垂直拆分单元格","C、拆分单元格只能是把一个单元格拆分成两个","D、用鼠标将光标定位在要拆分的单元格中，在属性面板中单击按钮"],a:2,e:["属性面板拆分选行即水平拆分单元格，说法正确","拆分选列即垂直拆分单元格，与行拆分相对","拆分单元格可按行列拆成多个，并不限于两个","属性面板提供拆分按钮，该操作途径成立"]},
    {id:274,t:'s',q:"特殊色调的控制包括图像的哪些操作（）",o:["A、反转","B、色调均化","C、阈值","D、以上全是"],a:3,e:["反转只是特殊色调控制之一，单独选择不完整","色调均化仅为其中一项，不能涵盖全部操作","阈值也只是一种特殊色调控制手段","反转、色调均化、阈值均属特殊色调控制"]},
    {id:275,t:'s',q:"下列说法正确的是（）",o:["A、利用“直方图”可调整色阶,改变图像的阴暗","B、“自动色阶”和“色阶”中的“自动”按钮功能相同","C、“色阶”可对整个图像、某个选区、图层进行调整,但不能调整通道","D、选择“图像直方图”可查看色阶分布"],a:1,e:["直方图只统计像素分布，不能调整色阶与明暗","自动色阶命令与色阶对话框的自动按钮功能一致","色阶可对通道单独调整，称不能调通道有误","直方图显示像素明暗分布，不是色阶查看入口"]},
    {id:276,t:'s',q:"在Dreamweaver中,我们可以为链接设立目标,表示在新窗口打开网页的是（）",o:["A、_blank","B、_parent","C、_self","D、_top"],a:0,e:["_blank表示在新窗口或新标签页打开链接","_parent在当前框架的父框架中打开页面","_self在自身框架或当前窗口内打开页面","_top在整个浏览器窗口顶层打开页面"]},
    {id:277,t:'s',q:"版面设计中最容易识别和记忆的信息载体是（）",o:["A、文字","B、图片","C、图形","D、符号"],a:2,e:["文字需逐字阅读，识别速度慢于概括的图形","图片信息量大，记忆点不如概括图形集中","图形概括直观，最易识别与记忆，是版面强势载体","符号含义抽象，须先约定才能识别"]},
    {id:278,t:'s',q:"下列的快捷键搭配错误的是（）",o:["A、新建图层ctrl+N","B、合并图层ctrl+E","C、反向选择ctrl+shift+I","D、羽化shift+ctrl+D"],a:3,e:["Ctrl+N用于新建文件，新建图层需配合Shift键","Ctrl+E为向下合并图层，搭配正确","Ctrl+Shift+I用于反向选择，快捷键搭配正确","羽化快捷键为Shift+F6，Ctrl+Shift+D是重新选择"]},
    {id:279,t:'s',q:"()文字出现以后,标志的应用更加广泛",o:["A、楔形文字","B、汉字","C、纸草文字","D、象形文字"],a:3,e:["楔形文字用于记录契约，标志仍以图形为主","汉字体系形成后，标志仍长期沿用图形","纸草文字属埃及书写体系，影响范围有限","象形文字出现后表意明确，标志应用更加广泛"]},
    {id:280,t:'s',q:"下列哪个命令用来调整色偏（）",o:["A、色调均化","B、阈值","C、亮度/对比度","D、色彩平衡"],a:3,e:["色调均化重分布亮度，不针对偏色作修正","阈值把图像转为黑白两色，不调整色偏","亮度对比度整体调节明暗，不能校正偏色","色彩平衡分色调调整互补色，可校正色偏"]},
    {id:281,t:'s',q:"要使标志具有符号美的特性，达到一种形简意赅的美的境界，在设计中必须遵循（）",o:["A、形式美","B、线条美","C、抽象美","D、凝练美"],a:3,e:["形式美泛指对称、均衡、比例等法则,范围过宽,未点出形简意赅","线条美只涉及笔画形态,不能涵盖标志整体的符号化概括","抽象美指形态脱离具象,与凝练概括的符号要求并不等同","凝练美要求以最少形态承载最多含义,正合形简意赅的符号美"]},
    {id:282,t:'s',q:"版式设计中(　　)不如单向视觉流程直接简明，但更具韵味、节奏和曲线美。",o:["A、散点视觉流程","B、重心视觉流程","C、导向视觉流程","D、曲线视觉流程"],a:3,e:["散点视觉流程各元素自由分布,视线跳跃,缺少连贯的曲线韵味","重心视觉流程靠重心位置稳定画面,不产生曲线的流动感","导向视觉流程用箭头指引阅读方向,直接简明而少曲线美","曲线视觉流程沿弧线引导视线,兼具韵味、节奏与曲线美"]},
    {id:283,t:'s',q:"下列哪种工具可以选择连续的相似颜色的区域（）",o:["A、矩形选择工具","B、椭圆选择工具","C、魔术棒工具","D、磁性套索工具"],a:2,e:["矩形选择工具按矩形框选取,只认几何范围,不辨认颜色","椭圆选择工具依椭圆形状建立选区,与颜色是否相似无关","魔术棒工具按颜色容差选出相邻的相似颜色区域,可连成一片","磁性套索工具沿对比明显的边缘吸附描边,选取轮廓而非颜色"]},
    {id:284,t:'s',q:"CorelDRAW中，最基本的填充方式是(　　)。",o:["A、肌理填充","B、标准填充","C、自由填充","D、立体填充"],a:1,e:["肌理填充用位图纹理作图案,属特殊填充,使用频率很低","标准填充以单色均匀覆盖对象,是CorelDRAW最基本的填充","自由填充不是CorelDRAW的填充类型,属臆造的概念","立体填充用于给对象加浮雕立体效果,属效果类填充"]},
    {id:285,t:'s',q:"在Dreamweaver中，模板文件的扩展名是(　　)。",o:["A、.dwt","B、.xml","C、.xhtml","D、.swf"],a:0,e:["Dreamweaver模板文件以.dwt为扩展名,默认存于模板文件夹","xml是结构化数据文件扩展名,用于存储数据而非页面模板","xhtml是符合XML规范的页面扩展名,属页面文件不是模板","swf是Flash动画影片格式,与网页模板文件无关"]},
    {id:286,t:'s',q:"宣传样本一般有广告样本、企业、产品、行政机关、交通旅游指南等,形式多样特点（）",o:["A、传递产品功能信息","B、有助于产品销售,决定企业的发展","C、准确传达大容量的信息,使于企业与客户沟通,直观且保留时间长","D、有助于企业形象的铸造"],a:2,e:["传递产品功能信息只是样本内容的一项,不足以概括其特点","有助于销售并决定企业发展说法夸大,样本无决定作用","样本容量大、图文直观、便于沟通且可长期留存,正合其特点","铸造企业形象是样本的间接作用,不是其形式多样的核心特点"]},
    {id:287,t:'s',q:"印刷制品中，对于一本书的正文而言，开数与(　　)的涵义相同，但以其封面和插页用纸的开数来说，因其面积不同，其涵义也不同。",o:["A、开本","B、开法","C、开张","D、开度"],a:0,e:["正文用纸的开数即开本,二者都指纸张幅面的划分规格","开法指纸张的折叠裁切方式,不是幅面大小的称谓","开张多指单张纸的幅面,不用于书刊正文的规格表述","开度是装订开口处的尺寸概念,与开数涵义不同"]},
    {id:288,t:'s',q:"下列Web服务器上的目录权限级别中，最安全的权限级别是（）",o:["A、读取","B、执行","C、脚本","D、写入"],a:0,e:["读取权限只允许浏览下载,不能改动文件,限制最严最安全","执行权限允许运行程序,存在被植入代码的风险","脚本权限可在目录内运行服务端脚本,风险高于只读","写入权限可上传篡改文件,易被挂马,安全性最低"]},
    {id:289,t:'s',q:"页码较多的宣传样本，内容较多，阅读时间较长，要强调节奏的变化和整体的连贯与统一，利用空间关系，确定适宜的(　　)，保持一定的空白量，在色彩关系和图像调整上，要注重明度的统一。",o:["A、版面率","B、页面量","C、出血量","D、负重率"],a:0,e:["版面率指版心占版面的比例,决定留白与节奏,正合题意","页面量指样本页数的多少,不涉及空间比例与节奏安排","出血量是印刷裁切预留的边距,与版面节奏无关","负重率不是版式术语,与版心比例、阅读节奏无关"]},
    {id:290,t:'s',q:"不属于广告作用的是（）",o:["A、传播信息","B、美化环境","C、增加宣传成本","D、提高企业形象"],a:2,e:["传播信息是广告最基本的职能,属广告的正面作用","美化环境指户外广告对城市景观的装饰作用","增加宣传成本是广告的负担而非作用,广告本为降低传播成本","提高企业形象是广告塑造品牌形象的重要作用"]},
    {id:291,t:'s',q:"文字信息的跳跃率与阅读率 ( )",o:["A、成正比","B、没有关系","C、没有比例","D、成反比"],a:0,e:["文字跳跃率大则层次分明、重点突出,阅读率随之提高,二者成正比","跳跃率直接影响视线引导与阅读效率,并非毫无关系","跳跃率与阅读率存在明确的正向比例关系,不是无比例","跳跃率提高并未降低阅读率,成反比与版式实践不符"]},
    {id:292,t:'s',q:"扩散思维、辐射思维、开放思维、立体思维统称为（）",o:["A、聚合思维","B、顺向思维","C、发散思维","D、横向思维"],a:2,e:["聚合思维由已知信息收敛出唯一答案,方向与发散相反","顺向思维沿常规逻辑推演,不强调多方向辐射展开","发散思维又称辐射、扩散、开放、立体思维,强调多向求异","横向思维只是发散思维的一种表现,不能涵盖其余称谓"]},
    {id:293,t:'s',q:"色光三原色,指光谱色,分别为R、G(翠绿)、B(蓝紫)（）",o:["A、品红","B、大红","C、朱红","D、玫瑰红"],a:2,e:["品红是色料三原色之一,属减色法,不是色光的红","大红为颜料色名,色光三原色习惯称朱红、翠绿、蓝紫","色光三原色为朱红、翠绿、蓝紫,朱红即其中的红光","玫瑰红偏冷属色料色相,不能作色光加色的原色"]},
    {id:294,t:'s',q:"在Photoshop中，关于文字图层中的文字理解正确的是(　　)。",o:["A、在文字图层中，不可以修改文字的色彩，需要将其栅格化之后才可修改","B、在文字图层中，可以就原有的文字内容，进行如加字或减字","C、将文字图层中的文字栅格化之后，多次放大和缩小后，不会影响文字边缘的光滑程度","D、将文字图层中的文字栅格化之后，可以继续变换原有文字的字体"],a:1,e:["文字图层可直接修改文字颜色,无需栅格化,该说法不成立","文字图层保留文字属性,能随时增加或删除原有文字内容","栅格化后文字变为像素,放大会出现锯齿,边缘变粗糙","栅格化后文字已成图像,不能再更换原有字体"]},
    {id:295,t:'s',q:"广告学产生于（）",o:["A、第一次社会大分工","B、第二次社会大分工","C、第三次社会大分工","D、商品交换的推销术"],a:3,e:["第一次社会大分工为农牧分离,当时尚无独立的广告活动","第二次社会大分工是手工业与农业分离,广告尚未成为学科","第三次社会大分工出现商人阶层,只是广告发展的条件","广告学源于商品交换中的推销术,由推销经验系统总结而成"]},
    {id:296,t:'s',q:"以下说法中，正确的是(　　)。",o:["A、GIF格式的图象采用无损压缩算法进行图象压缩","B、只有GIF格式才能使用透明色","C、GIF格式支持动画","D、GIF格式最多可以显示256种颜色"],a:1,w:1,e:["GIF确用LZW无损压缩,但压缩方式与透明色支持无关","GIF以索引表指定透明像素,网页透明背景应用最广","GIF动画属多帧扩展功能,与透明色支持是两回事","限256色是索引色的位深上限,与能否透明无关"]},
    {id:297,t:'s',q:"在“色相/饱和度”对话框中,“明度“的取值范围是（）",o:["A、-100^100","B、-180^180","C、-100^150","D、180^100"],a:0,e:["明度取值为负一百至正一百,负值压暗,正值提亮","正负一百八十是色相的取值范围,不是明度滑块区间","上限一百五十超出该对话框明度滑块的实际范围","该区间方向颠倒,明度实际以正负一百为界"]},
    {id:298,t:'s',q:"任何产品都拥有(　　)、有形产品和附加产品3个层次。",o:["A、无形产品","B、有偿产品","C、核心产品","D、非有形产品"],a:2,e:["无形产品指服务、知识等形态,不在产品三层次之列","有偿产品按交易方式划分,不是产品的结构层次","核心产品是消费者购买产品所获的实际利益,居三层次之首","非有形产品与无形产品同义,属杜撰的层次名称"]},
    {id:299,t:'s',q:"下列对于罗马体的描述正确的是(　　)。",o:["A、笔画横细竖粗，字型典雅舒展","B、笔画横竖变化微小，字型典雅舒展","C、笔画都向右倾斜","D、类似于中文行书"],a:0,e:["罗马体横细竖粗,衬线明显,字形典雅舒展,描述准确","横竖变化微小是黑体一类字体的特征,与罗马体不符","整体向右倾斜是意大利斜体的写法,罗马体为正体","罗马体结构规整,与中文行书的连带笔势毫无相似"]},
    {id:300,t:'s',q:"遵纪守法是每一个公民最基本的(　　)，它要求广告设计师在日常工作和生活中，必须具备高度的社会责任感和使命感，严格遵守国家的各项法律、法规，自觉维护法律的尊严。",o:["A、道德修养标准","B、基本素质修养","C、道德要求","D、法律要求"],a:0,e:["遵纪守法是公民最基本的道德修养标准,守法为道德底线","基本素质修养范围过宽,未能点出守法的道德属性","道德要求表述笼统,未体现最基本这一限定","法律要求侧重强制约束,题干强调的正是道德修养层面"]},
    {id:301,t:'s',q:"下面不是电视广告构成的三大要素的有（）",o:["A、画面","B、解说","C、文字","D、音响"],a:2,e:["画面是电视广告的视觉主体,属三大构成要素之一","解说是电视广告的有声语言要素,属三大要素","文字属平面广告要素,电视广告以画面、解说、音响为要素","音响含音乐与音效,是电视广告的声音要素之一"]},
    {id:302,t:'s',q:"在Photoshop中，可以将路径转移Illustrator中再进行修改，以下说法正确的是(　　)。",o:["A、选取菜单“文件”>“导出”>“路径到 Illustrator”","B、选取菜单“文件”>“另存为”>“AI格式”","C、选取菜单“文件”>“另存为”>“PSB格式”","D、不能直接将选中的路径拷贝粘贴在Illustrator文件中"],a:0,e:["文件菜单的导出路径到Illustrator命令可将路径存为AI文件","另存为AI格式保存整幅图像,不是单独转移路径","PSB是大型文档存储格式,不能输出可编辑路径","选中路径可直接拷贝粘贴到Illustrator中继续修改"]},
    {id:303,t:'s',q:"在“色阶”对话框中,要增加图像的亮度色调,可在“输入色阶”下方框中输入2255之间的数值（）",o:["A、左侧","B、中间","C、右侧","D、左侧或右侧"],a:1,e:["左侧滑块控制暗部,右移使暗部更黑,不能提亮","中间滑块调节灰度系数,可改变中间调的整体亮度","右侧滑块控制高光,左移使高光更亮,改变的是对比","左右两侧滑块分管黑白场,不调整整体亮度"]},
    {id:304,t:'s',q:"网页设计和平面设计有相似也有不同处，不同处是指 ( )",o:["A、互动性","B、版式布局","C、组织结构","D、空间表现"],a:0,e:["网页可点击跳转、即时反馈,互动性是平面设计所没有的","版式布局是两者共有的基础,不属于二者的差异","两者都讲究信息层级与结构组织,并非网页独有","平面设计同样讲空间虚实,不是网页特有的差异"]},
    {id:305,t:'s',q:"可以产生平静、安详感的线是（）",o:["A、直线","B、水平线","C、斜线","D、折线"],a:1,e:["直线挺拔刚硬,传达直接有力的感觉,并不平静","水平线如地平线般平展稳定,最易产生平静安详感","斜线打破平衡,产生动感与不稳定,显得紧张","折线转折急促,易生冲突与不安的心理感受"]},
    {id:306,t:'s',q:"下面哪一项不属于古埃及文字构成部分（）",o:["A、表意符号","B、表象符号","C、表音符号","D、限定符号"],a:1,e:["表意符号以图形直接表达词义,是圣书体的构成部分","古埃及文字由表意、表音、限定三类符号构成,无表象符号","表音符号借图形记录语音,属古埃及文字构成","限定符号置于词末标明词类,属古埃及文字构成"]},
    {id:307,t:'s',q:"日本丰田汽车公司长期奉行“少花钱多办事”的经营理念，节约成为丰田公司的文化、时尚和习惯。但近一个时期以来，丰田汽车公司却连续陷入了“召回门”泥潭，据分析，问题的产生或多或少与“节约”有关，这说明( )",o:["A、产品缺陷来源于把“节约”作为经营理念的战略","B、“少花钱”是不能够做到或者做好“多办事”的","C、“节约”就是赚小便宜吃大亏","D、把握节用有度的本质十分重要"],a:3,e:["把缺陷全归于节约战略过于绝对,战略本身并无过错","少花钱与多办事可以兼顾,此说否定精益管理的可能","节约不等于贪小便宜吃大亏,该说法曲解了节约本义","节约须有度,过度压缩成本会牺牲品质,把握分寸最关键"]},
    {id:308,t:'s',q:"( )是利用一种包装材料，广告印刷媒体的设计。它起保护商品，便利购买者携带，在无意中起着推销员作用，故有人称之为“无声的推销员”。",o:["A、报纸广告","B、POP广告","C、产品包装","D、手提袋"],a:3,e:["报纸广告以新闻纸为载体传播信息,不承担携带商品功能","POP广告是售点现场广告,用于烘托现场购买氛围","包装重在保护与说明商品,题干所指可携载体是手提袋","手提袋以包装材料印制,护商品、便携带,起无声推销作用"]},
    {id:309,t:'s',q:"广告文案创意不包括语言文字的要素有（）",o:["A、义","B、形","C、情","D、音"],a:2,e:["义指语义内容,是语言文字创意的首要要素","形指字形与字体形态,属语言文字的表现要素","情属情感诉求范畴,不是语言文字本身的构成要素","音指字音与语感节奏,属语言文字的要素"]},
    {id:310,t:'s',q:"在Photoshop中，滤镜不可以作用于(　　)模式的图像。",o:["A、CMYK模式","B、灰度模式","C、RGB模式","D、索引颜色模式"],a:3,e:["CMYK模式为印刷分色模式,滤镜可正常作用于该模式","灰度模式为单通道图像,多数滤镜可以作用","RGB模式是滤镜支持最完整的屏幕色彩模式","索引颜色模式仅有二百五十六色索引表,多数滤镜不可用"]},
    {id:311,t:'s',q:"版式设计中(　　)是一种虚空间，是对一定范围的空间的知觉或感应，所以，也称为“心理空间”。",o:["A、“力场”","B、“立场”","C、“磁场”","D、“三维”"],a:0,e:["力场是由形态张力形成的心理空间,故称虚空间、心理空间","立场指观点与态度,与版面虚实空间无关","磁场是物理概念,不是版式设计的空间术语","三维指立体空间的表现手法,与虚空间的心理感应不同"]},
    {id:312,t:'s',q:"一副图像色彩偏亮,若要降低其亮度,下面不能实现的操作是（）",o:["A、在“色阶中对话框中,将“输入色阶”左边的三角滑块向右拖动","B、在“色阶中对话框中,将“输入色阶”右边的三角滑块向左拖","C、在“色阶中对话框中,将“输入色阶”中间的三角滑块向右拖","D、在“色阶中对话框中,将“输入色阶”右边的三角滑块向左拖动"],a:1,e:["输入色阶左侧滑块右移,暗部更黑,可压暗画面","右侧滑块左移使高光上移,画面更亮,无法降低亮度","中间滑块右移使中间调变暗,可降低整体亮度","同一拖动方向产生提亮效果,属与压暗相反的操作"]},
    {id:313,t:'s',q:"不属于photoshopcc中提供的图层合并方式是那个（）",o:["A、向下合并","B、合并可见层","C、拼合图层","D、合并链接"],a:3,e:["向下合并可将当前层并入下一层,确属CC的合并方式","合并可见图层只合并显示图层,是CC常用合并方式","拼合图像将所有图层压成一层,属CC的合并方式","合并链接不是CC的命令,链接图层已改用合并图层"]},
    {id:314,t:'s',q:"“静态的创意”是指创造性的意念、巧妙的构思,即人们常说的（）",o:["A、结构","B、观念","C、点子","D、思维"],a:2,e:["结构指广告各要素的组织方式,不指创意本身","观念是思想主张,与巧妙的构思不是同一概念","静态的创意即巧妙的构思,俗称点子,是意念的凝结","思维是动态的思考过程,与静态创意相对"]},
    {id:315,t:'s',q:"以下不属于形状工具的是（）",o:["A、画笔工具","B、钢笔工具","C、多边形具","D、直线T具"],a:0,e:["画笔工具用于绘制位图笔触,不能生成矢量形状","钢笔工具绘制贝塞尔路径,可转为形状图层","多边形工具属形状工具组,可绘制多边形路径","直线工具可绘直线形状,属形状工具组"]},
    {id:316,t:'s',q:"关于企业品牌,正确的认识是（）",o:["A、品牌是依靠大规模广告宣传出来的","B、品牌是企业的一种无形资本","C、品牌形象树立起来以后,自然会长久维持","D、品牌的建立与员工个人不存在直接关系"],a:1,e:["品牌靠产品品质与长期信誉支撑,广告只是传播手段","品牌属无形资产,能带来溢价与忠诚,是企业的无形资本","品牌形象须持续维护,疏于经营会迅速贬值","员工行为直接传递品牌形象,与品牌建立密切相关"]},
    {id:317,t:'s',q:"以下不属于对称规则的是（）",o:["A、上下对称","B、左右对称","C、前后对称","D、对角对称"],a:2,e:["上下对称以水平轴翻转重合,是基本的对称形式","左右对称以垂直轴翻折重合,是最常见的对称","前后对称属立体空间概念,不是平面版式的对称规则","对角对称沿对角线呼应,属版式对称的运用形式"]},
    {id:318,t:'s',q:"专色通道一般应用于（）",o:["A、编辑图像","B、调整图像的色调","C、印刷输出图像","D、转换图像的颜色模式"],a:2,e:["专色通道不参与常规图像编辑,只承载专色油墨信息","调整色调靠曲线、色阶等命令,与专色通道无关","专色通道用于指定金银等专色油墨,服务印刷输出","颜色模式转换由模式菜单完成,不依赖专色通道"]},
    {id:319,t:'s',q:"各种职业集体对从业人员的道德要求,总是从本职业的活动和交往的内容和方式出发,适应于本职业活动的客观环境和具体条件。这说明职业道德具有()的特点",o:["A、实践性","B、时代性","C、客观性","D、多样性"],a:3,e:["实践性指道德要求须落实于职业行为,与题干表述不合","时代性强调随时代发展而变化,题干未涉及历史演变","客观性指要求源于职业活动规律,题干侧重各行差异","各行各业按自身活动特点提出不同要求,正是多样性"]},
    {id:320,t:'s',q:"在产品的3个层次中，(　　) 是指向市场提供的产品（实体、服务）的形状和外观。",o:["A、核心产品","B、有形产品","C、无形产品","D、附加产品"],a:1,e:["核心产品指产品给消费者的基本效用与利益","有形产品指实体形态、外观、包装等可感知部分","无形产品指服务与技术等,不指产品的形状外观","附加产品指安装、保修、送货等附加利益"]},
    {id:321,t:'s',q:"现代设计概念的内涵和灵魂是（）",o:["A、构思","B、创意","C、过程","D、计划"],a:1,e:["构思是设计前的思维酝酿，尚未形成独创性的核心","创意是设计的核心内涵与灵魂，决定作品独创价值","过程是设计的实施环节，不承载内涵与灵魂","计划侧重任务安排与流程管理，属操作层面"]},
    {id:322,t:'s',q:"网络广告不对的是（）",o:["A、传播速度快，范围广","B、制作灵活，形式多样","C、不受时空和文化限制","D、具有固定的读者层面"],a:3,e:["网络广告传播速度快、范围广，是公认优势","网络广告制作灵活、形式多样，确为其特点","网络广告可跨时空跨文化传播，符合其特征","网络广告受众广泛流动，没有固定的读者层面"]},
    {id:323,t:'s',q:"标志信息传播的基础是（）",o:["A、造型识别","B、意义共享","C、意义互换","D、意义传达"],a:0,e:["标志先靠独特造型被识别，识别是信息传播的前提","意义共享是传播的结果，须以造型识别为基础","意义互换指符号语义的转换，并非传播基础","意义传达是传播的目的与过程，不是基础环节"]},
    {id:324,t:'s',q:"应用选框工具正常的格式建立正方形，正圆形加选需要按住（）",o:["A、Shift","B、Alt","C、Ctrl","D、delete"],a:0,e:["按住Shift可约束比例，画出正方形并加选","Alt用于从中心绘制或减选，不能约束比例","Ctrl配合可移动选区，不控制绘制比例","Delete键用于删除选区内容，与绘制无关"]},
    {id:325,t:'s',q:"标志以简练的图形符号,表达的是一种特定（）",o:["A、信息","B、代表","C、象征","D、启迪"],a:0,e:["标志以简练图形符号传达特定信息，属视觉语言","代表仅指替代关系，未体现符号承载信息的功能","象征是以物喻义的修辞手法，非标志表达本体","启迪指引发思考，不属于标志所传达的内容"]},
    {id:326,t:'s',q:"广告遗忘的原因有（）",o:["A、衰退","B、干扰","C、联想","D、记忆"],a:1,e:["衰退是记忆痕迹的自然淡化，非广告遗忘主因","遗忘主因是信息干扰，新旧信息相互抑制","联想是记忆的提取方式，有助于回忆而非致忘","记忆是信息储存过程，与遗忘原因正好相反"]},
    {id:327,t:'s',q:"三角形在版面组成中拥有（）",o:["A、稳固感","B、圆满感","C、庄重感","D、方向感"],a:0,e:["三角形底宽顶尖，在版面中产生稳固安定感","圆满感来自圆形，三角形锐角并无圆满意味","庄重感多由对称方形构成，非三角形特有","方向感由箭头或斜线产生，三角形以稳定为主"]},
    {id:328,t:'s',q:"通过“曲线”对话框,可以进行的操作是（）",o:["A、调整图像的亮度","B、调整图像的对比度","C、调整图像的控制色彩","D、以上均可"],a:3,e:["上提曲线可提亮，但调亮度只是曲线功能之一","S形曲线可增对比，但并非曲线的唯一功能","各通道曲线可校色，仅是曲线功能的一个方面","曲线可同时调亮度、对比度与色彩，以上均可"]},
    {id:329,t:'s',q:"Internet上使用的最重要的两个协议是（）",o:["A、TCP和Telnet","B、TCP和IP","C、TCP和SMTP","D、IP和Telnet"],a:1,e:["Telnet是远程登录协议，不能与TCP并列为核心","TCP与IP是互联网最核心的两个协议，合称TCP/IP","SMTP是电子邮件传输协议，属应用层的单一协议","Telnet仅为应用层协议，与IP搭配不能成核心"]},
    {id:330,t:'s',q:"鹤图形象征寓意（）",o:["A、忠诚","B、喜庆","C、长寿、高贵","D、幸福"],a:2,e:["忠诚多由犬或鸳鸯象征，与鹤的寓意不符","喜庆常借喜鹊、灯笼表达，鹤主寿不主喜","鹤在传统文化中象征长寿与高洁，故为长寿高贵","幸福寓意多由蝙蝠、百合承载，非鹤的核心象征"]},
    {id:331,t:'s',q:"下面哪一项不符合当代文字的多种身份特征（）",o:["A、强调文化性","B、注重地域性","C、超越历史性","D、择重行业属性"],a:2,e:["当代文字强调文化性，属其多重身份之一","文字注重地域性，体现方言语境的差异","文字具有历史传承性，不能超越历史性","择重行业属性是当代文字的身份特征之一"]},
    {id:332,t:'s',q:"以下关于罗马字符的下行线（Descenders）的描述正确地是？",o:["A、下行线在基线（Baseline）以下","B、下行线在大写字母高度（Cap Height）线之上","C、下行线在X高度（X Height）线和基线（Baseline）之间","D、下行线在大写字母高度（Cap Height）线和X高度（X Height）线之间"],a:0,e:["下行线指小写字母降到基线以下的部分","大写高度线之上是上伸部，不是下行线所在","X高度与基线之间是字母主体，并不下伸","大写高度与X高度之间为上伸部，非下行线"]},
    {id:333,t:'s',q:"下列不属于编排要素的是（）",o:["A、图形","B、色调","C、广告语","D、线条"],a:1,e:["图形是版面编排的主要视觉要素，不可或缺","色调属色彩设计范畴，不是版面编排要素","广告语作为文字要素参与编排，同属编排要素","线条用于分割与引导视线，是基本编排要素"]},
    {id:334,t:'s',q:"广告创作者通过对记忆表象进行主动的加工改造，形成新的形象，这就是（）的过程",o:["A、创造想象","B、再造想象","C、联想","D、感知"],a:0,e:["创造想象不依现成描述，独立造出全新形象","再造想象依现成描述再造形象，非主动改造","联想是由此及彼的联结，不产生全新形象","感知是对事物的直接反映，属认识初级环节"]},
    {id:335,t:'s',q:"在被称为“仰韶文化”的西安“”中,就有原始彩陶上的鸟、鱼、蛙、人面鱼纹等形象（）",o:["A、半山遗址","B、大纹口遗址","C、半坡遗址","D、黑山遗址"],a:2,e:["半山遗址属马家窑文化，时代晚于仰韶彩陶","大汶口文化在山东一带，不属西安仰韶遗址","西安半坡遗址属仰韶文化，出土人面鱼纹彩陶","黑山遗址属其他文化类型，与仰韶彩陶无关"]},
    {id:336,t:'s',q:"在Photoshop中，关于参考线说法正确的是(　　)。",o:["A、参考线只有几种可选择的颜色","B、参考线不可以设置任意的颜色","C、参考线的样式只能是直线","D、参考线的样式可以是直线或是虚线"],a:3,e:["参考线颜色可自定任意色值，并非只有几种","参考线可设任意颜色，此说法与功能相反","参考线样式可设为实线或虚线，不止一种","参考线样式可选直线或虚线，故此项正确"]},
    {id:337,t:'s',q:"编排追求的目的是（）",o:["A、达到视觉感观的最佳值","B、将色彩与图形调整到视觉最佳","C、让图形更加简洁明了","D、让色彩更吻合画面需要"],a:0,e:["编排旨在使版面要素达到视觉观感的最佳值","配色调整只是编排手段，不能概括编排目的","图形简洁属单项要求，不是编排总体目的","色彩吻合画面需要是局部要求，非编排目的"]},
    {id:338,t:'s',q:"Photoshop是以下哪个公司推出的图像处理软件（）",o:["A、Microsoft","B、Maxonputer","C、Adobe","D、Apple"],a:2,e:["微软开发操作系统与办公软件，未推出Photoshop","Maxon为三维软件厂商，与Photoshop无关","Photoshop由Adobe公司开发，是其旗舰图像软件","苹果主营硬件与系统，Photoshop非其产品"]},
    {id:339,t:'s',q:"以下命令中用来指定某一种通道中的颜色,并混合到主通道中产生一种图像合成效果的是（）",o:["A、替换颜色","B、匹配颜色","C、通道混合器","D、色相\\饱和度"],a:2,e:["替换颜色是定点替换色相，不做通道混合运算","匹配颜色使两图色调一致，不涉及主通道混合","通道混合器把各通道颜色按比例混入主通道","色相饱和度整体调色相，不做通道混合运算"]},
    {id:340,t:'s',q:"在解决设计的艺术品质问题时，(　　)是最传统又最常用的方法。彩陶、青铜器、建筑、服装、家具都采用了这种设计手法，时至今日，科技最先进的电子产品外壳上也用了女性特征的纹样或童趣的形象作装饰。",o:["A、借用","B、解构","C、装饰","D、参照"],a:1,w:1,e:["借用是挪用现成形态，与彩陶青铜器手法不同","解构指打散重组，与题干装饰手法不符","装饰是彩陶青铜器等器物的纹样手法，最传统常用","参照是借鉴他人样式，不属器物的装饰加工手法"]},
    {id:341,t:'s',q:"通常，文字排版的最佳行宽是（ ）。",o:["A、110-130毫米","B、40-60毫米","C、20-40毫米","D、80-100毫米"],a:3,e:["行宽过宽使视线回行困难，容易读错行","行宽过窄导致频繁换行，破坏阅读节奏","行宽过窄每行字数太少，阅读连贯性差","80至100毫米约容二十余字，是较理想的行宽"]},
    {id:342,t:'s',q:"Photoshop生成的文件默认的文件格式的扩展名格式是（）",o:["A、Bmp","B、JPG","C、EPS","D、PSD"],a:3,e:["BMP为无压缩位图格式，非默认保存格式","JPG为有损压缩格式，需另存而非默认格式","EPS是矢量封装格式，非Photoshop默认格式","PSD是Photoshop默认格式，可保留图层与通道"]},
    {id:343,t:'s',q:"拉丁字母的基本结构由引线(　　)、笔画、间距4个基本要素构成。",o:["A、重心","B、基线","C、字形","D、节点"],a:2,w:1,e:["重心是字形的视觉平衡点，不属四要素中引线","基线是字母排列的基准线，与笔画间距并称要素","字形是字母外形总称，引线应指基线","节点是贝塞尔曲线的控制点，属绘图而非文字要素"]},
    {id:344,t:'s',q:"平面图形创意中，在保持物形的基本特征的基础上将其中某一部分用其他物形素材所替换的一种整合方式，利用形的相似性和意义上的相异性创造出具有新意的新形象，叫做（）",o:["A、同构","B、置换","C、嫁接","D、正负形"],a:1,e:["同构是两形按共同结构整合，不做局部替换","置换是在保持基本特征下以他形替换局部","嫁接是把两形直接拼接组合，不强调局部替换","正负形利用图底反转共用轮廓，与局部替换无关"]},
    {id:345,t:'s',q:"中国银行的标志，主要以（）为设计元素组成的",o:["A、“玉”字","B、“口”字","C、中国的“中”字","D、圆形"],a:2,e:["玉字造型与古钱圆形不符，非标志取形来源","口字仅取钱币方孔之形，不能概括标志全貌","中国银行标志以中字与古钱形结合，取中字为元素","圆形只是外轮廓形态，未体现中字的立意"]},
    {id:346,t:'s',q:"WWW是(　　)的意思。",o:["A、网页","B、万维网","C、浏览器","D、超文本传输协议"],a:1,e:["网页是万维网中的文档形式，不等同于WWW本身","WWW是World Wide Web缩写，中文意为万维网","浏览器是访问万维网的工具软件，非WWW本义","超文本传输协议指HTTP，与WWW含义不同"]},
    {id:347,t:'s',q:"平面广告中设计运动题材的广告画面应选择（ ）",o:["A、色相弱对比","B、明度强对比","C、明度弱对比","D、明度中对比"],a:1,e:["色相弱对比画面柔和，难表现运动的速度与张力","运动题材宜用明度强对比，形成强烈节奏与冲击","明度弱对比画面平缓沉闷，缺乏运动所需张力","明度中对比力度不足，难以强化运动的动势"]},
    {id:348,t:'s',q:"中国的字体从纯粹的绘画演变为线条符号,按次序分别为（）",o:["A、古文、篆书、隶书、行书、草书、楷书","B、古文、隶书、篆书、草书、行书、楷书","C、古文、篆书、隶书、草书、楷书、行书","D、古文、隶书、篆书、草书、楷书、行书"],a:2,e:["此序把行书置于草书之前，与书体演变实际不符","隶书列于篆书前且行书早于楷书，两处次序有误","字体依次为古文、篆书、隶书、草书、楷书、行书","此序隶篆颠倒，且把行书置于楷书之后，次序有误"]},
    {id:349,t:'s',q:"拉丁文哥德体在文字（）的表现上虽迈开了一大步，但它的书写、识别功能很难得到后人的好评",o:["A、阅读","B、书写","C、装饰性","D、美观实用"],a:2,e:["哥德体笔画粗密，阅读识别性差，不以此见长","哥德体书写繁琐费时，书写便捷性并不突出","哥德体以装饰性见长，垂直棱角形成独特风格","哥德体偏重装饰，难兼顾实用，实用评价不高"]},
    {id:350,t:'s',q:"显示标尺的快捷键是（）",o:["A、Ctrl+R","B、Ctrl+V","C、Ctrl+A","D、Ctrl+S"],a:0,e:["Ctrl+R是显示或隐藏标尺的快捷键，操作正确","Ctrl+V用于粘贴，与标尺显示无关","Ctrl+A是全选命令，不控制标尺显示","Ctrl+S用于保存文件，与标尺显示无关"]},
    {id:351,t:'s',q:"广告诉求定位于受众的理智动机，通过真实、准确、公正地传达企业、产品、服务的客观情况，使受众经过概念、判断、推理等思维过程，理智地作出决定的诉求策略叫做（）",o:["A、感性诉求","B、理性诉求","C、恐惧诉求","D、情境诉求"],a:1,e:["感性诉求诉诸情感与情绪，不经推理判断环节","理性诉求诉诸理智，以事实数据经推理促成决定","恐惧诉求以威胁性信息引发不安，属情感诉求","情境诉求借场景氛围感染受众，不重逻辑论证"]},
    {id:352,t:'s',q:"关于网格工具描述不正确的是（）",o:["A、dpi执行“对象”/“创建渐变网格”命令。可以创建简便网格","B、dpi执行“对象”/“路径”/“偏移路径”命令，可以把网格对象转回路径ppi","C、“网格工具”中的网格点不可以删除","D、“网格工具”是Illustrator中具有独特填充效果的渐变填充工具"],a:3,w:1,e:["创建渐变网格命令确在对象菜单下，描述无误","偏移路径用于轮廓偏移，与网格转路径无关","网格点可选中后删除，称其不可删除不成立","网格工具为网格填充工具，不同于渐变填充"]},
    {id:353,t:'s',q:"图版率是多大比例就方便阅读（）",o:["A、5%","B、10%","C、20%","D、100%"],a:2,e:["图版率仅百分之五，版面几乎全为文字而呆板","图版率百分之十图片偏少，版面缺少视觉调剂","图版率约百分之二十时疏密适度，便于阅读","图版率百分之百无文字空间，信息传达受阻"]},
    {id:354,t:'s',q:"版面编排设计是（）",o:["A、一维设计","B、二维设计","C、三维设计","D、四维设计"],a:1,e:["一维设计只涉线性排列，编排需长宽两个向度","版面编排在长宽两个向度上安排要素，属二维","三维设计涉及体积与纵深，非平面编排属性","四维设计加入时间维度，属动态影像设计范畴"]},
    {id:355,t:'s',q:"在“曲线”对话框中,曲线向右下角弯曲表示（）",o:["A、色调变亮","B、色调变暗","C、对比度增加","D、对比度减小"],a:1,e:["曲线向上弯提升输出亮度，与右下弯方向相反","曲线向右下弯曲降低输出值，画面色调变暗","对比度增加需S形曲线，单向下弯不产生对比","右下弯主要改变整体明度，不以对比变化为主"]},
    {id:356,t:'s',q:"色彩的构成包括三个要素，即开象要素、视觉心理要素和（）",o:["A、光影要素","B、光感要素","C、肌理要素","D、对比要素"],a:1,e:["光影属造型表现因素，不在色彩构成三要素之列","三要素指光感要素、形象要素与视觉心理要素","肌理是材质表面特征，不属于色彩构成三要素","对比是色彩关系手法，不是并列的构成要素"]},
    {id:357,t:'s',q:"以下（）不是标志的价值",o:["A、艺术品","B、信誉","C、专利权","D、信息"],a:3,e:["标志可具艺术价值，优秀标志常被视作艺术品","标志承载企业信誉，是重要的无形资产价值","标志经注册取得专利权，受法律保护具财产价值","信息是标志传达的内容与功能，不构成价值形态"]},
    {id:358,t:'s',q:"在Photoshop中，(　　)不可以进行选区的运算。",o:["A、矩形选框工具","B、自由套索工具","C、吸管工具","D、魔棒工具"],a:2,e:["矩形选框可做加减交运算，能参与选区运算","套索工具支持选区加减交运算，属可运算工具","吸管工具只取色不生成选区，无法做选区运算","魔棒按颜色容差建立选区，可用于选区运算"]},
    {id:359,t:'s',q:"能够打破所有的条条框框,使版面更加活泼、新颖的是（）",o:["A、图文插","B、首字强调","C、自由编排","D、标题编排"],a:2,e:["图文穿插属图与文的组合方式，仍循版面秩序","首字强调是局部变化手法，未打破整体框格","自由编排打破网格与常规框格，版面活泼新颖","标题编排讲层级与对齐，仍受版式规范约束"]},
    {id:360,t:'s',q:"注意的重要功能有（）",o:["A、选择功能","B、保持功能","C、调节和监督的功能","D、刺激功能"],a:2,e:["选择是注意的初级功能，调节监督才是重要功能","保持功能使注意对象稳定留存，属基础功能","注意的重要功能是对心理活动的调节与监督","刺激是引发注意的外在条件，不属注意的功能"]},
    {id:361,t:'s',q:"下列关于包装叙述错误的是（）",o:["A、包装是沟通生产者与消费者的桥梁","B、包装的外形直接关系到产品的销量","C、包装需能容纳产品","D、包装能够节约天然资源"],a:3,e:["包装是产品与消费者沟通的媒介，承载品牌与产品信息","包装外形与视觉直接影响购买欲，进而左右产品销量","包装首要功能是容纳保护产品，便于储运与陈列","包装耗用纸张、塑料、金属等材料，实为消耗天然资源"]},
    {id:362,t:'s',q:"字体设计是专门研究(　　)的视觉形象。",o:["A、文字","B、图象","C、笔画","D、书法"],a:0,e:["字体设计研究文字字形结构、笔画与整体视觉形象","图象属图形设计范畴，研究的是图形而非文字字形","笔画只是文字构成元素之一，涵盖范围过于狭窄","书法是书写艺术，字体设计服务于信息传达与识别"]},
    {id:363,t:'s',q:"下面哪个工具可以减少图像的饱和度（ ）",o:["A、海绵工具","B、减淡工具","C、任何一个在选项调板中有饱和度滑块的绘图工具","D、加深工具"],a:0,e:["海绵工具的去色模式可降低局部区域的色彩饱和度","减淡工具用于提亮局部明度，并不改变色彩饱和度","并非所有绘图工具都设饱和度滑块，此说以偏概全","加深工具压暗局部、使颜色变浓，不降低饱和度"]},
    {id:364,t:'s',q:"视频广告的最终目的是",o:["A、寻找卖点","B、表现广告主题","C、促进商品销售","D、传播信息"],a:0,w:1,e:["卖点提炼是创意前期环节，不是广告最终目的","表现主题是创作要求，最终仍服务于销售目标","商业广告的终极目的是促成购买、扩大商品销售","传播信息是广告的手段，销售才是商业目的"]},
    {id:365,t:'s',q:"广告创意从思维本质上来说是从逻辑思维到（）思维的转变",o:["A、形象","B、横向","C、纵向","D、发散"],a:0,e:["创意以具象形象承载诉求，实现由逻辑到形象的转化","横向思维指跨领域类比联想，不是本题所指的转变方向","纵向思维是纵深推导，仍属逻辑思维范畴","发散思维是思路扩散方式，不构成思维形态的归属"]},
    {id:366,t:'s',q:"在Adobe Illustrator中，若当前文件中的图形复杂，为了加快屏幕刷新速度，最直接快 速并且简单的方式是:",o:["A、增加运行所需的显示内存","B、将当前不编辑的部分隐藏―","C、通过视野>轮廓命令使图形只显示线条部分","D、增加运行所需的内存"],a:2,e:["轮廓模式只显示路径线条，可大幅减少刷新运算量","增加显示内存属硬件投入，不是最直接简便的做法","逐个隐藏暂不编辑部分操作繁琐，不够直接简便","增加内存成本较高，且不改变屏幕显示的内容"]},
    {id:367,t:'s',q:"建立描边路径的方法以下不包括那个选项（）",o:["A、钢笔工具","B、套索工具","C、画笔工具","D、选区工具"],a:2,e:["钢笔工具可直接绘制并编辑路径，再执行描边","套索可先建选区，转为工作路径后即可描边","画笔工具直接涂抹像素，本身不能建立路径","选区工具可把选区转为路径，再完成描边"]},
    {id:368,t:'s',q:"职业道德的特征是（）",o:["A、行业性","B、规范制定上的任意性","C、内容上的多变性","D、形式上的单一性"],a:0,e:["职业道德在特定职业范围内形成，行业性鲜明","规范由行业约定俗成并受监督，不具任意性","职业道德内容相对稳定，有继承性和连续性","表现形式多样，有守则、公约、制度等多种载体"]},
