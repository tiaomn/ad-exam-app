    {id:369,t:'s',q:"我们通常说的拉丁字母是指（），分为大写字母和小写字母",o:["A、卡洛林字母","B、英文字母","C、哥特字母","D、罗马字母"],a:1,e:["通常所说的拉丁字母即26个英文字母，分大小写","卡洛林字母是中世纪书写体，非通行的拉丁字母","哥特字母是装饰性黑体书写体，属历史字体","罗马字母是拉丁字母的学术称谓，日常即指英文字母"]},
    {id:370,t:'s',q:"广告记忆的过程有（）",o:["A、识记","B、保持","C、再认识","D、回忆"],a:2,e:["识记是对广告信息的初次编码，仅是记忆的开端","保持是信息在头脑中储存巩固，尚非完整记忆过程","再认识是广告再次出现时能被确认，属记忆关键环节","回忆是无提示的信息提取，与再认同属提取阶段"]},
    {id:371,t:'s',q:"傍晚拍出的照片由于受到色温的影响而偏青,在“变化”对话框中应对其所作的操作是（）",o:["A、调整为低饱和度","B、加深红色","C、调高整个图像的亮度","D、调整为高饱和度"],a:1,e:["降低饱和度只能让画面发灰，无法校正偏青的偏色","偏青说明画面缺红，加深红色可中和青色调","提高整体亮度只改明暗，不改变色相偏差","提高饱和度会强化原有青色调，使偏色更加严重"]},
    {id:372,t:'s',q:"（）的标志更利于表达和识别,而且艺术语言也更丰富,所以倍受使用者和设计师的青睐",o:["A、意象构成","B、自然形构成","C、综合性构成","D、文字构成"],a:2,e:["意象构成偏重主观意象表达，识别性不如综合构成","自然形构成取自然物象，语义传达受题材限制","综合构成融合具象与抽象语汇，表达丰富且易识别","文字构成受字形字义约束，艺术语言相对单一"]},
    {id:373,t:'s',q:"索引颜色模式的图象包含多少种颜色（）",o:["A、2","B、256","C、约65，000","D、1670万"],a:1,e:["2色是位图模式的黑白两值，不含灰阶色彩","索引模式用8位色表，最多容纳256种颜色","约6.5万色是16位通道的高彩色范围","1670万色是RGB每通道8位的真彩色数量"]},
    {id:374,t:'s',q:"CMYK模式的图象有多少个颜色通道（）",o:["A、1","B、2","C、3","D、4"],a:3,e:["单通道为灰度模式，只含一个灰度通道","双通道用于专色印刷，与四色印刷模式无关","三通道对应RGB模式，是屏幕加色显示","CMYK含青、品红、黄、黑四个通道，对应印刷四色"]},
    {id:375,t:'s',q:"在“曲线”对话框中表格的横坐标表示的是（）",o:["A、原图像的色调","B、新图像的色调","C、暗调","D、高光"],a:0,e:["横坐标表示输入色阶，即原图像的明暗色调值","纵坐标才是输出值，代表调整后的新色调","暗调只是横坐标左端的局部区段，并非整体含义","高光仅是横坐标右端部分，不能概括横坐标"]},
    {id:376,t:'s',q:"某用户在用模板做的页面无法插入层，其原因可能是(　　)。",o:["A、模板页面没有定义可编辑区域?","B、层不可能插入用模板做的页面","C、把网页结构和内容没有分开","D、没有定义锁定区域"],a:0,e:["模板未定义可编辑区域，锁定区域无法插入层","层可以插入模板生成的页面，此说法过于绝对","结构与内容未分开属制作规范问题，非直接原因","定义锁定区域是模板特性，不是插入层受阻原因"]},

    // ================= 判断题 (98 道) =================
    {id:401,t:'j',q:"版面设计中的抽象要素是点、线、面（）",o:["A、正确","B、错误"],a:0,e:["点、线、面是抽象形态要素，构成版面的基本骨架","否认点线面为抽象要素，与版面构成原理相违背"]},
    {id:402,t:'j',q:"对页面显示进行缩放使用Info（信息）调板",o:["A、正确","B、错误"],a:1,e:["误认为信息调板能缩放，因其显示光标坐标与尺寸","缩放由缩放工具和导航器调板完成，信息调板只报数值"]},
    {id:403,t:'j',q:"职业生涯是指一个人的职业经历，设计自己的职业生涯规划，有利于实现个人的职业理想。（ ）",o:["A、正确","B、错误"],a:0,e:["职业生涯规划明确目标与路径，有助于实现职业理想","否定规划作用，就忽视了它对职业发展的导向价值"]},
    {id:404,t:'j',q:"关于文本对齐，居中对齐是基本对齐方式之一（）",o:["A、正确","B、错误"],a:0,e:["居中对齐与左对齐、右对齐、两端对齐同属基本对齐","若否定，则与排版软件四种基本对齐方式不符"]},
    {id:405,t:'j',q:"在版式设计中,行距在常规下的比例为10:12（）",o:["A、正确","B、错误"],a:0,e:["字号与行距常按10比12配置，即行距为字号1.2倍","若否定，则违背正文1.2倍行距这一常规排版经验"]},
    {id:406,t:'j',q:"企业标志设计应注意各国的禁忌图案和颜色。（）",o:["A、正确","B、错误"],a:0,e:["标志跨文化传播须避开各民族的禁忌图案与颜色","忽视禁忌会引发文化冲突，损害品牌形象与市场"]},
    {id:407,t:'j',q:"分减是对基本形进行分割、移位或减缺的变化方式。（）",o:["A、正确","B、错误"],a:0,e:["分割、移位、减缺是基本形的变化手法，合称分减","若否定，则混淆了分减与重复、渐变等构成手法"]},
    {id:408,t:'j',q:"标志的功能分为：信息传达、信誉保障、广告宣传、装饰美化。（）",o:["A、正确","B、错误"],a:0,e:["标志兼具信息传达、信誉保障、广告宣传与装饰美化","若否定，就遗漏了标志在识别与信誉担保上的作用"]},
    {id:409,t:'j',q:"职业的专业性特征与多样性特征是相互矛盾的。",o:["A、正确","B、错误"],a:1,e:["误把专业限定理解为排斥其他职业，才得出矛盾结论","专业性与多样性是职业分工的两个侧面，并不对立"]},
    {id:410,t:'j',q:"对比是强调版面元素间的差异性（）",o:["A、正确","B、错误"],a:0,e:["对比借大小、明暗、虚实的差异强化版面视觉层次","若否定，就抹杀了对比强调差异这一本质属性"]},
    {id:411,t:'j',q:"'尤里卡效应'是指灵感闪现（）",o:["A、正确","B、错误"],a:0,e:["尤里卡源于阿基米德顿悟，指灵感突然闪现的体验","若否定，则与创意心理学中的顿悟现象不符"]},
    {id:412,t:'j',q:"和谐统一不属于广告招贴版面设计原则的是（）",o:["A、正确","B、错误"],a:0,w:1,e:["和谐统一确属招贴版面设计的基本原则","和谐统一是版面基本原则，故判定题干错误才合原理"]},
    {id:413,t:'j',q:"广告文案创意主要包括语言文字的要素有情、音、形（）",o:["A、正确","B、错误"],a:1,e:["把情列入要素，混淆了情感诉求与语言形式要素","语言要素应为义、音、形，情属诉求内容而非形式"]},
    {id:414,t:'j',q:"修补工具只有一种修补方法,即源（）",o:["A、正确","B、错误"],a:1,e:["若只有源模式，就无法把完好区域移植到修补位置","修补工具有源和目标两种模式，此说法过于绝对"]},
    {id:415,t:'j',q:"标准色的应用方式只有两种：单色和复色。（）",o:["A、正确","B、错误"],a:1,e:["若仅两色，则无法涵盖辅助色与背景色的应用方式","标准色应用含单色、双色与多色组合，不止两种"]},
    {id:416,t:'j',q:"文字围绕图形的编排设计是指文字的互动性（）",o:["A、正确","B、错误"],a:0,e:["文字环绕图形排布形成图文互动，属互动性编排","若否定，就忽视了图文空间关系产生的互动效果"]},
    {id:417,t:'j',q:"使用Photoshop提供的色阶、曲线等命令对图像进行色彩调整，可以使图像的色彩更丰富（ ）",o:["A、正确","B、错误"],a:0,e:["色阶与曲线可重分布明暗层次，增强色彩表现力","若否定，则与图像色调调整的实际效果不符"]},
    {id:1001,t:'j',q:"线有宽窄粗细。面是有长宽,也有厚度（）",o:["A、正确","B、错误"],a:1,e:["若认为面有厚度，就把二维平面混同于三维立体","面是二维形态，只有长和宽，没有厚度"]},
    {id:1002,t:'j',q:"商标代表着一种权益。（）",o:["A、正确","B、错误"],a:1,e:["把商标直接等同于权益，忽略了注册才产生专用权","商标只是识别标记，经注册才形成商标专用权"]},
    {id:1003,t:'j',q:"版面设计者遵循的原则是在信息视觉化的过程中以科学为基本原则（）",o:["A、正确","B、错误"],a:1,e:["认为以科学为原则，忽视了形式美法则的核心地位","版面设计基本原则是美学与秩序法则，非单纯科学"]},
    {id:1004,t:'j',q:"版面设计中的具象要素有点、线、面。",o:["A、正确","B、错误"],a:1,e:["若点线面算具象，就与抽象形态的界定相冲突","点线面是抽象要素，具象要素指照片、插图等具体形象"]},
    {id:1005,t:'j',q:"文字信息的跳跃率与阅读率没有关系（）",o:["A、正确","B、错误"],a:1,e:["误以为跳跃率只管视觉节奏，不影响阅读效率","跳跃率越大版面越活泼，直接左右阅读率高低"]},
    {id:1006,t:'j',q:"非作用性骨骼不决定基本形的位置,也不决定形体的大小（）",o:["A、正确","B、错误"],a:1,e:["若全然不决定位置，就混淆了非作用性骨骼与无骨骼","非作用性骨骼决定基本形位置，只是不限定其大小"]},
    {id:1007,t:'j',q:"设计的目的是美化万物（）",o:["A、正确","B、错误"],a:0,e:["设计通过造型、色彩改善器物与环境，具有美化作用","若否定，则无视设计在提升审美品质方面的功能"]},
    {id:1008,t:'j',q:"如果要表单提交信息不以附件的形式发送，只要将表单的“MTME类型”设置为text／plain（）",o:["A、正确","B、错误"],a:0,e:["纯文本类型使表单数据随正文传输，不以附件形式发送","若设为附件类型才生成附加文件，与纯文本方式正好相反"]},
    {id:1009,t:'j',q:"Photoshop中GIF格式也属于是透明背景格式（）",o:["A、正确","B、错误"],a:1,e:["指定一种索引色为透明仅是GIF的有限特性，难称透明背景格式","真正透明背景需Alpha通道，GIF无此通道，PNG才具备"]},
    {id:1010,t:'j',q:"广告是一种说服性传播沟通的过程（）",o:["A、正确","B、错误"],a:0,e:["广告借助媒介传递信息，目的在于说服受众接受观念或购买","若只讲告知与艺术表现而否认说服，便混淆了广告的传播目的"]},
    {id:1011,t:'j',q:"就图版率而言,商业性的读物适合中图版率（）",o:["A、正确","B、错误"],a:1,e:["商业读物靠图片激起购买欲，中图版率显得平淡，说法站不住","商业性读物追求视觉冲击，宜用高图版率，中图版率适合学术读物"]},
    {id:1012,t:'j',q:"photoshop可以运用在影楼婚纱照片的调色工作。",o:["A、正确","B、错误"],a:0,e:["曲线、色阶与色彩平衡可精细修正婚纱照肤色与整体色调","认为调色只能依靠冲印完成，忽视了数字暗房对色彩的控制力"]},
    {id:1013,t:'j',q:"在Photoshop中使用仿制图章工具修补图像时，当按住“Alt”键的同时在图像上单击时，其作用是确定复制图像的起点（ ）",o:["A、正确","B、错误"],a:0,e:["按住Alt单击即取样，把该点设为仿制图章的复制源起点","直接单击拖动便已开始涂抹复制，无法重新定义取样原点"]},
    {id:1014,t:'j',q:"韵律是按照一定的条理、秩序、重复连续地排列，形成一种律动形式。（ ）",o:["A、正确","B、错误"],a:1,e:["重复连续排列形成律动更接近节奏，用来界定韵律并不严密","韵律在条理秩序之外讲究强弱起伏的韵味，与单纯重复不同"]},
    {id:1015,t:'j',q:"化妆品类商品常用鲜艳的纯色调对比，背景色与主体色在色相对比、冷暖对比、纯度对比、明度对比上都有强烈的反差，色调则变得和谐而强烈。",o:["A、正确","B、错误"],a:1,e:["化妆品需体现温和洁净，纯色强对比易显刺激廉价，故不成立","强反差与和谐并提自相矛盾，此类广告多以柔和邻近色为主"]},
    {id:1016,t:'j',q:"在学习软件的过程中，软件的版本越旧说明是最好用的（）",o:["A、正确","B、错误"],a:1,e:["旧版本对低配置机器负担小，但功能与文件兼容性明显落后","新版修复缺陷、扩充功能与格式支持，好用与否不由新旧决定"]},
    {id:1017,t:'j',q:"模糊工具可以减少图像饱和度（）",o:["A、正确","B、错误"],a:1,e:["模糊工具只做像素平均化使边缘变虚，不直接降低色彩饱和度","降低饱和度应使用海绵工具的去色模式，两者功能分工不同"]},
    {id:1018,t:'j',q:"对称是按照一定的条例、秩序、重复连续地排列，形成一种律动形式。",o:["A、正确","B、错误"],a:1,e:["题干描述的是重复律动即韵律，与对称的等量对应关系不符","对称以轴线为基准两侧等形等量，求得庄重稳定，不涉重复排列"]},
    {id:1019,t:'j',q:"用来进行图形的精确移动的方法：通过Move(移动)对话框对图形进行精确的移动正确答案",o:["A、正确","B、错误"],a:0,e:["移动对话框可输入水平和垂直位移数值，实现定距精确移动","直接拖拽只能凭目测定位，位移数值难以准确控制"]},
    {id:1020,t:'j',q:"控制面板中显示的选项是固定的，不会因所选的对象或工具类型而变化",o:["A、正确","B、错误"],a:1,e:["面板上少数常用项位置固定，容易让人误以为内容整体不变","控制面板随所选对象与工具动态切换，选项内容随之改变"]},
    {id:1021,t:'j',q:"Photoshop是图像处理软件，所以不能处理图形。",o:["A、正确","B、错误"],a:1,e:["核心是像素位图编辑，常被误认为与矢量图形完全无关","形状图层、路径与矢量蒙版均可绘制图形，故说法不成立"]},
    {id:1022,t:'j',q:"版面编排设计是一维设计（）",o:["A、正确","B、错误"],a:1,e:["版面按行横向排列时看似一维，其实还有纵向层次与空间关系","版面编排同时在横向与纵向组织要素，属二维空间设计"]},
    {id:1023,t:'j',q:"汉字书写的一般规律有先主后次、上紧下松、横细竖粗（）",o:["A、正确","B、错误"],a:1,e:["上紧下松与横细竖粗属字体设计法则，被误当成书写规律","书写规律指笔顺先横后竖、从上到下、从左到右，非先主后次"]},
    {id:1024,t:'j',q:"广告大师詹姆斯?韦伯?扬认为创意就是旧元素的新组合（）",o:["A、正确","B、错误"],a:0,e:["韦伯扬提出创意是旧元素的新组合，强调素材的重新连接","若认为创意凭空产生，就忽视了既有经验与素材的积累转化"]},
    {id:1025,t:'j',q:"Photoshop中RGB模式指的是（红，黄，蓝）模式（ ）",o:["A、正确","B、错误"],a:1,e:["红黄蓝是传统颜料三原色的旧说，容易与光的三原色混淆","RGB指红绿蓝加色模式用于屏幕，红黄蓝属颜料减色范畴"]},
    {id:1026,t:'j',q:"一般来说将图形的视觉度于远景的视觉度（）",o:["A、正确","B、错误"],a:0,e:["近景图形占画面面积大、细节清晰，视觉度明显高于远景","认为远景更醒目，违背了近大远小的透视与视觉规律"]},
    {id:1027,t:'j',q:"标志的形成是孤立的，不受人类社会经济、文化、科技等全方位的影响（）",o:["A、正确","B、错误"],a:1,e:["标志看似只是图形创意，容易被当作设计师个人灵感的产物","标志随经济文化与科技进步演变，如印刷术推动商标规范化"]},
    {id:1028,t:'j',q:"在版面中,为求视觉心理上的静止稳定感,通常会用对称与均衡（）",o:["A、正确","B、错误"],a:0,e:["对称两侧等量、均衡两侧等重，都能使视线重心稳定不倾","版面重心偏移又无呼应时视线游移，难以获得静止稳定感"]},
    {id:1029,t:'j',q:"开放路径和闭合路径都可以填充颜色、图案和渐变色",o:["A、正确","B、错误"],a:1,e:["开放路径看似也能上色，实际填充只作用于闭合区域内部","开放路径两端未连接，没有内部区域，仅能描边不能填充"]},
    {id:1030,t:'j',q:"我国书法艺术中，楷、行、草三种书法的重要定性期是魏晋时期，在这一时期完成了书体的演变（）",o:["A、正确","B、错误"],a:1,e:["魏晋确是楷行草定型的关键期，但书体演变并未在此终结","隶变完成于汉代，楷书成熟于唐代，演变延续至唐宋"]},
    {id:1031,t:'j',q:"汉字最早的形式是一种代表语意的视觉符号，其功能是在生产劳动和社会活动中传播信息（）",o:["A、正确","B、错误"],a:1,e:["早期刻符多用于记数记名，未必直接代表语意并传递信息","汉字由图画文字逐步符号化，最早形态并非成熟语意符号"]},
    {id:1032,t:'j',q:"版面设计的构成要素有比例与分割（）",o:["A、正确","B、错误"],a:1,e:["比例与分割属形式法则，被误当成版面构成的实体要素","版面构成要素指文字、图形、色彩与空白，比例分割是组织手法"]},
    {id:1033,t:'j',q:"通道可用于存储图像的颜色信息和选区信息（）",o:["A、正确","B、错误"],a:0,e:["颜色通道保存各原色分量，Alpha通道以灰度记录选区范围","若认为通道只存颜色，就无法解释Alpha通道保存选区的用途"]},
    {id:1034,t:'j',q:"模糊工具选项栏中包含容差选项（）",o:["A、正确","B、错误"],a:1,e:["模糊工具选项栏有画笔、模式与强度，容易被误记成含容差","容差属魔棒与油漆桶等工具，模糊程度由强度参数控制"]},
    {id:1035,t:'j',q:"色彩设计会对人的心理产生不同的刺激作用。这就是色彩的信息化功能和情感作用功能",o:["A、正确","B、错误"],a:0,e:["色彩能传递冷暖轻重等信号，并引发情绪联想与心理反应","若否认色彩的情感作用，就难以解释促销常用红色激发兴奋"]},
    {id:1036,t:'j',q:"在photoshop中，选区和路径都必须是封闭的",o:["A、正确","B、错误"],a:1,e:["选区须闭合才有范围，但路径常保留开放状态用于描边","路径可以开放，仅闭合路径能填充，故两者并非都要封闭"]},
    {id:1037,t:'j',q:"七喜汽水的“非可乐”定位属于品牌形象理论理论范畴（）",o:["A、正确","B、错误"],a:0,w:1,e:["非可乐以对比树立品牌个性，被归入品牌形象理论","定位理论主张在消费者心智中占据品类位置，该案例实属定位范畴"]},
    {id:1038,t:'j',q:"广告环境分析是分析外部环境（）",o:["A、正确","B、错误"],a:0,e:["广告环境指企业外部的人口、经济、文化、政策与技术力量","把内部资源条件也算作环境，就混淆了外部环境与自身能力"]},
    {id:1039,t:'j',q:"文字围绕图形的编排设计是指图标设计（）",o:["A、正确","B、错误"],a:1,e:["文字绕图只是图文位置的环绕编排，与图标造型设计不是一回事","图标设计属标志符号创作，绕图解决的是版面图文关系"]},
    {id:1040,t:'j',q:"加强职业道德能改变人们的思想观念,但与推进技术进步无关（）",o:["A、正确","B、错误"],a:1,e:["职业道德看似只约束服务态度，容易被判为与技术水平无关","职业道德促使从业者诚信钻研、严把质量，直接推动技术进步"]},
    {id:1041,t:'j',q:"在研究版面的同时,不可忽略对图像视觉“角度”的研究,可以给版面带来崭新的视觉形象和张力的是俯视（）",o:["A、正确","B、错误"],a:1,e:["俯视多用于交代全局与平面展示，视觉张力有限，故非答案","仰视夸大主体、压缩背景，透视对比强烈，才形成新鲜张力"]},
    {id:1042,t:'j',q:"按媒体的功能分类可分为视觉媒体、听觉媒体、视听两用媒体（）",o:["A、正确","B、错误"],a:0,e:["报纸属视觉媒体，广播属听觉媒体，影视属视听两用媒体","只按载体分印刷与电子，就漏掉感官通道这一分类维度"]},
    {id:1043,t:'j',q:"通过Photoshop生成的图像文件为矢量图（ ）",o:["A、正确","B、错误"],a:1,e:["以像素网格记录图像，放大出现锯齿，容易被误认作矢量","其输出为PSD、JPEG等位图格式，矢量图应由Illustrator制作"]},
    {id:1044,t:'j',q:"彩色图像在存储，显示，打印有不同方式。常用的彩色模式有RGB和CMYK两种。",o:["A、正确","B、错误"],a:0,e:["RGB用于屏幕加色显示，CMYK用于印刷减色，二者最常用","只用单一模式时，屏幕鲜艳色彩印刷后明显灰暗失真"]},
    {id:1045,t:'j',q:"Illustrator的出品公司是美国Adobe公司。",o:["A、正确","B、错误"],a:0,e:["Illustrator由Adobe研发，与Photoshop同属其创意软件系列","若误记为Macromedia产品，就与其实际归属公司不符"]},
    {id:1046,t:'j',q:"我国目前见到的最早的能较完整记录语言，盛行于殷商时期的文字是甲骨文（）",o:["A、正确","B、错误"],a:0,e:["殷商甲骨文已具象形、指事、会意、形声，能完整记录语言","陶符刻画零散不成系统，尚不能连贯记录语言，故非最早"]},
    {id:1047,t:'j',q:"像素点越多，图像的分辨率越高，相应的图像的文件量则会随之增大（）",o:["A、正确","B、错误"],a:0,e:["像素数量决定分辨率高低，像素多则图像数据量随之增大","认为分辨率与文件大小无关，忽视了像素数据量的累积"]},
    {id:1048,t:'j',q:"Window>New Window（窗口>新窗口）命令，对同一个文件只能建立两个窗口，当创建第三个窗口时，第二个窗口会自动被替换",o:["A、正确","B、错误"],a:1,e:["新建窗口可反复执行，数量不受两个限制，已有窗口始终保留","同一文件多个窗口显示独立视图，新建第三个不会替换第二个"]},
    {id:1049,t:'j',q:"位图能够真实地描述图像，但它的缺点是容量大，而且放大后会失真（ ）",o:["A、正确","B、错误"],a:0,e:["位图以像素点记录图像，层次真实，但体积大且放大后出现马赛克","矢量图用数学路径描述图形，放大不失真且文件小，与位图相反"]},
    {id:1050,t:'j',q:"Illustrator是以处理矢量图形为主的图形绘制软件，而Photoshop是以处理像素图为主的图像处理软件（）",o:["A、正确","B、错误"],a:0,e:["Illustrator以路径绘制矢量图，Photoshop以像素处理图像，定位不同","事实相反，Illustrator核心为矢量路径，Photoshop核心为像素点"]},
    {id:1051,t:'j',q:"在单元格内不能继续插入整个表格是正确的（）",o:["A、正确","B、错误"],a:1,e:["单元格内可以再插入一个完整表格，形成表格套表格的嵌套结构","单元格允许再插入表格做嵌套排版，故不能插入的说法错误"]},
    {id:1052,t:'j',q:"对于文化程度较低的消费者和女性公众，应该用理性的广告表现手法。",o:["A、正确","B、错误"],a:1,e:["理性表现适合文化程度高、高卷入度受众，对上述人群效果弱","这类受众宜用感性手法，靠直观形象与情感共鸣打动，而非说理"]},
    {id:1053,t:'j',q:"在一个框架的属性面板中，不能设置边框宽度（）",o:["A、正确","B、错误"],a:1,e:["框架属性面板可设定边框宽度和颜色，说不能设置并不成立","框架属性面板含边框宽度设置项，可调整框架线粗细，确能设置"]},
    {id:1054,t:'j',q:"如果要观察图形的线条状态，可选择View > Outline（视野>线条）命令。用线条状态显示的好处是可以减少屏幕刷新的速度，尤其对于复杂的图形可大大提高工作效率",o:["A、正确","B、错误"],a:0,e:["轮廓视图仅显示路径线条，隐藏填充与效果，刷新更快更省资源","线条视图减少渲染运算加快刷新，复杂图形效率更高，说法成立"]},
    {id:1055,t:'j',q:"使用污点修女画笔工具时,不需要冉先取样（）",o:["A、正确","B、错误"],a:0,e:["污点修复画笔自动取样周围像素融合修补，无需按住Alt键取样","取样是修复画笔工具的操作要求，污点修复画笔可自动取样"]},
    {id:1056,t:'j',q:"“脑力激荡法”是美国BBDO广告公司的奥格威于1938年所首创。（）",o:["A、正确","B、错误"],a:1,e:["首创者是BBDO的奥斯本，1938年提出，并非奥格威，人物张冠李戴","脑力激荡法由奥斯本首创并倡导，奥格威以品牌形象论闻名"]},
    {id:1057,t:'j',q:"色彩有三原色、四间色之分,四间色是指蓝（）",o:["A、正确","B、错误"],a:1,e:["间色由两个原色相混生成，仅橙、绿、紫三种，无四间色之称","三原色两两相混得橙绿紫三间色，称四间色或单指蓝均错"]},
    {id:1058,t:'j',q:"Web安全色所能够显示的颜色种类为千万种颜色（）",o:["A、正确","B、错误"],a:1,e:["全彩色可呈现千万种颜色，Web安全色仅216种，两者不可混同","Web安全色由RGB各六阶组合成216种固定色，千万种说法夸大"]},
    {id:1059,t:'j',q:"书籍版面设计包括封面（）",o:["A、正确","B、错误"],a:0,e:["书籍版面设计含封面、扉页、目录与正文版心，封面属组成部分","封面是书籍版面编排的首要环节，排除封面则整体版式不完整"]},
    {id:1060,t:'j',q:"矢量图形是由一条条的直线或者曲线构成的，在填充颜色时，会按照指定颜色沿轮廓的边缘进行着色（）。",o:["A、正确","B、错误"],a:1,e:["矢量图确由路径构成，但填充针对围合区域而非沿边缘描边","填充按轮廓围合区域整体上色，不是沿边缘逐点着色，描述有误"]},
    {id:1061,t:'j',q:"广告必须具有接受一定广告内容的对象，这种对象的范围通常是非特定的，只有少数特殊广告有特定的对象范围。",o:["A、正确","B、错误"],a:0,e:["广告面向大众传播，接受对象范围宽泛非特定，仅少数广告定向","广告对象通常为广泛公众，特定对象仅见于少数专业广告"]},
    {id:1062,t:'j',q:"仿宋体的特征是笔画粗细均匀、起收笔顿挫明显，风格挺拔秀丽（）",o:["A、正确","B、错误"],a:0,e:["仿宋体横竖笔画粗细接近，起收笔有顿挫，字形挺拔秀丽","宋体横细竖粗、起收笔带装饰角，与仿宋匀细笔画不同"]},
    {id:1063,t:'j',q:"网页设计和平面设计有相似也有不同处,不同处是指互动性（）",o:["A、正确","B、错误"],a:0,e:["网页设计以超链接和交互响应为核心，平面设计为静态单向传达","互动性正是网页有别于平面设计的核心差异，判为错误不成立"]},
    {id:1064,t:'j',q:"电影公司以胶片为元素，图案管以书为元素，这些都是属于象征性标志。（）",o:["A、正确","B、错误"],a:0,e:["以胶片、书籍等具体物象象征行业特征，属象征性标志手法","胶片与书籍以物象寓意行业属性，正是象征性标志的典型用法"]},
    {id:1065,t:'j',q:"在版式设计中,图片的清渐度对图片的视觉没有影响（）",o:["A、正确","B、错误"],a:1,e:["清晰度直接影响图片质感与版面主次，不能说不影响视觉","图片清晰度决定细节呈现，直接改变版面视觉重心，确有影响"]},
    {id:1066,t:'j',q:"RGB色彩模式是印刷的色彩模式？",o:["A、正确","B、错误"],a:1,e:["RGB是屏幕发光的加色模式，仅供显示使用，不是印刷色彩模式","印刷采用CMYK减色模式，RGB只适用于屏幕显示，故说法错误"]},
    {id:1067,t:'j',q:"矩形工具绘制矩形时默认为固定大小（）",o:["A、正确","B、错误"],a:1,e:["矩形工具默认拖拽确定任意尺寸，按住Shift才约束为正方形","矩形工具默认拖拽定义大小，固定尺寸需在创建对话框中输入"]},
    {id:1068,t:'j',q:"使用自由变换工具可以使对象发生旋转、倾斜、透视等效果",o:["A、正确","B、错误"],a:0,e:["自由变换可对对象做旋转、倾斜、透视与缩放等多种变形","自由变换正是集旋转、倾斜、透视于一体，说不能实现不成立"]},
    {id:1069,t:'j',q:"拉丁文斜体字是由于书写速度快而自然形成的加强字脚而形成的（）",o:["A、正确","B、错误"],a:0,e:["斜体源于手写快速书写，笔画连带倾斜，逐渐形成固定字脚","斜体确由快速书写连带笔势演变而来，与直立印刷体形态不同"]},
    {id:1070,t:'j',q:"色相环中,明度最高的是黄色,最低的是紫色（）",o:["A、正确","B、错误"],a:1,e:["紫色明度高于蓝紫，把最低明度归于紫色并不准确","色相环明度序列中蓝紫最低，紫色明度偏高，故原说法错误"]},
    {id:1071,t:'j',q:"视觉识别在商标设计中,主要是指标志的固定色彩、标志形象和字体的固定搭配（）",o:["A、正确","B、错误"],a:1,e:["视觉识别还含标准色、辅助图形、组合规范与应用系统，不止三项","VI涵盖标志、标准字、标准色及辅助图形等完整系统，不止固定搭配"]},
    {id:1072,t:'j',q:"曲线视觉流程的形式微妙而复杂,通常可概括为三种（）",o:["A、正确","B、错误"],a:1,e:["曲线视觉流程有弧线、回旋、自由曲线等多种，不止三种形式","视觉流程另有直线、导向、反复等类型，曲线形式亦非固定三种"]},
    {id:1073,t:'j',q:"宋代时期，对字体影响最大的是凸版印刷技术（）",o:["A、正确","B、错误"],a:1,e:["宋代雕版刻书直接催生宋体字，雕版印刷才是影响字体的关键","影响字体的是雕版印刷术而非泛指凸版印刷，故原说法不成立"]},
    {id:1074,t:'j',q:"提高刺激物的感染力不能引起人们的注意（）",o:["A、正确","B、错误"],a:1,e:["感染力是吸引无意注意的重要因素，说不能引起注意违背注意规律","增强色彩对比、动感与情感感染力能有效吸引注意，确能引起"]},
    {id:1075,t:'j',q:"印象派画家中的“点彩派”,其绘画原理就是利用了色彩的空间视觉混合（）",o:["A、正确","B、错误"],a:1,e:["点彩派实为新印象派，与印象派并列，归入印象派并不成立","点彩派属新印象派，以细小色点并置实现空间混合，归属表述有误"]},
    {id:1076,t:'j',q:"选区和路径都必须是封闭的（ ）",o:["A、正确","B、错误"],a:0,w:1,e:["路径可为开放路径，仅选区必须封闭，全句不成立","开放路径只描边不填充，路径无需闭合，故全句判断确有错误"]},
    {id:1077,t:'j',q:"标题文字一般选择笔粗一些,视觉度一些的字体（）",o:["A、正确","B、错误"],a:0,e:["标题字需粗壮醒目，便于远距离快速识别，宜选笔画较粗字体","细笔画字体作标题识别力弱，适合正文，标题应当加粗加重"]},
    {id:1078,t:'j',q:"招贴广告设计不属于户外广告（）",o:["A、正确","B、错误"],a:1,e:["招贴可张贴于路牌、候车亭等户外场所，属于户外广告范畴","招贴多以户外张贴方式发布，是户外广告常见形式，说不属于错"]},
    {id:1079,t:'j',q:"直线给人以平静、安详的感觉。",o:["A、正确","B、错误"],a:0,e:["直线方向单一稳定，视觉上给人平静、安定、理性的感受","直线多表现平静与秩序，动荡活泼多由曲线承担，判错不成立"]},
    {id:1080,t:'j',q:"在平面设计中,所黑白字就是指在黑色色上的白色文字（）",o:["A、正确","B、错误"],a:1,e:["黑白字泛指黑底白字或白底黑字的无彩色文字组合，不止一种","黑白字含黑底白字与白底黑字两类，仅限黑底白字过于狭窄"]},
    {id:1081,t:'j',q:"公共标识具有指示性、引导性和制约性（）",o:["A、正确","B、错误"],a:0,e:["公共标识以图形文字指示方向、规范行为，兼具引导与约束作用","公共标识仅作装饰而不具引导制约作用的说法，与其功能相悖"]},

    // ================= 多选题 (106 道) =================
    {id:501,t:'m',q:"关于广告定位理论的正确说法有( )。",o:["A、定位可以随意漂移","B、定位应基于市场调研","C、在消费者心智中占据独特位置","D、找出与竞争对手的差异点"],a:[1,2,3],e:["定位需长期稳定积累，随意漂移会模糊品牌在消费者心中的印象","定位以市场调研与消费者认知分析为前提，不能凭主观臆断确定","定位核心是在消费者心智中占据区别于竞品的独特位置","定位要通过比较找出与竞争对手的差异点并放大，形成区隔"]},
    {id:502,t:'m',q:"Dreamweaver中插入Flash动画，就可以在属性面板中设置( )相关属性。",o:["A、设置Flash动画内部按钮的交互","B、读取网页文件的同时立即播放","C、Flash动画的循环播放","D、通过Wmode设置透明","E、可以选择已经定义好的样式"],a:[1,2,3,4],e:["按钮交互由Flash影片内部脚本实现，Dreamweaver属性面板无法设置","属性面板可设自动播放，使网页载入时立即播放该动画","属性面板可勾选循环选项，控制Flash动画重复播放","属性面板Wmode可选透明，使动画背景透出网页底色","属性面板可套用已定义的样式，统一动画对象的外观表现"]},
    {id:503,t:'m',q:"Photoshop中的图层类型有( )。",o:["A、色板","B、普通图层","C、形状图层","D、滤镜库"],a:[1,2],e:["色板是存储与调用颜色的调板，不构成图层类型","普通图层承载像素图像，可调混合模式与不透明度","形状图层由矢量路径加填充构成，可随时改形状与颜色","滤镜库是滤镜集合面板，用于施加效果而非图层类型"]},
    {id:504,t:'m',q:"广告摄影常用的构图方法有( )。",o:["A、三分法构图","B、引导线构图","C、对称构图","D、无构图法"],a:[0,1,2],e:["三分法把主体置于九宫格交点，画面均衡且富有张力","引导线借道路、线条把视线引向主体，增强纵深与聚焦","对称构图以中轴均分画面，营造庄重稳定的秩序感","无构图法并不存在，任何画面都有经营位置的构图关系"]},
    {id:505,t:'m',q:"印刷排版中字号采用的计量制有( )。",o:["A、号数制","B、点数制（磅）","C、倍率制","D、毫米制"],a:[0,2],w:1,e:["号数制以初号、一号等字号等级表示字的大小，为传统排版常用","点数制以磅为单位，是印刷字号通用计量制，应属正确","倍率制按字号倍率缩放文字大小，用于版式比例调整","毫米多用于度量版面与图片尺寸，字号计量另有号数与点数体系"]},
    {id:506,t:'m',q:"广告通常可以根据( )等不同角度来进行分类。",o:["A、诉求方式","B、传播区域","C、广告内容","D、表现形式","E、广告对象"],a:[0,1,2,3,4],e:["按诉求方式可分为理性诉求广告与感性诉求广告","按传播区域可分为全国性、区域性、地方性广告","按广告内容可分为商品广告、企业形象广告与公益广告","按表现形式可分为平面、影视、广播、网络等广告","按广告对象可分为消费者广告与产业用户广告"]},
    {id:507,t:'m',q:"广告摄影中常用的布光方式有( )。",o:["A、倒计时","B、侧光","C、顺光","D、底片"],a:[1,2],e:["倒计时是拍摄计时手段，不属于布光方式","侧光从被摄体侧面投射，能强化质感与立体感","顺光与相机同向照射，画面明亮平整但立体感弱","底片是感光材料，属成像载体而非布光方式"]},
    {id:508,t:'m',q:"职业道德规范'诚信'的特征包括( )",o:["A、智慧性","B、模糊性","C、止损性","D、表象性"],a:[0,3],e:["诚信需以智慧把握分寸，兼顾原则与灵活处理","诚信要求明确具体，模糊性会削弱其可信度","诚信强调守信守约，止损性属风险控制范畴","诚信通过外在言行表象体现，可被他人感知"]},
    {id:509,t:'m',q:"VI设计的基本要素包括( )。",o:["A、标志","B、标准字","C、员工工牌","D、名片"],a:[0,1],e:["标志是VI核心基本要素，承载品牌识别符号","标准字规定品牌名称的固定字体形态","员工工牌属VI应用要素，是基本要素的延展","名片属办公事务用品，归入VI应用要素"]},
    {id:510,t:'m',q:"以下关于对变体设计方法的描述正确的是( )。",o:["A、变体设计的方法有4大类","B、变体设计的方法有类推变化、装饰变化、立体变化","C、类推变化是不改变笔画基本形态按比例变形","D、寓意变化采用表象和表意两种方法","E、寓意变化采用比喻和隐喻两种方法"],a:[0,2,3],e:["变体设计方法共分四大类，属教材通行划分","遗漏寓意变化一类，方法归纳不完整","类推变化保持笔画基本形态，按比例伸缩变形","寓意变化通过表象与表意两种方式传达含义","比喻隐喻属修辞手法，非寓意变化的分类表述"]},
    {id:511,t:'m',q:"广告创意的思维方法包括( )。",o:["A、水平思维","B、垂直思维","C、发散思维","D、收敛思维"],a:[0,1,2,3],e:["水平思维横向跳跃，从不同方向寻找新方案","垂直思维沿逻辑纵深推进，逐步推演得出结论","发散思维由一个起点向多方向辐射出大量构想","收敛思维从众多方案中筛选整合出最优解"]},
    {id:512,t:'m',q:"品牌资产的构成要素包括( )。",o:["A、品牌知名度","B、品牌忠诚度","C、感知质量","D、品牌联想"],a:[0,1,2,3],e:["品牌知名度是消费者识别与回忆品牌的能力","品牌忠诚度体现重复购买与持续偏好的程度","感知质量是消费者对产品品质的主观评价","品牌联想是记忆中与品牌相连的意义网络"]},
    {id:513,t:'m',q:"平面广告的构成要素包括( )。",o:["A、标题","B、正文","C、插图","D、随文"],a:[0,1,2,3],e:["标题置于醒目位置，承担吸引注意与点题作用","正文展开说明产品或服务信息，说服受众","插图以图形影像强化诉求，提升视觉吸引力","随文交代品牌名称、地址、联系方式等"]},
    {id:514,t:'m',q:"色彩的心理效应包括( )。",o:["A、冷暖感","B、轻重感","C、软硬感","D、远近感"],a:[0,1,2,3],e:["冷暖感由色相决定，红橙为暖、蓝青为冷","轻重感源于明度，高明度显轻、低明度显重","软硬感与明度纯度相关，浅淡柔和显软","远近感靠冷暖纯度，暖亮色前进、冷暗色后退"]},
    {id:515,t:'m',q:"广告媒介选择的依据包括( )。",o:["A、目标受众","B、产品特性","C、预算限制","D、媒介特性"],a:[0,1,2,3],e:["目标受众的媒介接触习惯决定投放选择","产品特性决定所需媒介的表现力与场景","预算约束投放规模与媒介组合的档次","媒介的覆盖、时效、成本构成选择依据"]},
    {id:516,t:'m',q:"数字营销的特点包括( )。",o:["A、可测量性","B、互动性","C、个性化","D、实时性"],a:[0,1,2,3],e:["数据可追踪点击与转化，效果能够量化评估","用户可即时反馈参与，形成双向沟通","依据用户数据推送定制内容，做到千人千面","投放与响应即时发生，可实时调整策略"]},
    {id:2001,t:'m',q:"包装设计的构成要素包括(　　)。",o:["A、材料","B、图形与文字","C、造型与结构","D、色彩"],a:[0,1,2,3],e:["材料决定包装的强度、质感与成本","图形与文字传递品牌信息与产品说明","造型与结构影响保护性能和使用便利","色彩影响货架识别与消费者的情感联想"]},
    {id:2002,t:'m',q:"关于字体版权的说法正确的有(　　)。",o:["A、商用前应确认字体的授权范围","B、可选用免费可商用的字体","C、系统自带字体必然可以商用","D、字库侵权可能带来法律风险和经济赔偿"],a:[0,1,2],w:1,e:["商用前须核对授权范围，超范围使用即侵权","免费可商用字体许可明确，可放心使用","系统自带字体仅限本机使用，商用需授权","字库侵权确会带来法律风险与经济赔偿"]},
    {id:2003,t:'m',q:"确定品牌标准色应考虑的因素有(　　)。",o:["A、色彩数量越多越好","B、与竞品形成区隔","C、行业属性与产品特征","D、目标受众的文化心理"],a:[0,1,2],w:1,e:["标准色宜精简，色彩过多削弱识别","与竞品形成色彩区隔，避免受众混淆品牌","结合行业属性与产品特征选择主色调","目标受众文化心理确属应考虑因素"]},
    {id:2004,t:'m',q:"信息图表设计应遵循的原则有(　　)。",o:["A、数据真实准确、不产生误导","B、配色合理区分数据系列","C、装饰越华丽越好、可忽略数据","D、图形化表达直观易懂"],a:[0,1,2],w:1,e:["数据须真实准确，避免断章取义造成误导","配色应区分数列并兼顾色盲用户的辨识","装饰应为数据服务，不可喧宾夺主","图形化表达直观易懂，属应循原则"]},
    {id:2005,t:'m',q:"关于色彩心理的说法正确的有(　　)。",o:["A、黑色在所有文化中都象征喜庆","B、红色常用于喜庆和警示场合","C、绿色象征生命与环保","D、蓝色给人科技、冷静之感"],a:[0,2,3],w:1,e:["黑色多表庄重哀悼，非普世喜庆色","红色表喜庆警示，属常见文化象征","绿色象征生命、自然与环保，具普遍共识","蓝色传递科技、冷静、理性与信任之感"]},
    {id:2006,t:'m',q:"Photoshop中调整图像色彩可使用的命令有(　　)。",o:["A、色阶","B、字距调整","C、曲线","D、对齐分布"],a:[0,2],e:["色阶通过调整黑白场与中间调改变明暗对比","字距调整属文字排版功能，并不改变色彩","曲线可精确调整各色调区的亮度与对比","对齐分布是对象排列操作，与色彩调整无关"]},
    {id:2007,t:'m',q:"常用的矢量图形设计软件有(　　)。",o:["A、Illustrator","B、CorelDRAW","C、Word","D、Photoshop"],a:[0,2],w:1,e:["Illustrator以路径绘制图形，是主流矢量软件","CorelDRAW同为矢量软件，应计入正确项","Word为文字处理软件，非矢量设计工具","Photoshop以像素处理为主，属位图图像软件"]},
    {id:2008,t:'m',q:"企业宣传册设计应做到(　　)。",o:["A、各页风格各异、互不关联","B、信息层级清晰","C、整体结构完整","D、图文比例恰当"],a:[0,2,3],w:1,e:["宣传册各页应统一风格，忌杂乱无章","信息层级清晰是宣传册的基本要求","整体结构完整，形成清晰的起承转合逻辑","图文比例恰当，避免文字过密或图片堆砌"]},
    {id:2009,t:'m',q:"画册常用的装订方式有(　　)。",o:["A、悬浮装","B、骑马订","C、无线胶订","D、螺旋彩带装"],a:[0,2],w:1,e:["悬浮装非常见装订工艺，画册少用","骑马订是画册常用的装订方式","无线胶订以胶粘书脊，适合较厚的画册","螺旋彩带装非行业标准装订名称"]},
    {id:2010,t:'m',q:"头脑风暴法的基本规则有(　　)。",o:["A、追求数量、先求多后求精","B、鼓励在他人的想法上组合改善","C、当场批评否定不合常规的想法","D、自由联想、欢迎大胆想法"],a:[0,2,3],w:1,e:["追求数量，先求多后求精，以量求质","鼓励在他人想法上组合改善属基本规则","头脑风暴禁止当场批评，批评应后置","自由联想，欢迎大胆甚至荒诞的构想"]},
    {id:2011,t:'m',q:"AIDMA消费心理法则包含的环节有(　　)。",o:["A、促成记忆与行动","B、引起注意","C、唤起欲望","D、激发兴趣"],a:[0,1,2,3],e:["AIDMA以记忆与购买行动收尾，促成转化","引起注意是广告首要环节，靠视觉冲击实现","唤起欲望使受众产生拥有的心理渴求","激发兴趣让受众愿意进一步了解产品信息"]},
    {id:2012,t:'m',q:"关于文字排版参数的说法正确的有(　　)。",o:["A、行距一般为字号的1.5倍左右较为舒适","B、标题与正文无需层级对比更统一","C、行距越小越容易阅读","D、正文字距不宜过大或过小"],a:[0,1],w:1,e:["行距约为字号1.5倍，阅读舒适不易串行","标题与正文需层级对比以突出重点","行距过小文字拥挤，明显降低阅读效率","正文字距过大过小都会影响阅读"]},
    {id:2013,t:'m',q:"建立版面视觉层级可采用的手法有(　　)。",o:["A、大小对比","B、位置与疏密安排","C、字体选择与变化","D、室内温度"],a:[0,2,3],w:1,e:["大小对比拉开主次，形成明确的视觉顺序","位置与疏密安排是建立层级的常用手法","字体选择与字号变化可区分信息层级","室内温度与版面视觉层级无关"]},
    {id:2014,t:'m',q:"户外广告的常见类型有(　　)。",o:["A、单立柱（高炮）广告","B、灯箱广告","C、LED显示屏广告","D、车身广告"],a:[0,1,2,3],e:["单立柱高炮广告立于路侧，远距离即可看见","灯箱广告以内部光源提升夜间识别度","LED显示屏可播放动态画面并随时更换内容","车身广告借助公交车辆流动覆盖城市"]},
    {id:2015,t:'m',q:"户外广告设计的基本要求有(　　)。",o:["A、信息越全越密越好","B、采用小字号","C、色彩对比强烈","D、突出远视效果"],a:[0,3],w:1,e:["户外信息宜精简，过密难以速读","小字号在远距离无法辨识，应当放大","色彩对比强烈是户外广告的基本要求","突出远视效果，主体与文字需在远处可辨"]},
    {id:2016,t:'m',q:"《广告法》对广告内容的基本要求有(　　)。",o:["A、不得随意承诺功效","B、不得含有虚假或者引人误解的内容","C、不得使用国家级、最高级等绝对化用语","D、可以贬低竞争对手的商品"],a:[0,1,3],w:1,e:["不得对商品功效作无依据的随意承诺","不得含有虚假或引人误解的内容，须真实","广告法禁止使用绝对化用语","广告法禁止贬低竞争对手商品"]},
    {id:2017,t:'m',q:"短视频（动态）广告设计的要点有(　　)。",o:["A、全程无关键信息更简洁","B、开头数秒内抓住注意力","C、字幕越多越好","D、节奏与背景音乐匹配"],a:[0,1],w:1,e:["短视频须在前段呈现关键信息","开头数秒抓住注意力，决定完播与转化","字幕过多遮挡画面，应精炼突出关键词","节奏与背景音乐匹配确有助情绪推进"]},
    {id:2018,t:'m',q:"关于设计作品著作权的说法正确的有(　　)。",o:["A、委托作品的著作权归属可依合同约定","B、职务作品的著作权可能归单位所有","C、作品完成后作者自动享有著作权","D、作品必须登记后才享有权利"],a:[0,1,2],e:["委托作品可按合同约定著作权归属","职务作品在特定条件下著作权归单位","作品完成即自动产生著作权，无需登记","登记仅为初步证明，非取得权利的前提"]},
    {id:2019,t:'m',q:"关于图片版权的说法正确的有(　　)。",o:["A、涉及人物肖像的照片需本人同意","B、商用图片应事先取得授权","C、网上图片都可以随意商用","D、应注意免版税（RF）授权的具体使用范围"],a:[0,1,2],w:1,e:["使用含人物肖像的照片须取得本人同意","商用图片应事先取得授权并保留凭证","网络图片受版权保护，不可随意商用","RF授权仍有使用范围与限制需遵守"]},
    {id:2020,t:'m',q:"关于图像分辨率设置的说法正确的有(　　)。",o:["A、印刷品一般应达到300dpi","B、印刷图像用20dpi即可","C、网页显示图像一般用72dpi","D、印刷分辨率越低图像越清晰"],a:[0,2],e:["印刷品图像分辨率一般应达300dpi","20dpi过低，印刷会出现明显马赛克","网页显示图像通常用72dpi即可","分辨率越低图像越粗糙，不可能更清晰"]},
    {id:2021,t:'m',q:"VI设计的应用要素包括(　　)。",o:["A、招牌与店面","B、办公事务用品","C、交通工具","D、员工服装"],a:[0,1,2,3],e:["招牌与店面统一品牌形象，属环境应用","办公事务用品如信纸信封体现品牌规范","交通工具喷涂标志，形成流动的品牌传播","员工服装统一标识，强化识别与服务形象"]},
    {id:2022,t:'m',q:"容易导致印刷事故的印前做法有(　　)。",o:["A、文件命名规范清晰","B、使用高性能电脑制版","C、文字未转曲或未嵌入","D、图像链接丢失"],a:[0,1],w:1,e:["规范命名有助识别，不会引发印前事故","高性能电脑提升效率，与印刷事故无关","文字未转曲或未嵌入，输出会缺字变形","图像链接丢失导致输出缺图或精度不足"]},
    {id:2023,t:'m',q:"关于文件格式用途的说法正确的有(　　)。",o:["A、PSD保留图层便于修改","B、TIFF适合印刷输出","C、JPG适合照片压缩存储","D、JPG压缩后的信息可无损恢复"],a:[0,1,2],e:["PSD保留图层与通道，便于反复修改","TIFF支持无损压缩与CMYK，适合印刷","JPG体积小，适合照片压缩存储与传输","JPG为有损压缩，丢失信息无法恢复"]},
    {id:2024,t:'m',q:"户外广告点位选择应考虑的因素有(　　)。",o:["A、与周边环境的协调性","B、有效视距与视角","C、人流量与车流量","D、当地设置法规的限制"],a:[0,1,2,3],e:["点位须与周边环境协调，避免破坏景观","考虑有效视距与视角，确保受众看清画面","人流量与车流量决定广告的暴露量","须遵守当地户外广告设置法规与禁设区"]},
    {id:2025,t:'m',q:"以下哪些是广告设计中的视觉元素？( )",o:["A、线条","B、形状","C、色彩","D、文字","E、声音"],a:[0,1,2,3],e:["线条可界定轮廓、引导视线与分割版面","形状构成图形的基本轮廓，传达视觉性格","色彩影响情绪与注意力，是核心视觉元素","文字兼具信息传达与图形化的视觉作用","声音属听觉元素，不属于视觉元素"]},
    {id:2026,t:'m',q:"标志设计应遵循的原则有(　　)。",o:["A、色彩种类越多越好","B、简洁易记","C、识别性强","D、独特有个性"],a:[0,2,3],w:1,e:["标志色彩宜精简，过多不利识别复制","简洁易记是标志设计的核心原则","识别性强，标志需在多种媒介上清晰可辨","独特有个性，避免与同类品牌标志雷同"]},
    {id:2027,t:'m',q:"关于网页设计规范的说法正确的有(　　)。",o:["A、网页必须使用8K分辨率","B、网页图像应直接采用CMYK模式","C、网页图像常用RGB模式","D、应考虑色盲色弱用户的可辨识性"],a:[0,2],w:1,e:["网页分辨率依屏幕而定，无8K强制要求","网页显示采用RGB，CMYK用于印刷输出","网页图像常用RGB模式，以适配屏幕显示","兼顾色盲色弱辨识确属网页设计规范"]},
    {id:2028,t:'m',q:"在广告设计中，以下哪些排版原则有助于提升视觉效果？( )",o:["A、对齐","B、对比","C、平衡","D、重复","E、空间"],a:[0,1,2,3,4],e:["对齐使元素形成秩序，避免版面松散凌乱","对比通过大小粗细差异突出重点信息","平衡让版面重量分布稳定，分对称与不对称","重复统一色彩与图形语言，强化整体识别","留白即空间处理，可分隔信息并提升格调"]},
    {id:2029,t:'m',q:"常用的专业排版软件有(　　)。",o:["A、Word","B、方正飞腾","C、InDesign","D、记事本"],a:[0,2],w:1,e:["Word具备图文排版功能，可完成常规版面","方正飞腾是中文专业排版软件","InDesign是专业排版软件，擅长多页版面","记事本仅有纯文本编辑功能，不含排版"]},
    {id:2030,t:'m',q:"著作权即版权，是作者或者其他著作权人对(　　)作品依法享有的专有权利。",o:["A、商业","B、文学","C、艺术","D、科学","E、设计"],a:[1,2,3],e:["商业本身非作品类型，属使用领域划分","文字作品即文学作品，受著作权法保护","美术、音乐等艺术作品属法定保护客体","自然科学与社会科学作品均受法律保护","设计成果可归入美术作品，非独立作品类别"]},
    {id:2031,t:'m',q:"平面构成的三个基本要素是(　　)。",o:["A、面","B、点","C、线","D、体块"],a:[0,1,2],e:["面是点线密集扩展形成的二维形态，属构成三要素","点是最小构成单位，位置与聚散决定视觉张力","线是点移动的轨迹，有方向、粗细与曲直变化","体块属三维立体构成范畴，超出平面构成要素"]},
    {id:2032,t:'m',q:"产品摄影常用的背景处理方式有(　　)。",o:["A、无缝背景纸","B、纯白底便于后期抠图","C、场景（环境）背景","D、渐变背景"],a:[0,1,2,3],e:["无缝背景纸可得纯净背景，避免接缝干扰主体","纯白底拍摄便于后期抠像，电商产品常用","场景背景营造使用情境，增强产品代入感","渐变背景以明暗过渡衬托主体，层次自然"]},
    {id:2033,t:'m',q:"职业道德对职业技能的作用表现为( )",o:["A、决定作用","B、促进作用","C、支撑作用","D、统领作用"],a:[1,2,3],e:["技能水平由训练与经验决定，道德不起决定作用","良好职业道德促使人钻研技能，推动技能提升","职业道德为技能发挥提供方向与责任支撑","职业道德统领职业行为方向，引导技能正确使用"]},
    {id:2034,t:'m',q:"影响摄影景深的主要因素有(　　)。",o:["A、白平衡","B、光圈","C、焦距","D、快门线"],a:[0,2],w:1,e:["白平衡只校正色彩还原，不影响景深","光圈孔径越小景深越大，是主要因素","焦距越长景深越浅，广角镜头景深大","快门线只是减震附件，不改变景深范围"]},
    {id:2035,t:'m',q:"在CorelDRAW中，矢量图形不能导出的位图格式有(　　)。",o:["A、JPG","B、TIF","C、TEX","D、AI","E、WORD"],a:[2,4],e:["JPG是常用位图格式，CorelDRAW可直接导出","TIF支持无损压缩，属可导出的位图格式","TEX是排版源码文本格式，无法由矢量图导出","AI属矢量交换格式，可导出但不属位图","WORD是文档格式，不能作为位图导出"]},
    {id:2036,t:'m',q:"广告设计师与客户沟通的正确做法有(　　)。",o:["A、按时提交提案并说明创意依据","B、故意隐瞒工期和费用","C、明确设计需求与目标","D、索取回扣"],a:[0,2],e:["按时提交提案并说明依据，体现专业与守信","隐瞒工期费用损害客户知情权，违背诚信","先明确需求与目标，避免设计方向偏差","索取回扣属商业贿赂，违反职业纪律"]},
    {id:2037,t:'m',q:"DM单页、折页设计应注意(　　)。",o:["A、折页后的阅读顺序","B、折页形式的选择","C、信息主次分明","D、联系信息越隐蔽越好"],a:[0,1,2],e:["折页顺序决定阅读动线，须与内容逻辑一致","折页形式影响展开节奏，按页数与信息量选","信息主次分明便于快速抓取核心卖点","联系方式应醒目易找，隐蔽会流失咨询"]},
    {id:2038,t:'m',q:"优秀广告语应具备的特点有(　　)。",o:["A、简洁易记","B、表达经常更换","C、平淡无感染力","D、突出品牌或产品卖点"],a:[0,2],w:1,e:["简洁易记便于传诵，降低记忆与传播成本","广告语须长期稳定使用，频繁更换损害认知","平淡无感染力难以打动受众，非优点","突出卖点是广告语核心功能，属优点"]},
    {id:2039,t:'m',q:"书籍装帧的种类主要有：(　　)教科书、丛书、生活用书、期刊等。",o:["A、文学艺术书籍","B、说明书籍","C、科技书籍","D、工具书籍","E、儿童书籍"],a:[0,2,3,4],e:["文学艺术书籍以图文审美为主，装帧讲究格调","说明书籍非通行装帧分类，类别划分不成立","科技书籍含图表公式，版式须严谨清晰","工具书籍查阅性强，强调检索与索引编排","儿童书籍开本色彩特殊，须安全易翻阅"]},
    {id:2040,t:'m',q:"广告设计师应具备的职业能力有(　　)。",o:["A、市场与消费者理解能力","B、沟通表达能力","C、审美与创意能力","D、软件操作技能"],a:[0,1,2,3],e:["理解市场与消费者，才能找准传播定位","沟通表达能力保障提案与协作顺畅","审美与创意能力决定视觉表现水平","软件操作技能是设计落地的实现手段"]},
    {id:2041,t:'m',q:"劳动合同须采取书面形式订立，并具备劳动报酬、(　　)、劳动保护和劳动条件等条款。",o:["A、劳动纪律","B、劳动合同终止的条件","C、工作内容","D、劳动合同期限","E、违反劳动合同的责任"],a:[3,4],w:1,e:["劳动纪律是劳动法规定的必备条款","合同终止条件属法定必备条款之一","工作内容是确定劳动义务的必备条款","劳动合同期限是必备条款，明确起止时间","违约责任条款明确双方违约后果，属法定条款"]},
    {id:2042,t:'m',q:"提案汇报的技巧有(　　)。",o:["A、汇报时间越长越好","B、先讲清策略与逻辑","C、聚焦创意亮点展示","D、预判客户可能提出的问题"],a:[0,1,2],w:1,e:["汇报应控制时长，冗长会削弱说服力","先讲策略逻辑，让客户理解创意形成路径","聚焦创意亮点，突出差异化视觉与核心信息","预判客户疑问并备好应答，属必要技巧"]},
    {id:2043,t:'m',q:"摄影影调可分为(　　)。",o:["A、阴影模式","B、无调","C、高调","D、中间调"],a:[0,2],w:1,e:["阴影模式表现暗部层次，非规范分类","无调即画面缺乏明暗层次，属影调缺陷","高调画面以亮部为主，明快通透，属影调类型","中间调层次最丰富，是基本影调类型"]},
    {id:2044,t:'m',q:"广告设计师应遵守的职业道德有(　　)。",o:["A、诚信服务、不夸大设计效果","B、保守客户的商业秘密","C、为赶工随意套用侵权模板","D、尊重原创、不抄袭他人作品"],a:[0,1,3],e:["诚信服务如实说明效果，不夸大承诺","保守客户商业秘密，维护委托方合法权益","套用侵权模板侵犯他人著作权，违反法律","尊重原创不抄袭，是设计从业者的基本操守"]},
    {id:2045,t:'m',q:"广告提案的主要内容有(　　)。",o:["A、项目背景与目标分析","B、创意策略与表现阐述","C、员工工资明细","D、媒介投放与执行计划"],a:[0,2,3],w:1,e:["项目背景与目标分析交代市场环境与传播任务","创意策略与表现阐述是提案核心内容","员工工资明细属内部人事，不入提案","媒介投放与执行计划说明预算、排期与落地"]},
    {id:2046,t:'m',q:"移动端H5广告设计应注意(　　)。",o:["A、交互流程简洁并有引导","B、考虑竖屏显示特点","C、控制文件大小保证加载速度","D、适配不同分辨率的机型"],a:[0,1,2,3],e:["交互流程简洁并设引导，降低用户操作门槛","考虑竖屏显示，画面比例与信息布局随之调整","控制文件大小，避免加载过慢导致跳出","适配多种分辨率机型，防止错位与裁切"]},
    {id:2047,t:'m',q:"标志设计按构成形式可分为(　　)。",o:["A、字母（文字）型","B、图形型","C、随意涂鸦型","D、综合型"],a:[0,2,3],w:1,e:["字母文字型以品牌名称字体变形构成标志","图形型以具象或抽象图形构成，属主要类型","随意涂鸦缺乏规范与识别性，不属分类","综合型结合文字与图形，兼顾识别与寓意"]},
    {id:2048,t:'m',q:"广告效果评估的常用指标有(　　)。",o:["A、认知率","B、到达率（接触率）","C、购买（销售）转化率","D、记忆度"],a:[0,1,2,3],e:["认知率衡量受众知晓品牌或广告信息的比例","到达率反映广告实际接触目标人群的比重","转化率体现接触广告后购买行为的实现程度","记忆度测量受众对广告内容的留存强度"]},
    {id:2049,t:'m',q:"广告受众定位需要考虑的因素有(　　)。",o:["A、天气湿度","B、档案编号","C、收入水平","D、年龄与性别"],a:[0,2],w:1,e:["天气湿度与消费需求无关，非定位因素","档案编号是管理标识，与受众定位无关","收入水平决定购买力，是受众定位关键依据","年龄与性别是受众细分的基本变量"]},
    {id:2050,t:'m',q:"以下选项中，(　　)属于中国古代的广告形式。",o:["A、口头叫卖广告","B、招牌广告","C、声响广告","D、交通工具广告","E、印刷广告"],a:[0,1,2,4],e:["口头叫卖是最早的广告形式，以吆喝招揽顾客","招牌广告以店名字号标识经营，宋代已盛行","声响广告用响器代声，如拨浪鼓、铜锣招客","交通工具广告是近代车体媒介形态，非古代","印刷广告随雕版印刷出现，如宋代广告铜版"]},
    {id:2051,t:'m',q:"下列色彩组合中互为互补色的有(　　)。",o:["A、蓝与绿","B、黄与紫","C、红与绿","D、红与橙"],a:[1,2],e:["蓝与绿在色相环相邻，属邻近色而非互补","黄与紫在色相环相对，混合呈中性灰","红与绿相减混色成黑，属典型互补色","红与橙相距较近，属类似色关系"]},
    {id:2052,t:'m',q:"按媒介分类，广告可分为(　　)。",o:["A、印刷广告","B、电波（影视广播）广告","C、网络广告","D、户外广告"],a:[0,1,2,3],e:["印刷广告依托报纸杂志等纸质媒介传播","电波广告通过广播影视媒介传送视听信息","网络广告以互联网平台为投放载体","户外广告设置在户外空间，如路牌灯箱"]},
    {id:2053,t:'m',q:"品牌标准字体设计应做到(　　)。",o:["A、符合品牌气质","B、越花哨越好","C、笔画风格统一","D、保持识别性"],a:[0,1,2],w:1,e:["字体气质须与品牌调性一致，如稳重或亲和","过度花哨削弱识别性与专业感","笔画风格统一，保证字体整体协调","保持识别性是字体设计的底线"]},
    {id:2054,t:'m',q:"VI中辅助图形的作用有(　　)。",o:["A、处处抢占标志的主视觉地位","B、延展应用于多种媒介","C、丰富版面、增强视觉活力","D、强化品牌识别"],a:[0,1,2],w:1,e:["辅助图形须让位于标志，不得抢主视觉","可延展应用于包装、终端、线上等多种媒介","丰富版面层次，增强画面视觉活力","强化品牌识别是辅助图形的核心作用"]},
    {id:2055,t:'m',q:"留白在版面设计中的作用有(　　)。",o:["A、使版面有呼吸感","B、突出主体信息","C、提升设计质感","D、版面越满越显专业"],a:[0,1,3],w:1,e:["留白形成呼吸感，避免版面拥挤压抑","空白衬托使主体信息更突出、更易聚焦","恰当留白提升品质感，是专业体现","版面过满造成视觉疲劳，非专业标志"]},
    {id:2056,t:'m',q:"广告标题的常用类型有(　　)。",o:["A、间接标题","B、复合标题","C、装饰标题","D、直接标题"],a:[0,2,3],w:1,e:["间接标题含蓄暗示，引发好奇与联想","复合标题由引题正题副题组合，属常用类型","装饰标题重形式美化，非标题性质分类","直接标题直陈品牌与卖点，诉求明确"]},
    {id:2057,t:'m',q:"职业道德的社会作用表现在( )",o:["A、有助于企业有效掌控员工的思想和行为","B、有助于提高人们的社会道德水平，促进社会良好风尚的形成","C、有助于完善人格，促进人的全面发展","D、有助于调整职业利益关系，维护社会生产和生活秩序"],a:[1,2,3],e:["掌控员工思想行为是管理手段，非职业道德作用","提升社会道德水平，促进良好风尚形成","完善人格修养，推动从业者全面发展","调整职业利益关系，维护生产生活秩序"]},
    {id:2058,t:'m',q:"常用的图像文件格式有(　　)。",o:["A、DOC","B、TIFF","C、PSD","D、JPG"],a:[0,1,2],w:1,e:["DOC是文字文档格式，不属图像格式","TIFF支持无损与多图层存储，印刷常用","PSD是Photoshop分层源文件，属图像格式","JPG是常见压缩图像格式，属图像文件"]},
    {id:2059,t:'m',q:"关于常用开本与尺寸的说法正确的有(　　)。",o:["A、国内纸张分大度与正度两个系列","B、开本尺寸可以随意确定","C、设计前应先确认成品尺寸","D、A4纸张尺寸为210mm×297mm"],a:[0,1,2],w:1,e:["国内纸张分大度与正度两系列，幅面尺寸不同","开本由全张纸折叠决定，不能随意定","设计前确认成品尺寸，避免出血与裁切偏差","A4尺寸为210mm×297mm，说法正确"]},
    {id:2060,t:'m',q:"广告策划的主要内容包括(　　)。",o:["A、广告目标与定位","B、市场调查与分析","C、创意与表现策略","D、媒介计划与效果评估"],a:[0,1,2,3],e:["广告目标与定位确定传播方向与目标受众","市场调查与分析提供决策所需的数据依据","创意与表现策略规定信息编码与表达方式","媒介计划与效果评估安排投放并检验成效"]},
    {id:2061,t:'m',q:"易拉宝（展架）设计的正确做法有(　　)。",o:["A、采用竖版构图","B、底部放大号关键文字","C、信息越密越好","D、重要信息宜放在中上部"],a:[0,2],w:1,e:["易拉宝为竖向展架，竖版构图契合其比例","底部文字易被遮挡且不便阅读，非放大位置","信息过密削弱远距离识别效果","中上部为平视范围，宜放关键信息"]},
    {id:2062,t:'m',q:"广告文案的组成部分包括(　　)。",o:["A、随文（附文）","B、标题","C、正文","D、广告语"],a:[0,1,2,3],e:["随文交代品牌名称、地址、联系方式等信息","标题点明主旨，吸引注意并引导阅读","正文展开说明，承担说服与信息传达","广告语凝练品牌主张，长期反复使用"]},
    {id:2063,t:'m',q:"从业人员坚持职业道德规范“公道”的要求包括( )",o:["A、要超然物外","B、立场要坚定","C、方法要灵活","D、要以德服人"],a:[1,2,3],e:["超然物外是回避态度，与公道要求相悖","立场坚定，按原则办事不偏袒","方法灵活，依具体情况妥善处理","以德服人，用品行赢得信任与认同"]},
    {id:2064,t:'m',q:"营销效益分析实质上是通过市场营销控制来实现营销目标的过程，其主要目的是对市场营销的战略性、计划性、盈利能力和效率管理效益进行(　　)，并针对出现的问题及时加以解决。",o:["A、综合策略","B、综合分析","C、监督","D、管理","E、控制"],a:[1,4],e:["综合策略属手段表述，不与效益分析并列","综合分析是对战略、计划、盈利与效率的整体评价","监督强调过程检查，不能涵盖效益评价","管理含义过宽，与效益分析的具体动作不对应","控制指针对问题及时纠偏，保证营销目标实现"]},
    {id:2065,t:'m',q:"常用的印后加工工艺有(　　)。",o:["A、局部UV上光","B、覆膜","C、烫金（烫电化铝）","D、模切压痕"],a:[0,1,2,3],e:["局部UV上光使局部图案高亮，形成质感对比","覆膜在印品表面覆膜，起保护与增亮作用","烫金用电化铝热压转移，形成金属光泽","模切压痕切出外形并压折线，便于成型"]},
    {id:2066,t:'m',q:"常见的促销活动形式有(　　)。",o:["A、买赠","B、折扣","C、抽奖","D、满减"],a:[0,1,2,3],e:["买赠以购买附带赠品刺激即时消费","折扣直接降低售价，短期拉动销量","抽奖以中奖机会吸引参与和关注","满减按消费金额减价，促使凑单提额"]},
    {id:2067,t:'m',q:"关于分辨率概念的说法正确的有(　　)。",o:["A、印刷精度通常用dpi描述","B、同一尺寸下像素越多图像越清晰","C、分辨率指单位尺寸内的像素数量","D、分辨率与清晰度无关"],a:[0,1,2],e:["印刷精度常用dpi表示，即每英寸墨点数","同尺寸下像素越多，图像细节越清晰","分辨率指单位尺寸内所含像素数量","分辨率直接决定清晰度，二者密切相关"]},
    {id:2068,t:'m',q:"下列属于无衬线字体的有(　　)。",o:["A、楷体","B、黑体","C、微软雅黑","D、宋体"],a:[1,2],e:["楷体笔画有起收顿挫，属书法体带装饰意味","黑体笔画粗细均匀、无装饰角，属无衬线","微软雅黑笔画平头无衬线，属无衬线字体","宋体横细竖粗、末端有装饰角，属衬线"]},
    {id:2069,t:'m',q:"关于广告语与标题区别的说法正确的有(　　)。",o:["A、标题随每次广告活动而变化","B、两者含义和用途完全相同","C、广告语长期使用、代表品牌主张","D、广告语追求长期稳定的积累"],a:[0,1,3],w:1,e:["标题随每次广告活动主题变化，针对性强","广告语长期稳定，与标题用途不同","广告语长期使用并承载品牌主张","广告语追求长期积累，形成稳定品牌联想"]},
    {id:2070,t:'m',q:"平面设计常见的版式编排类型有(　　)。",o:["A、均衡式","B、对称式","C、满版式","D、自由式"],a:[0,1,2,3],e:["均衡式以非对称求得视觉重量平衡","对称式沿中轴等量分布，端庄稳定","满版式图形铺满版面，视觉冲击强","自由式打破格律，按内容随形编排"]},
    {id:2071,t:'m',q:"Photoshop中可用于图像修复的工具或功能有(　　)。",o:["A、渐变工具","B、修复画笔工具","C、裁剪工具","D、仿制图章工具"],a:[0,2],w:1,e:["渐变工具只做颜色过渡填充，无修复功能","修复画笔取样周边像素修补污点，是修复主力","裁剪工具只裁切画布尺寸，不改动像素内容","仿制图章复制取样区域覆盖瑕疵，属修复工具"]},
    {id:2072,t:'m',q:"《艺文》全书分为四十六部，涉及设计学科的部卷有(　　)等。",o:["A、“居处部”","B、“产业部”","C、“服饰部”","D、“舟车部”","E、“巧艺部”"],a:[0,1,2,3,4],e:["居处部辑录宫室园林营造，含建筑与室内设计史料","产业部收录农桑百工生产技艺与器物制作内容","服饰部汇集冠服制度与佩饰形制等服饰资料","舟车部记载车船形制与出行器具的制作方法","巧艺部收工艺技巧与制作方法等设计相关门类"]},
    {id:2073,t:'m',q:"关于特殊商品广告的说法正确的有(　　)。",o:["A、食品广告不得涉及疾病预防治疗功能","B、不得利用专家、患者形象证明疗效","C、药品广告须取得审查批准文号","D、烟草广告可以在大众传播媒介随意发布"],a:[0,1,3],w:1,e:["食品安全法禁止食品广告宣称疾病预防治疗功效","药品广告不得以专家患者名义或形象作疗效证明","药品广告发布前须经审查取得批准文号","烟草广告禁止在大众传播媒介发布，非随意"]},
    {id:2074,t:'m',q:"以下哪些是广告设计的创意来源？( )",o:["A、市场调研","B、竞争分析","C、消费者洞察","D、创意团队","E、艺术灵感"],a:[0,1,2,3,4],e:["市场调研获取品类与受众数据，是创意的事实起点","竞争分析找出对手传播空白，形成差异化切入口","消费者洞察挖掘真实需求与痛点，支撑创意立意","创意团队分工激荡产生概念，属组织化创意来源","艺术灵感提供形式语言与审美参照，丰富表现手法"]},
    {id:2075,t:'m',q:"从业人员践行职业道德规范..“奉献”的要求包括( )",o:["A、明确岗位职责","B、全力以赴工作","C、培养职责情感","D、不计任何报酬"],a:[0,1,2],e:["明确岗位职责，才能清楚奉献的着力点与责任边界","全力以赴投入本职工作，是奉献精神的直接体现","培养职责情感，使奉献由被动服从转为自觉自愿","奉献不排斥合理报酬，不计报酬属片面极端理解"]},
    {id:2076,t:'m',q:"造成印刷色差的原因有(　　)。",o:["A、油墨与印刷设备的差异","B、纸张材质影响显色","C、印前校色毫无作用","D、屏幕显示与印刷的色彩模式差异"],a:[0,1,2],w:1,e:["油墨色料与印刷设备性能差异，直接造成呈色偏差","纸张白度、吸收性与表面涂布影响墨色最终显现","印前校色可校正设备色偏，正是控色差手段","屏幕加色与印刷减色色域不同，是主要色差来源"]},
    {id:2077,t:'m',q:"关于敬业，正确的说法是( )",o:["A、在职业规范中，敬业是对从业人员最根本的要求","B、是否敬业是许多著名企业选人用人的首要条件","C、敬业的核心表现是文明礼貌","D、长期从事一项职业，必能产生感悟进而促成敬业的局面"],a:[0,1],e:["敬业是对从业人员最根本的职业道德要求","许多知名企业选人用人首先考察是否敬业","敬业核心是忠于职守、精益求精，而非文明礼貌","敬业需主动修为，久任一职并不必然产生敬业"]},
    {id:2078,t:'m',q:"下列颜色搭配属于同类色搭配的有(　　)。",o:["A、红与绿","B、红与橙红","C、蓝与蓝紫","D、黄与紫"],a:[0,2],w:1,e:["红与绿为互补色，色相差最大，属对比搭配","红与橙红同属红味色相，属同类色搭配","蓝与蓝紫同处蓝色相区，色相差小，属同类色搭配","黄与紫为互补色对，对比强烈，不属同类色搭配"]},
    {id:2079,t:'m',q:"关于矢量图与位图的说法正确的有(　　)。",o:["A、矢量图放大不失真","B、矢量图由路径和节点描述","C、位图放大到一定程度会出现马赛克","D、数码照片属于矢量图"],a:[0,1,2],e:["矢量图以数学路径描述轮廓，放大不产生锯齿失真","矢量图由锚点、路径与填充属性共同定义图形","位图由像素栅格构成，放大后像素可见成马赛克","数码照片由像素记录影像，属位图，不是矢量图"]},
    {id:2080,t:'m',q:"下列属于色彩学三原色的有(　　)。",o:["A、蓝","B、绿","C、黄","D、红"],a:[0,1,3],e:["色光三原色含红绿蓝，蓝光不能由其他色光混合得出","绿是色光三原色之一，与红蓝混合可得白光","黄由红绿光混合而成，属间色，不是三原色","红为色光三原色之一，是加色混合的基础色"]},
    {id:2081,t:'m',q:"处理设计稿修改意见的正确做法有(　　)。",o:["A、所有意见不分对错全部照办","B、重要阶段保留多个版本","C、随意承诺无法实现的工期","D、修改应有明确的创意或客户依据"],a:[0,2],w:1,e:["意见须甄别对错，全部照办会降低设计质量","重要阶段保留多版本，便于回溯比较与回退","工期须按实际工作量评估，随意承诺会失信","修改应据创意逻辑或客户需求，不宜盲从"]},
    {id:2082,t:'m',q:"POP广告的常见形式有(　　)。",o:["A、柜台POP","B、店头POP","C、立地POP","D、吊挂POP"],a:[0,1,2,3],e:["柜台POP置于陈列柜台，近距离提示价格与卖点","店头POP设于门店入口，承担招揽顾客与引导作用","立地POP落地摆放，用于通道引导与堆头促销宣传","吊挂POP悬于通道上方，远距离传递促销信息"]},
    {id:2083,t:'m',q:"从业人员若在工作中违背职业纪律，正确的态度是( )",o:["A、主动改进不足","B、坦诚接受处罚","C、努力修改制度","D、积极查找原因"],a:[0,1,3],e:["违背纪律后主动查找并改进不足，属正确态度","坦诚接受纪律处罚，体现规则意识与责任担当","违纪应反省自身，不能以修改制度推卸个人责任","积极查找违纪原因，防止同类问题再次发生"]},
    {id:2084,t:'m',q:"海报设计的基本构成要素有(　　)。",o:["A、醒目的主标题","B、空调温度设定","C、时间、地点等活动信息","D、主视觉图形"],a:[0,2,3],e:["主标题须醒目，在远距离快速传递核心诉求","海报须标明时间地点等活动信息以引导行动","主视觉图形承担视觉冲击与主题形象表达","空调温度属场地环境事项，不是海报构成要素"]},
    {id:2085,t:'m',q:"展会展台设计应考虑的要素有(　　)。",o:["A、参观动线合理","B、灯光烘托展品","C、品牌形象识别鲜明","D、多媒体互动体验"],a:[0,1,2,3],e:["动线规划引导观众顺序参观，避免拥堵与遗漏","灯光突出展品材质与重点，营造氛围层次","色彩与标识统一，强化品牌识别与记忆","多媒体互动延长停留时间并加深展品理解"]},
    {id:2086,t:'m',q:"Photoshop中可用于精细抠图的方法有(　　)。",o:["A、渐变工具","B、调色命令","C、钢笔工具绘制路径","D、通道抠图"],a:[0,2],w:1,e:["渐变工具用于铺色过渡，不能分离主体背景","调色命令只改变明暗与色彩，不生成抠图选区","钢笔路径精确勾勒边缘，转选区后可干净抠图","通道抠图借明度差异分离发丝等复杂边缘"]},
    {id:2087,t:'m',q:"广告创意应遵循的原则有(　　)。",o:["A、与广告目标无关的炫技","B、简洁明了","C、独创性","D、冗长堆砌"],a:[0,3],w:1,e:["脱离广告目标的炫技会削弱信息传达","简洁明了便于受众快速识记，属基本原则","独创性使广告区别于同类，形成独特记忆点","冗长堆砌加重认知负担，违背简明原则"]},
    {id:2088,t:'m',q:"电商详情页设计的要点有(　　)。",o:["A、信息越杂乱越好","B、无需展示细节","C、使用场景图增强代入感","D、核心卖点前置展示"],a:[0,1],w:1,e:["信息杂乱分散注意力，详情页应分层有序","详情页须展示材质工艺细节以消除购买疑虑","场景图还原使用情境，增强受众代入感","核心卖点置于首屏，符合由主到次的浏览顺序"]},
    {id:2089,t:'m',q:"平面设计构图的基本原则包括(　　)。",o:["A、对称与均衡","B、对比与调和","C、曝光与光圈","D、节奏与韵律"],a:[0,1,3],e:["对称与均衡处理画面重量分布，保持视觉稳定","对比制造主次差异，调和使差异归于整体统一","曝光与光圈属摄影拍摄参数，不属构图原则","节奏与韵律通过重复渐变形成视觉秩序"]},

// ================= 核心逻辑 =================
let currentQ = [];
let locked = {};
let selectedMulti = {};
let score = 0;
let answered = 0;

// Fisher-Yates 洗牌算法
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function startQuiz() {
    // 检查题库数量
    const sPool = QUESTION_DB.filter(q => q.t === 's');
    const jPool = QUESTION_DB.filter(q => q.t === 'j');
    const mPool = QUESTION_DB.filter(q => q.t === 'm');

    if (sPool.length < 67 || jPool.length < 17 || mPool.length < 16) {
        alert(`题库数据不足！\n当前：单选${sPool.length}/67, 判断${jPool.length}/17, 多选${mPool.length}/16\n请补充 QUESTION_DB 数据后再试。`);
        return;
    }

    document.getElementById('home-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('finish-btn').style.display = 'none';

    // 从完整题库中随机抽取
    const singles = shuffle(sPool).slice(0, 67);
    const judges = shuffle(jPool).slice(0, 17);
    const multis = shuffle(mPool).slice(0, 16);

    currentQ = shuffle([...singles, ...judges, ...multis]);
    locked = {};
    selectedMulti = {};
    score = 0;
    answered = 0;

    renderQuestions();
    updateProgress();
}

function renderQuestions() {
    const wrapper = document.getElementById('questions-wrapper');
    wrapper.innerHTML = '';

    currentQ.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'q-card';
        card.dataset.index = index;

        const typeLabel = q.t === 's' ? '[单选]' : (q.t === 'j' ? '[判断]' : '[多选]');
        let html = `<div class="q-title">${index + 1}. ${typeLabel} ${q.q}</div>`;
        html += '<ul class="opt-list">';
        q.o.forEach((opt, optIdx) => {
            html += `<li class="opt-item" data-index="${index}" data-opt="${optIdx}">${opt}</li>`;
        });
        html += '</ul>';
        html += `<div class="exp-box" id="exp-${index}"></div>`;

        card.innerHTML = html;
        wrapper.appendChild(card);

        if (q.t === 'm') selectedMulti[index] = [];
    });

    // 事件委托
    wrapper.addEventListener('click', function(e) {
        const item = e.target.closest('.opt-item');
        if (!item) return;
        const idx = parseInt(item.dataset.index);
        const optIdx = parseInt(item.dataset.opt);
        handleAnswer(idx, optIdx);
    });
}

function handleAnswer(qIndex, optIdx) {
    if (locked[qIndex]) return;
    const q = currentQ[qIndex];
    if (q.t === 'm') {
        handleMultiAnswer(qIndex, optIdx);
    } else {
        handleSingleAnswer(qIndex, optIdx);
    }
}

function handleSingleAnswer(qIndex, optIdx) {
    locked[qIndex] = true;
    answered++;
    const q = currentQ[qIndex];
    const isCorrect = optIdx === q.a;
    if (isCorrect) score++;

    const card = document.querySelector(`.q-card[data-index="${qIndex}"]`);
    const items = card.querySelectorAll('.opt-item');
    items.forEach((el, idx) => {
        el.classList.add('disabled');
        if (idx === q.a) el.classList.add('correct');
        else if (idx === optIdx && !isCorrect) el.classList.add('wrong');
    });

    showExplanation(qIndex, isCorrect);
    updateProgress();
}

function handleMultiAnswer(qIndex, optIdx) {
    const q = currentQ[qIndex];
    const card = document.querySelector(`.q-card[data-index="${qIndex}"]`);
    const items = card.querySelectorAll('.opt-item');
    const clickedItem = items[optIdx];

    if (selectedMulti[qIndex].includes(optIdx)) return;

    const isRightOption = q.a.includes(optIdx);

    if (!isRightOption) {
        // 选错立即判错
        locked[qIndex] = true;
        answered++;
        clickedItem.classList.add('wrong');
        q.a.forEach(correctIdx => items[correctIdx].classList.add('correct'));
        items.forEach(el => el.classList.add('disabled'));
        showExplanation(qIndex, false);
        updateProgress();
    } else {
        // 选对标记状态
        clickedItem.classList.add('selected');
        selectedMulti[qIndex].push(optIdx);

        // 检查是否全部选对
        const allCorrectSelected = q.a.every(ansIdx => selectedMulti[qIndex].includes(ansIdx));
        if (allCorrectSelected) {
            locked[qIndex] = true;
            answered++;
            score++;
            q.a.forEach(ansIdx => {
                items[ansIdx].classList.remove('selected');
                items[ansIdx].classList.add('correct');
            });
            items.forEach(el => el.classList.add('disabled'));
            showExplanation(qIndex, true);
            updateProgress();
        }
    }
}

function showExplanation(qIndex, isCorrect) {
    const q = currentQ[qIndex];
    const expDiv = document.getElementById(`exp-${qIndex}`);
    let html = `<strong>${isCorrect ? '✅ 回答正确' : '❌ 回答错误'}</strong><br>`;
    if (q.w) html += '<div class="exp-warn">⚠ 本题题库给定答案与专业判断不一致，此处按题库原答案标注，建议对照教材核对。</div>';
    q.o.forEach((opt, idx) => {
        const isAnswer = q.t === 'm' ? q.a.includes(idx) : (idx === q.a);
        const cls = isAnswer ? 'is-c' : 'is-w';
        const exp = (q.e && q.e[idx]) ? ('：' + q.e[idx]) : '';
        html += `<div class="exp-item ${cls}">${opt}${exp}</div>`;
    });
    expDiv.innerHTML = html;
    expDiv.classList.add('show');
}

function updateProgress() {
    const total = currentQ.length;
    const pct = total > 0 ? (answered / total) * 100 : 0;
    document.getElementById('progress-fill').style.width = `${pct}%`;
    if (answered >= total) {
        document.getElementById('finish-btn').style.display = 'block';
        setTimeout(() => {
            document.getElementById('finish-btn').scrollIntoView({ behavior: 'smooth' });
        }, 300);
    }
}

function showResult() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    const total = currentQ.length;
    const pct = total > 0 ? Math.round((score / total) * 100) : 0;
    document.getElementById('final-score').innerText = `${pct}%`;
    document.getElementById('stats-detail').innerText = `共 ${total} 题，答对 ${score} 题，答错 ${total - score} 题`;
}
</script>
